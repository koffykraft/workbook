<header class="kkh"><div class="kkh-top"><a class="kkh-brand" href="home.html">KoffyKraft</a><a class="kkh-acct" href="profile.html" aria-label="Me: profile and activity">👤</a></div><nav class="kkh-nav" aria-label="Main"><a href="origin.html" aria-current="page">Origin</a><a href="roast-timer-v14.html">Timer</a><a href="roast-graph.html">Graph</a><a href="roasts.html">Roastbook</a><a href="cup.html">Cup</a><a href="trace.html">Passports</a><a href="account.html">Account</a></nav></header>

<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Trails: walk a farm, a processing site or a buyer's visit, record the path, and add stops with
// notes and photos. Everything stays on this device (IndexedDB "KoffyKraftTrails"); nothing is
// sent to KoffyKraft. Save a trail pack (.zip with GPX, GeoJSON, photos and a page to open it)
// to the phone or a computer to keep or share it.
const $ = s => document.querySelector(s);
function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(el._h);
  el._h = setTimeout(() => el.classList.remove('show'), 2200);
}
const KINDS = [
  'Plot',
  'Nursery',
  'Drying yard',
  'Wet mill',
  'Store',
  'Water',
  'Shade tree',
  'View',
  'Meeting',
  'Other',
];

// ---------- local database ----------
let DBP = null;
function db() {
  return (DBP =
    DBP ||
    new Promise((ok, no) => {
      const r = indexedDB.open('KoffyKraftTrails', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('trails', { keyPath: 'id' });
        d.createObjectStore('photos', { keyPath: 'id' }).createIndex('trail', 'trailId');
      };
      r.onsuccess = () => ok(r.result);
      r.onerror = () => no(r.error);
    }));
}
async function tx(store, mode, fn) {
  const d = await db();
  return new Promise((ok, no) => {
    const t = d.transaction(store, mode),
      s = t.objectStore(store);
    let out;
    Promise.resolve(fn(s)).then(v => (out = v));
    t.oncomplete = () => ok(out);
    t.onerror = () => no(t.error);
  });
}
const req = r =>
  new Promise((ok, no) => ((r.onsuccess = () => ok(r.result)), (r.onerror = () => no(r.error))));
const T = {
  all: () => tx('trails', 'readonly', s => req(s.getAll())),
  get: id => tx('trails', 'readonly', s => req(s.get(id))),
  // changed: when the trail's content last changed; savedAt: when it was last saved or shared as a
  // file. keep = true leaves changed alone (for marking a save).
  put: (t, keep) => {
    const now = new Date().toISOString();
    return tx('trails', 'readwrite', s =>
      req(s.put({ ...t, updated: now, changed: keep ? t.changed || now : now }))
    );
  },
  del: async id => {
    const ps = await P.of(id);
    await tx('photos', 'readwrite', s => ps.forEach(p => s.delete(p.id)));
    return tx('trails', 'readwrite', s => req(s.delete(id)));
  },
};
const P = {
  put: p => tx('photos', 'readwrite', s => req(s.put(p))),
  get: id => tx('photos', 'readonly', s => req(s.get(id))),
  of: trailId => tx('photos', 'readonly', s => req(s.index('trail').getAll(trailId))),
  del: id => tx('photos', 'readwrite', s => req(s.delete(id))),
};
const unsaved = t => !t.draft && (!t.savedAt || t.savedAt < (t.changed || t.updated || ''));
async function markSaved(list) {
  const now = new Date().toISOString();
  for (const t of list) {
    const cur = (await T.get(t.id)) || t;
    cur.changed = cur.changed || cur.updated || now;
    cur.savedAt = now;
    await T.put(cur, true);
  }
}
const slug = t =>
  (t.name || 'trail')
    .replace(/[^\w-]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 40) || 'trail';
const uid = () =>
  crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);

// ---------- numbers ----------
function hav(a, b) {
  const R = 6371008.8,
    rad = Math.PI / 180;
  const dLa = (b[0] - a[0]) * rad,
    dLo = (b[1] - a[1]) * rad;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// pts: [lat, lng, alt|null, acc, time ms]
function stats(pts) {
  let dist = 0,
    gain = 0,
    lo = null,
    hi = null,
    last = null;
  for (let i = 1; i < pts.length; i++) dist += hav(pts[i - 1], pts[i]);
  // GPS heights jump about; count a climb only once it passes 3 m
  for (const p of pts) {
    if (p[2] == null) continue;
    lo = lo == null ? p[2] : Math.min(lo, p[2]);
    hi = hi == null ? p[2] : Math.max(hi, p[2]);
    if (last == null) last = p[2];
    else if (p[2] - last > 3) {
      gain += p[2] - last;
      last = p[2];
    } else if (last - p[2] > 3) last = p[2];
  }
  const ms = pts.length > 1 ? pts[pts.length - 1][4] - pts[0][4] : 0;
  return { dist, gain, lo, hi, ms };
}
const km = m => (m >= 1000 ? r2(m / 1000) + ' km' : Math.round(m) + ' m');
const dur = ms => {
  const m = Math.round(ms / 60000);
  return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min';
};
const when = s => (s ? new Date(s).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '');
function statsHtml(pts) {
  const s = stats(pts);
  return (
    '<div class="stats"><div><b>' +
    km(s.dist) +
    '</b><span>distance</span></div><div><b>' +
    dur(s.ms) +
    '</b><span>time</span></div><div><b>' +
    Math.round(s.gain) +
    ' m</b><span>climb</span></div><div><b>' +
    (s.hi != null ? Math.round(s.hi) + ' m' : '–') +
    '</b><span>highest</span></div></div>'
  );
}

// ---------- photos: shrink on this phone before saving ----------
async function shrink(file, max = 1600) {
  try {
    const bm = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bm.width, bm.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bm.width * k);
    c.height = Math.round(bm.height * k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
    return { blob: blob || file, w: c.width, h: c.height };
  } catch (e) {
    return { blob: file, w: null, h: null };
  }
}
const urls = [];
const blobUrl = b => {
  const u = URL.createObjectURL(b);
  urls.push(u);
  return u;
};
function freeUrls() {
  while (urls.length) URL.revokeObjectURL(urls.pop());
}

// ---------- map ----------
let map = null,
  layer = null;
function mapIn(el) {
  if (map) map.remove();
  meMark = null;
  map = L.map(el, { zoomControl: true }).setView([10.3, 76.6], 8);
  const sat = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxNativeZoom: 18, maxZoom: 21, attribution: 'Esri, Maxar, Earthstar Geographics' }
  );
  const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 20,
    maxNativeZoom: 19,
    attribution: '© OpenStreetMap contributors',
  });
  sat.addTo(map);
  L.control.layers({ Satellite: sat, Street: street }, {}, { position: 'topright' }).addTo(map);
  L.control.scale({ metric: true, imperial: false }).addTo(map);
  layer = L.layerGroup().addTo(map);
  return map;
}
const pinIcon = n =>
  L.divIcon({
    className: '',
    html: '<div class="pin">' + n + '</div>',
    iconSize: [26, 26],
    iconAnchor: [13, 13],
  });
function drawTrail(t, fit) {
  if (!map) return;
  layer.clearLayers();
  const line = t.points.map(p => [p[0], p[1]]);
  if (line.length > 1) L.polyline(line, { color: '#ff7a1a', weight: 5, opacity: 0.95 }).addTo(layer);
  if (line.length)
    L.circleMarker(line[0], {
      radius: 6,
      color: '#fff',
      weight: 2,
      fillColor: '#3f6b5a',
      fillOpacity: 1,
    }).addTo(layer);
  (t.stops || []).forEach((s, i) =>
    L.marker([s.lat, s.lng], { icon: pinIcon(i + 1) })
      .bindTooltip(esc(s.title || 'Stop ' + (i + 1)))
      .on('click', () => {
        const el = document.getElementById('stop-' + s.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      })
      .addTo(layer)
  );
  if (fit) {
    const all = line.concat((t.stops || []).map(s => [s.lat, s.lng]));
    if (all.length > 1) map.fitBounds(all, { padding: [30, 30], maxZoom: 18 });
    else if (all.length) map.setView(all[0], 17);
  }
}

// ---------- list ----------
async function listView() {
  stopWatch();
  const v = $('#view');
  const ts = (await T.all()).sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  const open = ts.filter(unsaved);
  const done = ts.filter(t => !t.draft);
  v.innerHTML =
    '<h1>Trails</h1><div class="sub">Walk an estate, a drying yard or a buyer\'s visit. The phone records the path; you add stops with notes and photos. Like a hiking trail app, for coffee. <b>Trails stay on this device</b>: nothing goes to the cloud. Save a trail pack to your phone or computer to keep it safe or send it to someone.</div>' +
    '<div class="row"><a class="btn primary" href="#rec">● Start a trail</a><label class="btn" style="cursor:pointer">Open a trail file<input id="imp" type="file" accept=".zip,.gpx,.geojson,.json,application/zip,application/gpx+xml" hidden></label></div>' +
    (open.length
      ? '<div class="card" id="nag" style="border-color:var(--coffee)"><b>' +
        open.length +
        (open.length > 1 ? ' trails are' : ' trail is') +
        ' not saved yet.</b><div class="mini">They live only in this browser. Back up all trails to one file, then keep it in Files, iCloud, Dropbox or Google Drive.</div></div>'
      : '') +
    (done.length
      ? '<div class="row" style="margin-top:8px"><button class="btn small primary" id="bk">Back up all trails (.zip)</button>' +
        (navigator.canShare ? '<button class="btn small" id="bkS">Share backup</button>' : '') +
        '</div>'
      : '') +
    '<h2>Your trails</h2>' +
    (ts.length
      ? ts
          .map(t => {
            const s = stats(t.points || []);
            return (
              '<div class="card"><a class="tl" href="#t/' +
              esc(t.id) +
              '"><b>' +
              esc(t.name || 'Trail') +
              '</b><div class="mini">' +
              when(t.created) +
              ' · ' +
              km(s.dist) +
              ' · ' +
              (t.stops || []).length +
              ' stops' +
              (t.draft
                ? ' · <b style="color:var(--bad)">not finished</b>'
                : unsaved(t)
                  ? ' · <b style="color:var(--coffee)">not saved</b>'
                  : ' · saved ' + when(t.savedAt)) +
              '</div></a></div>'
            );
          })
          .join('')
      : '<div class="card mini">No trails yet. Tap Start a trail, then walk. Keep the screen on while you walk: phones stop giving the location to web pages when the screen is off.</div>') +
    '<div class="card mini">Map imagery: Esri World Imagery and OpenStreetMap contributors. Heights come from the phone\'s GPS and can be off by 10 m or more. Photos are made smaller on the phone (longest side 1600 px) before they are kept.</div>';
  $('#imp').onchange = e => importFile(e.target.files[0]);
  const name = 'koffykraft-trails-' + new Date().toISOString().slice(0, 10) + '.zip';
  if ($('#bk'))
    $('#bk').onclick = async () => {
      save(await backupAll(done), name);
      await markSaved(done);
      listView();
    };
  if ($('#bkS'))
    $('#bkS').onclick = async () => {
      const f = new File([await backupAll(done)], name, { type: 'application/zip' });
      if (!navigator.canShare({ files: [f] })) return save(f, name);
      try {
        await navigator.share({ files: [f], title: 'KoffyKraft trails' });
        await markSaved(done);
        listView();
      } catch (e) {}
    };
}

// ---------- recording ----------
let watch = null,
  wake = null,
  REC = null,
  meMark = null;
function stopWatch() {
  if (watch != null) navigator.geolocation.clearWatch(watch);
  watch = null;
  if (wake) wake.release().catch(() => {});
  wake = null;
}
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && watch != null) keepAwake();
});
async function recView() {
  const v = $('#view');
  const drafts = (await T.all()).filter(t => t.draft);
  REC = drafts[0] || {
    id: uid(),
    name: 'Trail ' + new Date().toLocaleDateString(),
    kind: 'Farm walk',
    created: new Date().toISOString(),
    points: [],
    stops: [],
    draft: true,
    paused: true,
  };
  v.innerHTML =
    '<div class="rec-map"><a class="link" href="#">‹ Trails</a><h1>Recording</h1><div class="sub">Keep this screen open while you walk. Tap 📷 Photo here or ＋ Stop at anything worth showing: a plot, the drying beds, a spring. The buttons stay at the bottom of the screen.</div>' +
    '<div id="map"></div><div class="live" id="live">Waiting for the location…</div><div id="st"></div>' +
    '<div class="row recbar"><button class="btn rec" id="go"></button><button class="btn" id="cam">📷 Photo here</button><button class="btn" id="stop">＋ Stop</button><button class="btn" id="fin">Finish</button></div></div>';
  mapIn('map');
  drawTrail(REC, true);
  $('#st').innerHTML = statsHtml(REC.points);
  const btn = () =>
    ($('#go').textContent = REC.paused ? (REC.points.length ? '● Resume' : '● Start') : '❚❚ Pause');
  btn();
  if (!('geolocation' in navigator)) $('#live').textContent = 'This browser cannot give the location.';
  else
    watch = navigator.geolocation.watchPosition(
      pos => onPos(pos),
      err =>
        ($('#live').textContent =
          'Location: ' + err.message + '. Allow location for this site and try again.'),
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 }
    );
  keepAwake();
  $('#go').onclick = async () => {
    REC.paused = !REC.paused;
    btn();
    await T.put(REC);
  };
  // A stop where you stand; before the first GPS fix, at the middle of the map (said in the sheet).
  const here = () => {
    const last = REC.lastFix;
    if (last) return { lat: last[0], lng: last[1], alt: last[2], t: last[4] };
    const c = map && map.getCenter ? map.getCenter() : null;
    return c && isFinite(c.lat)
      ? { lat: r6(c.lat), lng: r6(c.lng), alt: null, t: Date.now(), guess: true }
      : null;
  };
  const newStop = camera => {
    const at = here();
    if (!at) return toast('No location yet');
    stopSheet(REC, at, async () => {
      await T.put(REC);
      drawTrail(REC, false);

async function onPos(pos) {
  const c = pos.coords,
    fix = [
      r6(c.latitude),
      r6(c.longitude),
      c.altitude != null ? r1(c.altitude) : null,
      Math.round(c.accuracy || 0),
      pos.timestamp || Date.now(),
    ];
  if (!REC) return;
  REC.lastFix = fix;
  $('#live').innerHTML =
    'Here: <b>' +
    fix[0].toFixed(5) +
    ', ' +
    fix[1].toFixed(5) +
    '</b> · accurate to ' +
    fix[3] +
    ' m' +
    (fix[2] != null ? ' · height ' + Math.round(fix[2]) + ' m' : '') +
    (REC.paused ? ' · paused' : ' · recording');
  if (map) {
    if (!meMark)
      meMark = L.marker([fix[0], fix[1]], {
        icon: L.divIcon({
          className: '',
          html: '<div class="me"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9],
        }),
      });
    meMark.setLatLng([fix[0], fix[1]]).addTo(map);
    if (!REC.points.length) map.setView([fix[0], fix[1]], 17);
  }
  if (REC.paused || fix[3] > 50) return; // skip rough fixes
  const last = REC.points[REC.points.length - 1];
  if (last && hav(last, fix) < 5 && fix[4] - last[4] < 30000) return;
  REC.points.push(fix);
  drawTrail(REC, false);
  $('#st').innerHTML = statsHtml(REC.points);
  await T.put(REC);
}

function geo(t, names) {

      geometry: {
        type: 'LineString',

        kind: s.kind,
        text: s.text,
        time: iso(s.t),
        photos: names ? (s.photos || []).map(id => names[id]).filter(Boolean) : undefined,

      geometry: { type: 'Point', coordinates: s.alt != null ? [s.lng, s.lat, s.alt] : [s.lng, s.lat] },

async function packFiles(t, photos, dir) {
  const names = {},
    files = [];
  let n = 0;
  for (const s of t.stops || [])
    for (const id of s.photos || []) {
      const p = photos[id];
      if (!p) continue;
      names[id] = 'photos/' + String(++n).padStart(3, '0') + '.jpg';
      files.push([dir + names[id], new Uint8Array(await p.blob.arrayBuffer())]);
    }

  const keep = { ...t, photoFiles: names };

  files.unshift(
    [dir + 'index.html', enc.encode(packPage(t, names))],
    [dir + 'trail.gpx', enc.encode(gpx(t))],
    [dir + 'trail.kml', enc.encode(kml(t))],
    [dir + 'trail.geojson', enc.encode(JSON.stringify(geo(t, names), null, 1))],
    [dir + 'koffykraft-trail.json', enc.encode(JSON.stringify(keep))]

// Minimal zip, files stored as they are (photos are already compressed). CRC-32 as the format needs.
const CRC = (() => {

    h.setUint16(4, 20, true);
    h.setUint16(6, 0x0800, true); // names in UTF-8
    h.setUint16(8, 0, true);
    h.setUint16(10, tm, true);
    h.setUint16(12, dt, true);
    h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true);
    h.setUint32(22, data.length, true);
    h.setUint16(26, nm.length, true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true);
    c.setUint16(6, 20, true);
    c.setUint16(8, 0x0800, true);
    c.setUint16(12, tm, true);
    c.setUint16(14, dt, true);
    c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true);
    c.setUint32(24, data.length, true);
    c.setUint16(28, nm.length, true);
    c.setUint32(42, off, true);
    dir.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const size = dir.reduce((a, p) => a + p.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, files.length, true);
  e.setUint16(10, files.length, true);
  e.setUint32(12, size, true);
  e.setUint32(16, off, true);
  return new Blob([...parts, ...dir, new Uint8Array(e.buffer)]);
}
// Read a zip: stored files, and deflated ones where the browser can inflate.
async function unzip(buf) {
  const b = new Uint8Array(buf),
    v = new DataView(buf),
    out = {};
  let e = b.length - 22;
  while (e >= 0 && v.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('not a zip file');
  let p = v.getUint32(e + 16, true);
  const n = v.getUint16(e + 10, true),
    dec = new TextDecoder();
  for (let i = 0; i < n; i++) {
    const method = v.getUint16(p + 10, true),
      csize = v.getUint32(p + 20, true),
      nl = v.getUint16(p + 28, true),
      xl = v.getUint16(p + 30, true),
      cl = v.getUint16(p + 32, true),
      lo = v.getUint32(p + 42, true);
    const name = dec.decode(b.slice(p + 46, p + 46 + nl));
    const start = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
    const raw = b.slice(start, start + csize);
    if (method === 0) out[name] = raw;
    else if (method === 8 && 'DecompressionStream' in window)
      out[name] = new Uint8Array(
        await new Response(
          new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
        ).arrayBuffer()
      );
    p += 46 + nl + xl + cl;
  }
  return out;
}
// One trail out of a pack. dir: its folder inside the zip ('' for a single trail pack).
// A trail already on this device with the same content is skipped, so a backup can be opened twice.
async function importPack(z, dir) {
  const t = JSON.parse(new TextDecoder().decode(z[dir + 'koffykraft-trail.json']));
  const names = t.photoFiles || {};
  delete t.photoFiles;
  const here = t.id && (await T.get(t.id));
  if (here && (here.changed || here.updated) === (t.changed || t.updated)) return null;
  if (!t.id || here) t.id = uid();
  const idMap = {},
    photos = [];
  for (const [oldId, path] of Object.entries(names))
    if (z[dir + path]) {
      const nid = uid();
      idMap[oldId] = nid;
      photos.push({ id: nid, trailId: t.id, blob: new Blob([z[dir + path]], { type: 'image/jpeg' }) });
    }
  for (const s of t.stops || []) s.photos = (s.photos || []).map(id => idMap[id]).filter(Boolean);
  for (const p of photos) p.stopId = ((t.stops || []).find(s => s.photos.includes(p.id)) || {}).id;
  t.draft = false;
  t.changed = t.changed || t.updated || new Date().toISOString();
  t.savedAt = new Date().toISOString(); // it came from a file, so a copy exists
  await T.put(t, true);
  for (const p of photos) await P.put(p);
  return t.id;
}
async function importFile(f) {
  if (!f) return;
  try {
    const name = f.name.toLowerCase();
    let t;
    if (name.endsWith('.zip')) {
      const z = await unzip(await f.arrayBuffer());
      const packs = Object.keys(z).filter(k => /(^|\/)koffykraft-trail\.json$/.test(k));
      if (packs.length) {
        const ids = [];
        let skipped = 0;
        for (const k of packs) {
          const id = await importPack(z, k.slice(0, -'koffykraft-trail.json'.length));
          if (id) ids.push(id);
          else skipped++;
        }
        toast(
          (ids.length ? 'Opened ' + ids.length + ' trail' + (ids.length > 1 ? 's' : '') : 'Nothing new') +
            (skipped ? '; ' + skipped + ' already on this device' : '')
        );
        if (ids.length === 1 && packs.length === 1) location.hash = '#t/' + ids[0];
        else if (location.hash) location.hash = '';
        else listView();
        return;
      }
      if (z['trail.gpx']) t = fromGpx(new TextDecoder().decode(z['trail.gpx']));
      else throw new Error('no trail inside this zip');
    } else if (name.endsWith('.gpx')) t = fromGpx(await f.text());
    else t = fromGeo(JSON.parse(await f.text()));
    t.id = uid();
    t.draft = false;
    t.imported = new Date().toISOString();
    await T.put(t);
    toast('Trail opened and kept on this device');
    location.hash = '#t/' + t.id;
  } catch (e) {
    toast('Could not open: ' + e.message);
  }
}
function fromGpx(text) {
  const d = new DOMParser().parseFromString(text, 'application/xml');
  if (d.querySelector('parsererror')) throw new Error('not a GPX file');
  const txt = (el, sel) => ((el.querySelector(sel) || {}).textContent || '').trim();
  const ms = el => {
    const s = txt(el, 'time');
    return s ? Date.parse(s) : Date.now();
  };
  const ele = el => {
    const s = txt(el, 'ele');
    return s ? +s : null;
  };
  const points = [...d.querySelectorAll('trkpt,rtept')].map(p => [
    +p.getAttribute('lat'),
    +p.getAttribute('lon'),
    ele(p),
    0,
    ms(p),
  ]);
  const stops = [...d.querySelectorAll('wpt')].map(w => ({
    id: uid(),
    lat: +w.getAttribute('lat'),
    lng: +w.getAttribute('lon'),
    alt: ele(w),
    t: ms(w),
    title: txt(w, 'name'),
    kind: KINDS.includes(txt(w, 'type')) ? txt(w, 'type') : 'Other',
    text: txt(w, 'desc'),
    photos: [],
  }));
  return {
    name: txt(d, 'metadata > name') || txt(d, 'trk > name') || 'Imported trail',
    kind: 'Farm walk',
    text: txt(d, 'metadata > desc'),
    created: points.length ? iso(points[0][4]) : new Date().toISOString(),
    points,
    stops,
  };
}
function fromGeo(g) {
  const fs = g.type === 'FeatureCollection' ? g.features : [g];
  const line = fs.find(f => f.geometry && f.geometry.type === 'LineString');
  const pr = (line && line.properties) || {};
  const times = pr.times || [];
  const points = line
    ? line.geometry.coordinates.map((c, i) => [
        c[1],
        c[0],
        c[2] != null ? c[2] : null,
        0,
        times[i] ? Date.parse(times[i]) : Date.now(),
      ])
    : [];
  const stops = fs
    .filter(f => f.geometry && f.geometry.type === 'Point')
    .map(f => ({
      id: uid(),
      lat: f.geometry.coordinates[1],
      lng: f.geometry.coordinates[0],
      alt: f.geometry.coordinates[2] != null ? f.geometry.coordinates[2] : null,
      t: f.properties && f.properties.time ? Date.parse(f.properties.time) : Date.now(),
      title: (f.properties && (f.properties.name || f.properties.title)) || '',
      kind: 'Other',
      text: (f.properties && (f.properties.text || f.properties.description)) || '',
      photos: [],
    }));
  if (!points.length && !stops.length) throw new Error('no path or points in this file');
  return {
    name: pr.name || 'Imported trail',
    kind: pr.kind || 'Farm walk',
    by: pr.by || '',
    text: pr.about || '',
    created: pr.created || new Date().toISOString(),
    points,
    stops,
  };
}

// ---------- routes ----------
function route() {
  const h = location.hash.slice(1);
  let m;
  if (h === 'rec') recView();
  else if ((m = h.match(/^t\/([\w-]+)(\/edit)?$/))) trailView(m[1], !!m[2]);
  else listView();
}
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', stopWatch);
route();
</script>
