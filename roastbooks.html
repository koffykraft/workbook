<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><title>KoffyKraft · Roastbooks</title><style>:root{--paper:#f7f5f0;--ink:#171512;--muted:#77716a;--line:#ddd8d0;--coffee:#8d583b;--card:#fff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px 54px}.mast{display:flex;align-items:center;justify-content:space-between;padding:4px 0 26px}.logo{display:block;width:126px;max-height:62px;object-fit:contain;object-position:left center}.home{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink);text-decoration:none;font-size:20px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--coffee);font-weight:750}.hero h1{font-size:clamp(36px,10vw,54px);letter-spacing:-.045em;line-height:.94;margin:9px 0 10px}.hero p{font-size:16px;color:var(--muted);margin:0 0 30px}.primary{display:block;background:var(--ink);color:white;text-decoration:none;border-radius:24px;padding:24px;margin-bottom:12px;box-shadow:0 10px 30px rgba(30,24,20,.08)}.primary .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.62}.primary strong{display:block;font-size:28px;letter-spacing:-.03em;margin:28px 0 6px}.primary span{color:#c8c3bc;font-size:15px}.book{display:block;background:var(--card);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:22px;padding:22px;margin:12px 0}.booktop{display:flex;justify-content:space-between;align-items:start;gap:12px}.book strong{font-size:25px;letter-spacing:-.025em}.arrow{font-size:24px;font-weight:300;color:var(--coffee)}.book p{color:var(--muted);margin:8px 0
