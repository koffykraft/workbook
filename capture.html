<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Capture</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.app{max-width:620px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.type{border:1px solid #ddd;background:#fff;border-radius:14px;padding:16px 10px;text-align:left;font-weight:700}.type.on{background:#111;color:#fff;border-color:#111}.pick{display:block;border:1px solid #111;border-radius:13px;padding:14px;text-align:center;font-weight:750;margin:14px 0}input[type=file]{display:none}img{max-width:100%;border-radius:14px;display:none;margin:12px 0}.panel{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font:inherit;margin:5px 0}textarea{min-height:95px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;margin:8px 5px 0 0}.primary{background:#111;color:#fff;border-color:#111}.meta{font-size:12px;color:#777}.status{font-size:13px;margin:10px 0}footer{margin-top:28px;font-size:11px;color:#888}</style></head><body><main class="app"><header><h1>Capture</h1><a href="index.html">KoffyKraft</a></header><div class="grid" id="types"></div><label class="pick" for="photo">Camera / Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview"><div class="status" id="status">Choose what you are capturing.</div>
<section class="panel"><div class="meta">Suggested values · confirm before recording</div><div class="row"><input id="value" placeholder="Value"><input id="unit" placeholder="Unit"></div><input id="label" placeholder="Label / lot / coffee"><textarea id="text" placeholder="Extracted text / observation"></textarea><button class="btn primary" id="confirm">Confirm & record</button><button class="btn" id="discard">Discard</button></section><footer>Capture → Recognise → Suggest → Confirm → Record</footer></main><script>
const TYPES=['Note / OCR','Bag label','Scale / weight','Probe / display','Roast colour','Green bean','Roasted bean','Brew','Process / farm'];let kind='';let image='';
types.innerHTML=TYPES.map(x=>'<button class="type" data-k="'+x+'">'+x+'</button>').join('');document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll('.type').forEach(x=>x.classList.toggle('on',x===b));status.textContent=kind+' selected · take or choose a photo'});
photo.onchange=()=>{const f=photo.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{image=r.result;preview.src=image;preview.style.display='block';status.textContent='Photo ready · enter/confirm suggested values. Automatic recognition will be enabled through the capture engine without changing records silently.'};r.readAsDataURL(f)};
confirm.onclick=()=>{if(!kind)return alert('Choose capture type');const rec={id:'cap-'+Date.now(),kind,at:new Date().toISOString(),value:value.value.trim(),unit:unit.value.trim(),label:label.value.trim(),text:text.value.trim(),image:image||null,confirmed:true,source:'camera/photo'};const a=JSON.parse(localStorage.getItem('kk_captures_v1')||'[]');a.unshift(rec);localStorage.setItem('kk_captures_v1',JSON.stringify(a));status.textContent='Recorded · confirmed';value.value=unit.value=label.value=text.value='';image='';preview.style.display='none';photo.value=''};
discard.onclick=()=>{value.value=unit.value=label.value=text.value='';image='';preview.style.display='none';photo.value='';status.textContent='Discarded · no record changed'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
