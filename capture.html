<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Capture</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.app{max-width:620px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.type{border:1px solid #ddd;background:#fff;border-radius:14px;padding:16px 10px;text-align:left;font-weight:700}.type.on{background:#111;color:#fff;border-color:#111}.pick{display:block;border:1px solid #111;background:#fff;color:#111;border-radius:13px;padding:14px;text-align:center;font-weight:750;margin:10px 0;width:100%;font:inherit}.pickerrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pickerrow .pick{margin:0}.filepick{margin-top:10px}.hidden{display:none}img{max-width:100%;border-radius:14px;display:none;margin:12px 0}.panel{border:1px solid #ddd;border-radius:14px;padding:14px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font:inherit;margin:5px 0}textarea{min-height:95px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 12px;font-weight:700;margin:8px 5px 0 0}.primary{background:#111;color:#fff;border-color:#111}.meta{font-size:12px;color:#777}.status{font-size:13px;margin:10px 0}footer{margin-top:28px;font-size:11px;color:#888}</style></head><body><main class="app"><header><h1>Capture</h1><a href="index.html">KoffyKraft</a></header><div class="grid" id="types"></div><a class="pick" href="ocr.html">OCR Note / Label</a><div class="pickerrow"><button class="pick" id="cameraBtn" type="button">Camera</button><button class="pick" id="photoBtn" type="button">Photos</button></div><button class="pick filepick" id="fileBtn" type="button">Files</button><input class="hidden" id="camera" type="file" accept="image/*" capture="environment"><input class="hidden" id="photo" type="file" accept="image/*"><input class="hidden" id="file" type="file" accept="image/*,.pdf,.csv,.txt,.json,.xlsx,.xls,.doc,.docx"><img id="preview"><div class="status" id="status">Choose what you are capturing.</div>
<section class="panel"><div class="meta">Suggested values · confirm before recording</div><div class="row"><input id="value" placeholder="Value"><input id="unit" placeholder="Unit"></div><input id="label" placeholder="Label / lot / coffee"><textarea id="text" placeholder="Extracted text / observation"></textarea><button class="btn primary" id="confirm">Confirm & record</button><button class="btn" id="discard">Discard</button></section><footer>Capture → Recognise → Suggest → Confirm → Record</footer></main><script>
const typesEl=document.getElementById('types'),statusEl=document.getElementById('status'),cameraBtnEl=document.getElementById('cameraBtn'),photoBtnEl=document.getElementById('photoBtn'),fileBtnEl=document.getElementById('fileBtn'),cameraInput=document.getElementById('camera'),photoInput=document.getElementById('photo'),fileInput=document.getElementById('file'),previewEl=document.getElementById('preview'),valueInput=document.getElementById('value'),unitInput=document.getElementById('unit'),labelInput=document.getElementById('label'),textInput=document.getElementById('text'),confirmBtn=document.getElementById('confirm'),discardBtn=document.getElementById('discard');
const TYPES=['Note / OCR','Bag label','Scale / weight','Probe / display','Roast colour','Green bean','Roasted bean','Brew','Process / farm'];let kind='',image='',fileMeta=null,source='';
typesEl.innerHTML=TYPES.map(x=>'<button class="type" data-k="'+x+'">'+x+'</button>').join('');
document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll('.type').forEach(x=>x.classList.toggle('on',x===b));statusEl.textContent=kind+' selected'});
cameraBtnEl.onclick=()=>cameraInput.click();photoBtnEl.onclick=()=>photoInput.click();fileBtnEl.onclick=()=>fileInput.click();
function loadImage(f,src){const r=new FileReader;r.onload=()=>{image=String(r.result||'');previewEl.src=image;previewEl.style.display='block';fileMeta={name:f.name,type:f.type,size:f.size};source=src;statusEl.textContent=f.name+' ready · confirm before recording'};r.onerror=()=>statusEl.textContent='Could not read image';r.readAsDataURL(f)}
function loadFile(f){fileMeta={name:f.name,type:f.type,size:f.size};source='file';image='';previewEl.style.display='none';if((f.type||'').startsWith('image/'))return loadImage(f,'file');if(/^(text\/|application\/(json|csv))/.test(f.type||'')||/\.(txt|csv|json)$/i.test(f.name)){const r=new FileReader;r.onload=()=>{textInput.value=String(r.result||'');statusEl.textContent=f.name+' ready · confirm before recording'};r.onerror=()=>statusEl.textContent='Could not read file';r.readAsText(f)}else statusEl.textContent=f.name+' selected · reference will be recorded'}
cameraInput.onchange=()=>{const f=cameraInput.files[0];if(f)loadImage(f,'camera')};photoInput.onchange=()=>{const f=photoInput.files[0];if(f)loadImage(f,'photo')};fileInput.onchange=()=>{const f=fileInput.files[0];if(f)loadFile(f)};
confirmBtn.onclick=()=>{if(!kind)return alert('Choose capture type');const rec={id:'cap-'+Date.now(),kind,at:new Date().toISOString(),value:valueInput.value.trim(),unit:unitInput.value.trim(),label:labelInput.value.trim(),text:textInput.value.trim(),image:image||null,file:fileMeta,confirmed:true,source:source||'manual'};let a=[];try{a=JSON.parse(localStorage.getItem('kk_captures_v1')||'[]')}catch(e){}a.unshift(rec);try{localStorage.setItem('kk_captures_v1',JSON.stringify(a));statusEl.textContent='Recorded · confirmed'}catch(e){rec.image=null;try{localStorage.setItem('kk_captures_v1',JSON.stringify([rec,...a.slice(1)]));statusEl.textContent='Recorded without embedded image · device storage limit'}catch(e2){statusEl.textContent='Could not save · device storage is full';return}}resetInputs()};
function resetInputs(){valueInput.value=unitInput.value=labelInput.value=textInput.value='';image='';fileMeta=null;source='';previewEl.style.display='none';previewEl.removeAttribute('src');cameraInput.value=photoInput.value=fileInput.value=''}
discardBtn.onclick=()=>{resetInputs();statusEl.textContent='Discarded · no record changed'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
