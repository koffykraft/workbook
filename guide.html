<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5ef">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Guide</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="kk.css"><script src="app.config.js"></script><script src="tap.js" defer></script><script src="kk-base.js"></script>
<style>
.toc {
  columns: 2;
  column-gap: 18px;
  font-size: 14px;
  line-height: 1.9;
}
.toc a {
  display: block;
  break-inside: avoid;
}
.gs {
  scroll-margin-top: 12px;
}
.gs h2 {
  margin: 0 0 4px;
  font-size: 19px;
}
.gs ol {
  padding-left: 20px;
  margin: 8px 0;
}
.gs li {
  margin: 4px 0;
  line-height: 1.45;
}
.gs .tip {
  background: var(--bg);
  border-radius: 10px;
  padding: 8px 10px;
  margin-top: 8px;
  font-size: 14px;
}
.gs .grp {
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #7a7368;
}
.gs.hl {
  outline: 2px solid var(--app);
  outline-offset: 2px;
}
@media (max-width: 420px) {
  .toc {
    columns: 1;
  }
}
@media print {
  #kh,
  #kf,
  .no-print,
  .kk-family {
    display: none !important;
  }
  .gs {
    break-inside: avoid;
  }
}
</style>
</head>
<body data-page="guide"><main class="app">
<header id="kh"></header>
<div id="view"><div class="card mini">Loading the guide…</div></div>
<div id="kf"></div>
</main>
<script src="app.js"></script><script src="guide-common.js"></script><script src="guide-app.js"></script>
<script>
window.KK_LEARN_PAGE = ['learn', 'html'].join('.');
</script>
<script>
// The user guide: the shared sections every KoffyKraft app has, and this app's own. Every section
// has its own address (guide.html#section), and the ? beside each page name opens the right one.
const $ = s => document.querySelector(s);
async function draw() {
  const mine = await Promise.resolve(window.KK_GUIDE_APP || []);
  const mods = APP.modules || [];
  const common = (window.KK_GUIDE_COMMON || []).filter(s => !s.need || mods.includes(s.need));
  const first = common.filter(s => s.id === 'start' || s.id === 'account');
  const rest = common.filter(s => s.id !== 'start' && s.id !== 'account');
  const all = [
    ...first.map(s => ({ ...s, grp: 'Getting started' })),
    ...mine.map(s => ({ ...s, grp: s.grp || APP.short })),
    ...rest.map(s => ({ ...s, grp: 'In every KoffyKraft app' })),
  ];
  const sec = s =>
    '<div class="card gs" id="' +
    esc(s.id) +
    '"><div class="grp">' +
    esc(s.grp) +
    '</div><h2>' +
    esc(s.title) +
    '</h2>' +
    (s.what ? '<div>' + esc(s.what) + '</div>' : '') +
    (s.steps && s.steps.length
      ? '<ol>' + s.steps.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>'
      : '') +
    (s.items && s.items.length
      ? '<ul style="padding-left:20px;margin:8px 0">' +
        s.items
          .map(
            ([t, line, more, href]) =>
              '<li style="margin:6px 0"><b>' +
              (href ? '<a href="' + esc(href) + '">' + esc(t) + '</a>' : esc(t)) +
              '</b>: ' +
              esc(line) +
              (more ? '<div class="mini">' + esc(more) + '</div>' : '') +
              '</li>'
          )
          .join('') +
        '</ul>'
      : '') +
    (s.tips || []).map(t => '<div class="tip">' + esc(t) + '</div>').join('') +
    '<div class="row no-print" style="margin-top:8px;flex-wrap:wrap">' +
    (s.open
      ? '<a class="btn small app" href="' + esc(s.open) + '">Open ' + esc(s.title.split(':')[0]) + '</a>'
      : '') +
    (s.learn ? '<a class="btn small" href="' + esc(s.learn) + '">Learn more</a>' : '') +
    '<a class="btn small" href="#top">Contents</a></div></div>';
  $('#view').innerHTML =
    '<h1 id="top">Guide</h1><div class="sub">How to use ' +
    esc(APP.short) +
    ', part by part. The ? beside any page name opens its part here.' +
    (window.KK_LEARN ? ' For the crop itself, see <a href="' + window.KK_LEARN_PAGE + '">Learn</a>.' : '') +
    '</div>' +
    '<div class="card no-print"><b>Contents</b><div class="toc" style="margin-top:6px">' +
    all.map(s => '<a href="#' + esc(s.id) + '">' + esc(s.title) + '</a>').join('') +
    '</div></div>' +
    all.map(sec).join('') +
    '<div class="row no-print" style="margin:10px 0"><button class="btn" onclick="print()">Print the guide</button></div>';
  go(all);
  window.addEventListener('hashchange', () => go(all));
}
// #page-name from a ? link finds the section that covers that page
function go(all) {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h || h === 'top') return;
  const s = all.find(x => x.id === h) || all.find(x => (x.pages || []).includes(h) || x.open === h + '.html');
  const el = s && document.getElementById(s.id);
  if (!el) return;
  document.querySelectorAll('.gs.hl').forEach(x => x.classList.remove('hl'));
  el.classList.add('hl');
  el.scrollIntoView();
}
draw();
</script>
<script src="pv.js" defer></script>
<script src="kk-family.js" defer></script>
</body>
</html>
