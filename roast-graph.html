<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KoffyKraft Roast Graph</title>
<style>:root{--bg:#f4f0e8;--card:#fffaf3;--ink:#211c17;--muted:#746c63;--line:#d8cec2;--et:#e2783f;--bt:#43a4bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:1000px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.k{font-size:.7rem;letter-spacing:.15em;color:#8b4b2e;font-weight:700}h1{font-size:1.55rem;margin:.15em 0}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin:10px 0}.chart{background:#171512;border-radius:12px;padding:6px;overflow:auto}canvas{display:block;width:100%;height:auto;min-height:390px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#211c17;color:white}.ghost{background:#ece4da;color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.m{background:white;border:1px solid var(--line);border-radius:10px;padding:9px}.m b{display:block}.m span{font-size:.7rem;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line)}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}@media print{.actions{display:none}.app{max-width:none}.card{break-inside:avoid}@page{size:A4 landscape;margin:10mm}}</style></head><body><main class="app">
<div class="top"><div><div class="k">KOFFYKRAFT</div><h1>Roast Graph</h1></div><div class="actions"><button class="btn ghost" id="refresh">Refresh</button><button class="btn" id="csv">CSV</button><button class="btn" id="print">Print / PDF</button></div></div>
<section class="card"><div id="identity"></div></section>
<section class="card"><div class="chart"><canvas id="c" width="1100" height="520"></canvas></div></section>
<section class="card"><div class="stats"><div class="m"><b id="total">--</b><span>Total</span></div><div class="m"><b id="dev">--</b><span>Development</span></div><div class="m"><b id="dtr">--</b><span>DTR</span></div><div class="m"><b id="loss">--</b><span>Weight loss</span></div></div></section>
<section class="card"><table><thead><tr><th>Time</th><th>Type</th><th>Temperature / values</th><th>Gap / RoR</th></tr></thead><tbody id="rows"></tbody></table></section>
</main><script>
const fmt=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),d=Math.floor(ms%1000/100);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d};
let state={},f={};function load(){try{state=JSON.parse(localStorage.getItem('kk_roast_v10')||'{}');f=JSON.parse(localStorage.getItem('kk_fields_v10')||'{}')}catch(e){};render()}
function render(){const unit=state.unit==='F'?'°F':'°C',ev=state.events||[],rd=state.readings||{exhaust:[],bean:[]};identity.innerHTML='<b>'+[f.estate,f.coffeeCode,f.roastNo?'R'+f.roastNo:''].filter(Boolean).join(' · ')+'</b> · '+[f.greenWeight&&f.greenWeight+' g',f.moisture&&f.moisture+'%',f.targetColor].filter(Boolean).join(' · ');
 const drop=ev.find(x=>x.name==='Drop'),fc=ev.find(x=>x.name==='First Crack');total.textContent=drop?fmt(drop.time):'--';if(drop&&fc){dev.textContent=fmt(drop.time-fc.time);dtr.textContent=((drop.time-fc.time)/drop.time*100).toFixed(1)+'%'}else{dev.textContent=dtr.textContent='--'}const g=+f.greenWeight,r=+f.roastedWeight;loss.textContent=g>0&&r>0?((g-r)/g*100).toFixed(1)+'%':'--';
 const all=[];['exhaust','bean'].forEach(p=>{const a=(rd[p]||[]).slice().sort((a,b)=>a.time-b.time);a.forEach((x,i)=>{let extra='';if(i){const dt=(x.time-a[i-1].time)/60000,ror=dt>0?(x.temp-a[i-1].temp)/dt:null;extra=((x.time-a[i-1].time)/1000).toFixed(1)+'s'+(ror!=null?' · '+ror.toFixed(1)+unit+'/min':'')}all.push({t:x.time,type:p==='exhaust'?'ET':'BT',v:x.temp+unit,x:extra})})});ev.forEach(e=>all.push({t:e.time,type:e.name,v:'ET '+(e.exhaust??'--')+' / BT '+(e.bean??'--'),x:''}));all.sort((a,b)=>a.t-b.t);rows.innerHTML=all.map(x=>'<tr><td>'+fmt(x.t)+'</td><td>'+x.type+'</td><td>'+x.v+'</td><td>'+x.x+'</td></tr>').join('');
 draw(rd,ev,unit)}
function draw(rd,ev,unit){const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height,p={l:55,r:30,t:25,b:38};x.fillStyle='#171512';x.fillRect(0,0,W,H);const all=[...(rd.exhaust||[]),...(rd.bean||[])],temps=all.map(z=>+z.temp),mn=Math.floor((temps.length?Math.min(...temps):150)/10)*10-10,mx=Math.ceil((temps.length?Math.max(...temps):220)/10)*10+10,maxS=Math.max(720,...all.map(z=>z.time/1000+30));const X=s=>p.l+s/maxS*(W-p.l-p.r),Y=t=>p.t+(mx-t)/(mx-mn)*(H-p.t-p.b);x.font='11px Arial';x.strokeStyle='#3b342f';x.fillStyle='#b8aaa0';for(let t=Math.ceil(mn/10)*10;t<=mx;t+=10){x.beginPath();x.moveTo(p.l,Y(t));x.lineTo(W-p.r,Y(t));x.stroke();x.fillText(t+unit,7,Y(t)+4)}for(let s=0;s<=maxS;s+=60){x.beginPath();x.moveTo(X(s),p.t);x.lineTo(X(s),H-p.b);x.stroke();x.fillText(String(s/60).padStart(2,'0')+':00',X(s)-15,H-10)}function series(a,col){a=(a||[]).slice().sort((a,b)=>a.time-b.time);if(!a.length)return;x.strokeStyle=col;x.lineWidth=3;x.beginPath();a.forEach((z,i)=>i?x.lineTo(X(z.time/1000),Y(z.temp)):x.moveTo(X(z.time/1000),Y(z.temp)));x.stroke();a.forEach(z=>{x.fillStyle=col;x.beginPath();x.arc(X(z.time/1000),Y(z.temp),3,0,Math.PI*2);x.fill()})}series(rd.exhaust,'#e2783f');series(rd.bean,'#43a4bf');ev.forEach(e=>{const xx=X(e.time/1000);x.strokeStyle='rgba(255,255,255,.5)';x.beginPath();x.moveTo(xx,p.t);x.lineTo(xx,H-p.b);x.stroke();x.fillStyle='#fff';x.fillText(e.name,xx+4,p.t+12)})}
refresh.onclick=load;print.onclick=()=>window.print();csv.onclick=()=>{const lines=[['Time','Type','Temperature / values','Gap / RoR'],...Array.from(rows.querySelectorAll('tr')).map(tr=>Array.from(tr.children).map(td=>td.textContent))];const s=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download=(f.coffeeCode||'roast')+'_graph_data.csv';a.click()};load();
</script></body></html>
