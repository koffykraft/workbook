<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Process</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:620px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{margin:0;font-size:26px}a{color:#555;text-decoration:none}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px}.tab.on{background:#111;color:#fff;border-color:#111}.list{display:grid;gap:9px}.card{border:1px solid #ddd;border-radius:15px;padding:15px;background:#fff}.name{font-weight:750;font-size:17px}.meta{color:#777;font-size:12px;margin-top:4px}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;font-weight:650}.primary{background:#111;color:#fff;border-color:#111}.add{position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;background:#111;color:#fff;font-size:28px}.editor{display:none;border:1px solid #ddd;border-radius:15px;padding:14px;margin-bottom:14px}.editor.open{display:block}input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px 0 9px;font:inherit}label{font-size:12px;color:#666}.step{display:grid;grid-template-columns:1fr auto;gap:7px}.small{width:88px}footer{margin-top:35px;color:#888;font-size:11px}</style></head><body><main class="app"><header><h1>Process</h1><a href="index.html">KoffyKraft</a></header>
<div class="tabs"><button class="tab on" data-scope="defaults">Defaults</button><button class="tab" data-scope="mine">My Processes</button><button class="tab" data-scope="shared">Shared</button></div>
<section id="editor" class="editor"><label>Process name</label><input id="pname" placeholder="My process"><label>Type</label><input id="ptype" placeholder="Fermentation, drying, rest…"><div id="steps"></div><button class="btn" id="addStep">+ Step</button> <button class="btn primary" id="save">Save</button></section>
<section class="list" id="list"></section><button class="add" id="new">+</button><footer>© 2026 KoffyKraft · Freeware</footer></main>
<script>
const KEY='kk_process_templates_v1';const defaults=[
{name:'Banana Blossom Fermentation',type:'Preferment · Fermentation',steps:['Prepare starter wort','Prepare coffee','Inoculate','Ferment / observe','Drain & dry','Rest']},
{name:'Papaya–Lemon Anaerobic',type:'Anaerobic · Staged addition',steps:['Prepare brine & cherry','Add papaya filtrate','Anaerobic hold','Add lemon','Continue fermentation','Drain & dry']},
{name:'Drying Protocol',type:'Drying',steps:['Load drying surface','Record starting moisture','Turn / observe','Measure moisture','Finish & condition']},
{name:'Rest Schedule',type:'Rest',steps:['Start rest','Check condition','End rest']}
];let scope='defaults';let mine=JSON.parse(localStorage.getItem(KEY)||'[]');
function card(p,i,kind){return '<article class="card"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(p.type||'Process')+' · '+p.steps.length+' steps</div><div class="actions"><button class="btn primary" onclick="run('+i+',\''+kind+'\')">Use</button><button class="btn" onclick="copyP('+i+',\''+kind+'\')">Duplicate</button>'+(kind==='mine'?'<button class="btn" onclick="shareP('+i+')">Share</button>':'')+'</div></article>'}
function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.scope===scope));let a=scope==='defaults'?defaults:scope==='mine'?mine:JSON.parse(localStorage.getItem('kk_shared_processes_v1')||'[]');list.innerHTML=a.length?a.map((p,i)=>card(p,i,scope)).join(''):'<div class="meta">No processes yet.</div>'}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;render()});new.onclick=()=>{editor.classList.add('open');pname.value='';ptype.value='';steps.innerHTML='';add()};function add(v=''){steps.insertAdjacentHTML('beforeend','<div class="step"><input class="s" placeholder="Step" value="'+esc(v)+'"><button class="btn" onclick="this.parentElement.remove()">×</button></div>')}addStep.onclick=()=>add();
save.onclick=()=>{const p={id:'p-'+Date.now(),name:pname.value.trim()||'Untitled process',type:ptype.value.trim(),steps:[...document.querySelectorAll('.s')].map(x=>x.value.trim()).filter(Boolean),createdAt:new Date().toISOString()};mine.unshift(p);localStorage.setItem(KEY,JSON.stringify(mine));editor.classList.remove('open');scope='mine';render()};
window.copyP=(i,k)=>{const src=k==='defaults'?defaults:k==='mine'?mine:JSON.parse(localStorage.getItem('kk_shared_processes_v1')||'[]');const p=JSON.parse(JSON.stringify(src[i]));p.id='p-'+Date.now();p.name=p.name+' copy';mine.unshift(p);localStorage.setItem(KEY,JSON.stringify(mine));scope='mine';render()};
window.run=(i,k)=>{const src=k==='defaults'?defaults:k==='mine'?mine:JSON.parse(localStorage.getItem('kk_shared_processes_v1')||'[]');const p=src[i];localStorage.setItem('kk_active_process_run',JSON.stringify({id:'run-'+Date.now(),template:p,startedAt:new Date().toISOString(),done:[]}));location.href='process-run.html'};
window.shareP=i=>{const shared=JSON.parse(localStorage.getItem('kk_shared_processes_v1')||'[]');shared.unshift({...mine[i],sharedAt:new Date().toISOString()});localStorage.setItem('kk_shared_processes_v1',JSON.stringify(shared));scope='shared';render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
