<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Process Run</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#fff;color:#111}.app{max-width:620px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px}.meta{font-size:12px;color:#777}.step{display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;padding:15px 2px}.step input{width:24px;height:24px}.step.done span{text-decoration:line-through;color:#888}.obs{width:100%;border:1px solid #ddd;border-radius:11px;padding:12px;margin-top:18px;font:inherit}.btn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:11px;background:#111;color:#fff;font-weight:700}</style></head><body><main class="app"><header><h1 id="title">Process</h1><a href="process.html">Back</a></header><div class="meta" id="meta"></div><section id="steps"></section><input class="obs" id="obs" placeholder="Observation"><button class="btn" id="record">Record observation</button></main><script>
const titleEl=document.getElementById('title'),metaEl=document.getElementById('meta'),stepsEl=document.getElementById('steps'),obsInput=document.getElementById('obs'),recordBtn=document.getElementById('record');
const K='kk_active_process_run';let r=null;try{r=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(!r){location.href='process.html'}else{titleEl.textContent=r.template.name;metaEl.textContent='Started '+new Date(r.startedAt).toLocaleString();function draw(){stepsEl.innerHTML=r.template.steps.map((s,i)=>'<label class="step '+(r.done.includes(i)?'done':'')+'"><input type="checkbox" '+(r.done.includes(i)?'checked':'')+' data-i="'+i+'"><span>'+s+'</span></label>').join('');document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{const i=+x.dataset.i;r.done=x.checked?[...new Set([...r.done,i])]:r.done.filter(n=>n!==i);localStorage.setItem(K,JSON.stringify(r));draw()})}draw();recordBtn.onclick=()=>{if(!obsInput.value.trim())return;r.observations=r.observations||[];r.observations.push({at:new Date().toISOString(),text:obsInput.value.trim()});localStorage.setItem(K,JSON.stringify(r));obsInput.value=''}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
