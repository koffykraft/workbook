<html lang="en">

<title>KoffyKraft Origin</title>
<style>
:root{--bg:#f7f5f0;--ink:#171512;--muted:#77716a;--line:#ddd8d0;--coffee:#8d583b;--soft:#faf7f2;--ok:#3f6b5a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;color:var(--ink);background:var(--bg)}
.app{max-width:680px;margin:auto;padding:24px 16px 120px}
h1{font-size:32px;letter-spacing:-.04em;margin:6px 0 4px;line-height:1.2}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:#c9bfb2;display:inline-block}
.sync.synced i{background:var(--ok)}.sync.syncing i{background:#c47f1d}.sync.error i{background:#b4432f}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#ece7df;border-radius:12px;padding:4px;margin:12px 0 16px;position:sticky;top:0;z-index:5}
.tabs button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button{font:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;font-weight:600;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.primary{background:#171512;color:#fff;border-color:#171512}
.btn.danger{color:#b4432f}
.btn.small{padding:7px 10px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.sec h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coffee);margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:8px 0;cursor:pointer}
.card:active{background:var(--soft)}
.card b{font-size:17px;display:block}
.card .m{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.card .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:var(--soft);border:1px solid #efe8de;border-radius:999px;padding:3px 8px;color:#5c554e}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:14px;font-size:13px;line-height:1.5}
form{display:block}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.fld label em{font-style:normal;color:#b4432f}
input,select,textarea{font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.unitwrap{display:flex;gap:6px}.unitwrap input{flex:1}.unitwrap select{width:auto;flex:0 0 auto;padding:11px 8px}
.fhead{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coffee);margin:12px 0 0;font-weight:700}
.calc{grid-column:1/-1;background:var(--soft);border:1px solid #efe8de;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.calc b{font-variant-numeric:tabular-nums}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);font-weight:400;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.checks input{width:auto}
.fld .mini,details.mini,.calc .mini{font-size:12.5px;color:var(--muted);line-height:1.45}details.mini summary{cursor:pointer;color:var(--coffee);font-weight:600}details.mini a{color:var(--coffee)}
.pgrp{display:grid;gap:4px;margin:8px 0}.pgrp>b{font-size:14px}.pgrp .mini{font-size:12px;color:var(--muted)}.stg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.stg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}.sth{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid #f0ebe3}
.lst{display:grid;gap:6px}
.lrow{display:grid;gap:6px;align-items:center}
.lrow input,.lrow select{padding:9px 10px;font-size:14px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer}
.lsum{font-size:13px;color:var(--muted)}
.step{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:grid;gap:8px}
.step .sh{display:flex;gap:8px;align-items:center}
.step .sh select{flex:1;font-weight:600}
.step .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.step .grid2>*,.lrow>*{min-width:0}.step .dt{grid-column:1/-1}.rd{border:1px solid #efe8de;background:var(--soft);border-radius:11px;padding:8px;display:grid;gap:6px}.rd .r1{display:flex;gap:6px;align-items:center}.rd .r1 input{flex:1}.rd .r2{display:grid;gap:6px}
.step .mini{font-size:12px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:space-between;z-index:20}
.bar .grow{flex:1}
.lineage{display:grid;gap:0;margin-top:4px}
.lin{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.lin .dot{width:12px;height:12px;border-radius:50%;background:var(--coffee);margin:4px 5px 0;position:relative}
.lin:not(:last-child) .dot::after{content:"";position:absolute;left:5px;top:12px;width:2px;height:44px;background:#e3d9cc}
.lin .lt{font-size:14px;padding-bottom:14px;line-height:1.4}.lin .lt small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#171512;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.back{background:none;border:0;color:var(--coffee);font-weight:600;padding:10px 12px 10px 0;min-height:44px;cursor:pointer;font-size:15px}
@media(max-width:380px){.f{grid-template-columns:1fr}}
.fbar{display:flex;gap:8px;margin:0 0 8px}.fbar .fq{flex:1}.fpanel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 8px}.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;margin-bottom:10px}.fl{display:flex;flex-direction:column;gap:4px;min-width:0}.fl span{font-size:12px;color:var(--muted);font-weight:600}.fsum{font-size:13px;color:var(--muted);margin:4px 2px 0}.srun{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border:1px solid #efe8de;border-radius:11px;padding:8px 10px}.srun.on{background:#f3e9df;border-color:#e6d3c1}.srun b{font-variant-numeric:tabular-nums}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--muted)}.chip.on{background:#171512;color:#fff;border-color:#171512}.glist{margin:0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.45}.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px}.rv{display:flex;flex-direction:column;gap:3px}.rv.warn input{border-color:#c47f1d;background:#fdf4e7}.rv.alarm input{border-color:#b4432f;background:#fbefec}.rv.ok input{border-color:#3f6b5a;background:#eef5f1}.pchart{background:#fff;border:1px solid #efe8de;border-radius:11px;padding:8px 10px;margin:6px 0}.pchart svg{width:100%;height:90px;display:block;margin-top:4px}.gsrc{margin-top:10px}.gsrc summary{cursor:pointer;color:var(--coffee);font-weight:600}.gsrc a{color:var(--coffee)}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};
const today=()=>new Date().toISOString().slice(0,10);
const r1=v=>Math.round(v*10)/10, r2=v=>Math.round(v*100)/100;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
function fmtDate(d){if(!d)return '';const x=new Date(d.length===10?d+'T00:00':d);return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function fmtDT(d){if(!d)return '';const x=new Date(d);return isNaN(x)?d:x.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function hours(a,b){if(!a||!b)return null;const h=(new Date(b)-new Date(a))/36e5;return Number.isFinite(h)&&h>=0?h:null}
function fmtDur(h){if(h==null)return '';if(h<48)return r1(h)+' h';return r1(h/24)+' days'}

// ---------- field definitions ----------
const SPECIES=['Arabica','Robusta','Liberica','Excelsa','Other'];
const VARIETIES=(typeof KK_VARIETIES!=='undefined'?KK_VARIETIES.map(v=>v.n):[]).concat(['Robusta Peridenia','Robusta Old Robusta']);
const PATHWAYS=['Washed','Natural','Honey, white','Honey, yellow','Honey, red','Honey, black','Pulped natural','Anaerobic washed','Anaerobic natural','Carbonic maceration','Wet-hulled','Monsooned','Experimental'];
const F={
 estate:[
  {k:'name',l:'Estate name',t:'text',req:1,full:1,ph:'Thumpassery Estate'},
  {k:'locality',l:'Village / locality',t:'text'},{k:'district',l:'District',t:'text'},
  {k:'region',l:'State / region',t:'text'},{k:'country',l:'Country',t:'text',def:'India'},
  {k:'manager',l:'Owner / manager',t:'text',full:1},
  {k:'area',l:'Total area',t:'num',unit:'areaUnit',units:['acre','ha'],def_unit:'acre'},
  {k:'notes',l:'Notes',t:'area',full:1}],
 plot:[
  {k:'estateId',l:'Estate',t:'ref',ref:'estate',req:1,full:1},
  {k:'block',l:'Block',t:'text',ph:'North block'},{k:'name',l:'Plot name / code',t:'text',req:1,ph:'P3'},
  {h:'Location'},
  {k:'gps',t:'gps',full:1},
  {k:'altitude',l:'Altitude',t:'num',unit:'altUnit',units:['ft','m'],def_unit:'ft'},
  {k:'area',l:'Area',t:'num',unit:'areaUnit',units:['acre','ha'],def_unit:'acre'},
  {k:'slope',l:'Slope / aspect',t:'text',ph:'Gentle, east facing',full:1},
  {h:'Plants'},
  {k:'species',l:'Species',t:'sel',opts:SPECIES},{k:'variety',l:'Variety',t:'text',list:'varieties',ph:'Type or choose'},{k:'varietyInfo',t:'calc',fn:r=>typeof varietyHtml==='function'?varietyHtml(r.variety):''},
  {k:'plantYear',l:'Planting year',t:'num',ph:'2012'},{k:'plantAgeCalc',t:'calc',fn:r=>{const y=num(r.plantYear);return y?'Plant age <b>'+(new Date().getFullYear()-y)+' years</b>':''}},
  {k:'plantCount',l:'Plant count',t:'num'},
  {k:'spacingRow',l:'Row spacing',t:'num',unit:'spacingUnit',units:['ft','m'],def_unit:'ft'},{k:'spacingPlant',l:'Plant spacing',t:'num',unit:'spacingUnit',units:['ft','m'],def_unit:'ft'},
  {k:'densityCalc',t:'calc',fn:r=>{const a=num(r.spacingRow),b=num(r.spacingPlant);if(!a||!b)return '';const u=r.spacingUnit||'ft';const perAcre=u==='m'?4046.86/(a*b):43560/(a*b),perHa=u==='m'?10000/(a*b):107639/(a*b);return 'Planting density <b>'+Math.round(perAcre)+' plants/acre</b> ('+Math.round(perHa)+'/ha)'}},
  {h:'Soil and soil life'},
  {k:'soil',l:'Soil type',t:'text',ph:'Red laterite'},{k:'texture',l:'Texture (feel test)',t:'sel',opts:['Sandy','Sandy loam','Loam','Silty loam','Clay loam','Clay','Gravelly / laterite']},
  {k:'soilLife',l:'Soil care practices',t:'checks',groups:'PRACTICES',full:1},
  {k:'soilLifeCalc',t:'calc',fn:r=>principlesHtml(r)},
  {k:'worms',l:'Earthworms per spadeful',t:'num',ph:'Dig one spade, count'},{k:'soilSmell',l:'Soil smell',t:'sel',opts:['Earthy, sweet','Little smell','Sour or rotten']},
  {k:'soilTest',t:'soiltest',full:1},
  {k:'inputs',l:'Inputs applied',t:'list',full:1,cols:[{k:'date',l:'Date',t:'date'},{k:'what',l:'Input',t:'text'},{k:'qty',l:'Amount',t:'text'}],add:'Add input'},
  {k:'soilEvidence',t:'calc',fn:()=>soilEvidenceHtml()},
  {h:'Shade and care'},
  {k:'shade',l:'Shade intensity',t:'sel',opts:['None','Light','Medium','Heavy']},{k:'shadePct',l:'Shade cover %',t:'num'},
  {k:'shadeTrees',l:'Shade trees',t:'text',full:1,ph:'Silver oak, jackfruit, ficus'},
  {k:'irrigation',l:'Irrigation',t:'sel',opts:['Rainfed','Sprinkler','Drip','Other']},{k:'lastPruning',l:'Last pruning',t:'date'},
  {k:'fertilizer',l:'Nutrition / fertiliser notes',t:'area',full:1},
  {h:'Flowering'},
  {k:'blossomShower',l:'Blossom shower',t:'date'},{k:'backingShower',l:'Backing shower',t:'date'},{k:'bloomCalc',t:'calc',fn:r=>bloomHtml(r)},
  {k:'flowering',l:'Flowering records',t:'list',full:1,cols:[{k:'date',l:'Date',t:'date'},{k:'notes',l:'Intensity / notes',t:'text'}],add:'Add flowering'},
  {k:'expectedHarvest',l:'Expected harvest',t:'text',full:1,ph:'Late Nov to Jan'},
  {h:'Plot and cup'},
  {k:'cupCalc',t:'calc',fn:r=>plotCupHtml(r)},
  {k:'notes',l:'Notes',t:'area',full:1}],
 harvest:[
  {k:'code',l:'Harvest code',t:'text',req:1},{k:'date',l:'Date',t:'date',req:1,def:today},
  {k:'startTime',l:'Start time',t:'time'},{k:'endTime',l:'End time',t:'time'},
  {k:'plotIds',l:'Plots picked',t:'refs',ref:'plot',full:1},
  {k:'pickType',l:'Picking',t:'sel',opts:['Selective','Strip','Gleaning','Mixed']},{k:'pickers',l:'Pickers',t:'num'},
  {h:'Weights'},
  {k:'baskets',l:'Baskets / batches',t:'list',full:1,cols:[{k:'label',l:'Basket / picker',t:'text'},{k:'kg',l:'kg',t:'num'}],add:'Add basket',sum:'kg'},
  {k:'cherryKg',t:'calc',fn:r=>{const t=harvestKg(r);return t?'Total cherry <b>'+r1(t)+' kg</b>'+((r.baskets||[]).length?' from '+r.baskets.filter(b=>num(b.kg)).length+' baskets':''):''}},
  {k:'cropLink',t:'calc',fn:()=>'What to pick, when and how: <a href="crop.html#s-harvest" style="color:var(--coffee)">Crop care, harvest</a>'},
  {h:'Cherry quality'},
  {k:'ripePct',l:'Ripe %',t:'num'},{k:'underPct',l:'Under-ripe %',t:'num'},{k:'overPct',l:'Over-ripe %',t:'num'},{k:'floatPct',l:'Floaters %',t:'num'},
  {k:'brix',l:'Brix readings (optional)',t:'list',full:1,cols:[{k:'v',l:'°Brix',t:'num'}],add:'Add Brix reading'},
  {k:'brixCalc',t:'calc',fn:r=>{const v=(r.brix||[]).map(x=>num(x.v)).filter(x=>x!=null);if(!v.length)return '';return 'Average Brix <b>'+r1(v.reduce((a,b)=>a+b,0)/v.length)+'°</b> from '+v.length+' readings (range '+Math.min(...v)+' to '+Math.max(...v)+')'}},
  {k:'weather',l:'Weather',t:'text',full:1,ph:'Clear, 24°C'},
  {k:'notes',l:'Notes',t:'area',full:1}],
 process:[
  {k:'code',l:'Process code',t:'text',req:1},{k:'pathway',l:'Pathway',t:'sel',opts:PATHWAYS,req:1},
  {k:'harvestIds',l:'Source harvests',t:'refs',ref:'harvest',full:1},
  {k:'cherryIn',l:'Cherry in (if not from harvests)',t:'num',unitLabel:'kg'},{k:'started',l:'Started',t:'date',def:today},
  {k:'inCalc',t:'calc',fn:r=>{const s=processSummary(r);return s.cherry?'Cherry in <b>'+r1(s.cherry)+' kg</b>'+(s.green?' · Green out <b>'+r1(s.green)+' kg</b> · Outturn <b>'+r1(s.outturn)+'%</b>':'')+(s.days!=null?' · '+fmtDur(s.days*24):''):''}},
  {h:'Steps'},
  {k:'steps',t:'steps',full:1},
  {k:'notes',l:'Notes',t:'area',full:1}],
 green:[
  {k:'code',l:'Green lot code',t:'text',req:1},{k:'name',l:'Name',t:'text',ph:'Heggadde washed Catuai'},
  {k:'processId',l:'From process',t:'ref',ref:'process',full:1},
  {k:'lineageCalc',t:'calc',fn:r=>lineageHtml(r)},
  {k:'weightKg',l:'Green weight',t:'num',unitLabel:'kg',req:1},{k:'date',l:'Date',t:'date',def:today},
  {k:'bags',l:'Bags',t:'num'},{k:'bagKg',l:'Bag size',t:'num',unitLabel:'kg'},
  {h:'Quality'},
  {k:'moisture',l:'Moisture %',t:'num'},{k:'aw',l:'Water activity (aw)',t:'num'},
  {k:'awEst',t:'calc',fn:r=>awEstHtml(r.moisture,r.aw)},
  {k:'density',l:'Density g/L',t:'num'},{k:'screen',l:'Screen size',t:'text',ph:'17/18'},
  {k:'grade',l:'Grade',t:'text',ph:'AA, A, PB'},{k:'score',l:'Cup score',t:'num'},
  {k:'storage',l:'Storage',t:'text',full:1,ph:'GrainPro, store room 2'},
  {k:'stockCalc',t:'calc',fn:r=>stockHtml(r)},
  {k:'notes',l:'Notes',t:'area',full:1}]
};
const STEP_TYPES={
 'Sorting / floating':{f:['start','inKg','outKg','floatKg','notes']},
 'Pulping':{f:['start','inKg','outKg','method','notes'],methods:['Disc pulper','Drum pulper','Eco-pulper','Hand']},
 'Fermentation':{f:['start','end','method','vessel','notes'],methods:['Dry','Underwater','Anaerobic','Carbonic','With yeast / starter','Other'],read:['temp','ph','brix']},
 'Washing':{f:['start','method','notes'],methods:['Channel','Tank','Machine']},
 'Drying':{f:['start','end','method','location','layer','outKg','notes'],methods:['Raised beds','Patio','Tarpaulin','Mechanical dryer','Other'],read:['moisture','temp']},
 'Resting':{f:['start','end','method','location','notes'],methods:['In cherry','In parchment','As green'],read:['moisture','aw']},
 'Hulling':{f:['start','inKg','outKg','notes']},
 'Grading / sorting':{f:['start','inKg','outKg','method','defects','notes'],methods:['Screen','Density table','Colour sorter','Hand picking']},
 'Other':{f:['name','start','end','inKg','outKg','notes']}};
const STEP_LABELS={start:'Start',end:'End',inKg:'In kg',outKg:'Out kg',floatKg:'Floaters kg',method:'Method',vessel:'Vessel',location:'Location / bed',layer:'Layer cm',defects:'Defects',notes:'Notes',name:'Step name'};
const READ_LABELS={temp:'Temp °C',ph:'pH',brix:'°Brix',moisture:'Moisture %',aw:'Water activity',air:'Air °C',rh:'Air RH %',sampleG:'Sample g',pressure:'Pressure bar',ec:'EC µS/cm'};
const MEAS_OPT={'Sorting / floating':['brix'],'Fermentation':['temp','ph','brix','air','pressure','ec'],'Drying':['moisture','temp','air','rh','aw','sampleG'],'Resting':['moisture','aw','temp','rh']};
function measuresFor(s){const d=STEP_TYPES[s.type]||STEP_TYPES.Other;return s.measures||d.read||[]}
function measureOpts(s){return MEAS_OPT[s.type]||Object.keys(READ_LABELS)}
// Guide values. Sources listed in GUIDE_SRC; the user can treat them as starting points.
// Rough aw from moisture, fitted to the Cafe Imports data (12% about 0.624, 11.7% about 0.610). Arabica, 10 to 13% only.
function awFromMc(mc){mc=num(mc);return mc!=null&&mc>=10&&mc<=13?0.624+0.046*(mc-12):null}
function awEstHtml(mc,aw){const e=awFromMc(mc);if(e==null||num(aw)!=null)return '';return 'Water activity about <b>'+e.toFixed(2)+'</b> (estimate from moisture, ±0.03). '+(e>0.61?'Above 0.61: dry a little further or store cooler and drier.':'Under 0.61: good for storage.')}
// ---------- soil and soil life ----------
// Four principles after KoffyKraft's Natural Farming notes (resource dynamics, energy flux, patch dynamics, biotic trait diversity).
const PRACTICES=[['res','Resources keep moving','Mulch, residues and roots recycle food for soil life.',[['mulch','Mulch or leaf litter kept on the ground'],['residue','Prunings and pulp returned, not burned'],['notill','Little or no digging']]],
 ['energy','Living roots all year','Green plants feed soil life through their roots.',[['cover','Ground cover or cover crop'],['nobare','No bare soil in the dry months']]],

function guide(s,k){const t=s.type,m=String(s.method||'');const natural=/cherry|natural/i.test(m);

 if(t==='Drying'){if(k==='moisture')return{okHi:12,okLo:10,alarmLo:8,text:'Finish at 10 to 12% (Coffee Board). Upper limit 12% parchment, 13% cherry.'};if(k==='temp')return{warnHi:natural?45:40,text:'Dryer air at most 40 °C for parchment, 45 °C for cherry.'};if(k==='rh')return{warnHi:60,text:'Above 60% humidity the beans take moisture back.'};if(k==='aw')return{alarmHi:0.7,warnHi:0.61,okLo:0.5,okHi:0.6,text:'Aim for 0.50 to 0.60. Microbes can start growing from about 0.60. aw moves with the day\'s humidity, so read at the same time each day.'};if(k==='sampleG')return{text:'Dry when the sample weighs the same on two days running.'}}
 if(t==='Resting'){if(k==='aw')return{alarmHi:0.7,warnHi:0.61,okLo:0.45,okHi:0.58,text:'Keep under about 0.61: in a long Cafe Imports study, lots above it lost more cup score in transit and showed more stale, papery notes. SCA upper limit is 0.70. Read at the same time of day.'};if(k==='moisture')return{okLo:10,okHi:11.5,warnHi:11.7,alarmHi:12.5,text:'Aim for 11 to 11.5% for long storage. Above about 11.7%, water activity usually passes 0.61. ICO allows 8 to 12.5%.'};if(k==='rh')return{warnHi:60,text:'Keep store humidity under 60%.'};if(k==='temp')return{warnHi:25,text:'Store at about 20 to 25 °C.'}}

 return null}

function pass(t,r){const f=FILT[TAB]||{};const c=ctx(t,r);

 if(t==='harvest'){if(f.plot&&!(r.plotIds||[]).includes(f.plot))return false;if(f.pickType&&r.pickType!==f.pickType)return false;const b=(r.brix||[]).map(x=>num(x.v)).filter(x=>x!=null);const avg=b.length?b.reduce((a,x)=>a+x,0)/b.length:null;if(f.brixMin&&(avg==null||avg<num(f.brixMin)))return false;if(f.ripeMin&&(num(r.ripePct)==null||num(r.ripePct)<num(f.ripeMin)))return false}

 case 'refs':{const rows=f.ref==='harvest'?sortD(DB.harvest,'date'):DB[f.ref];const sel=new Set(v||[]);return '<div class="'+cls+'">'+lab+(rows.length?'<div class="checks">'+rows.map(x=>'<label><input type="checkbox" data-refs="'+f.k+'" value="'+x.id+'"'+(sel.has(x.id)?' checked':'')+'>'+esc(refLabel(f.ref,x))+'</label>').join('')+'</div>':'<div class="empty">None recorded yet.</div>')+'</div>'}
 case 'calc':return '<div class="calc" data-calc="'+f.k+'"'+(f.fn(CUR)?'':' hidden')+'>'+f.fn(CUR)+'</div>';
 case 'gps':return '<div class="'+cls+'"><label>GPS location</label><div class="row"><input id="f_lat" data-k="lat" type="number" step="any" placeholder="Latitude" value="'+esc(CUR.lat)+'" style="flex:1"><input id="f_lng" data-k="lng" type="number" step="any" placeholder="Longitude" value="'+esc(CUR.lng)+'" style="flex:1"></div><div class="row"><button type="button" class="btn small" id="gpsBtn">Use my location</button><span class="lsum" id="gpsInfo">'+(CUR.lat&&CUR.lng?'<a href="https://maps.google.com/?q='+esc(CUR.lat)+','+esc(CUR.lng)+'" target="_blank" rel="noopener">Open in map</a>'+(CUR.gpsAcc?' · ±'+Math.round(CUR.gpsAcc)+' m':''):'')+'</span></div></div>';
 case 'list':return '<div class="'+cls+'">'+lab+'<div class="lst" data-list="'+f.k+'"></div><div class="row"><button type="button" class="btn small" data-add="'+f.k+'">+ '+esc(f.add||'Add')+'</button><span class="lsum" data-lsum="'+f.k+'"></span></div></div>';
 case 'checks':{const on=new Set(v||[]);return '<div class="'+cls+'">'+lab+(f.groups==='PRACTICES'?PRACTICES:[]).map(([gk,gl,gd,items])=>'<div class="pgrp"><b>'+esc(gl)+'</b><span class="mini">'+esc(gd)+'</span><div class="checks">'+items.map(([k,l])=>'<label><input type="checkbox" data-chk="'+f.k+'" value="'+k+'"'+(on.has(k)?' checked':'')+'>'+esc(l)+'</label>').join('')+'</div></div>').join('')+'</div>'}
 case 'soiltest':return '<div class="'+cls+'" data-soiltest="1">'+soilTestHtml()+'</div>';
 case 'steps':return '<div class="'+cls+'"><div class="lst" id="steps"></div><div class="row" style="margin-top:6px"><select id="newStep" style="flex:1">'+Object.keys(STEP_TYPES).map(s=>'<option>'+s+'</option>').join('')+'</select><button type="button" class="btn small" id="addStep">+ Add step</button></div></div>';
 }return ''}
function bindForm(){const form=$('#form');
 const CODEDATE={harvest:['date','H'],process:['started','P'],green:['date','G']}[CUR_T];form.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.k;CUR[k]=el.value;if(k==='code')CUR._auto=0;if(CODEDATE&&CUR._auto&&k===CODEDATE[0]&&el.value){CUR.code=nextCode(CUR_T,CODEDATE[1],el.value);const c=$('#f_code');if(c)c.value=CUR.code}refreshCalcs()}));
 form.querySelectorAll('[data-refs]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.refs;CUR[k]=[...form.querySelectorAll('[data-refs="'+k+'"]:checked')].map(x=>x.value);refreshCalcs()}));
 F[CUR_T].filter(f=>f.t==='list').forEach(f=>{renderList(f);form.querySelector('[data-add="'+f.k+'"]').onclick=()=>{CUR[f.k]=[...(CUR[f.k]||[]),{}];renderList(f,true)}});
 form.querySelectorAll('[data-chk]').forEach(el=>el.addEventListener('change',()=>{const k=el.dataset.chk;CUR[k]=[...form.querySelectorAll('[data-chk="'+k+'"]:checked')].map(x=>x.value);refreshCalcs()}));
 bindSoilTest();
 if($('#gpsBtn'))$('#gpsBtn').onclick=getGps;
 if($('#steps')){renderSteps();$('#addStep').onclick=()=>{const t=$('#newStep').value;const last=(CUR.steps||[]).slice(-1)[0];CUR.steps=[...(CUR.steps||[]),{type:t,start:nowLocal(),inKg:last&&last.outKg?last.outKg:''}];renderSteps(true)}}}
function refreshCalcs(){F[CUR_T].filter(f=>f.t==='calc').forEach(f=>{const el=document.querySelector('[data-calc="'+f.k+'"]');if(!el)return;const h=f.fn(CUR);el.innerHTML=h;el.hidden=!h});F[CUR_T].filter(f=>f.t==='list').forEach(listSum)}
function renderList(f,focus){const box=document.querySelector('[data-list="'+f.k+'"]');const rows=CUR[f.k]||[];box.innerHTML=rows.map((r,i)=>'<div class="lrow" style="grid-template-columns:'+f.cols.map(c=>c.t==='num'?'1fr':'2fr').join(' ')+' auto">'+f.cols.map(c=>'<input data-li="'+i+'" data-lk="'+c.k+'" type="'+(c.t==='num'?'number':c.t)+'"'+(c.t==='num'?' step="any" inputmode="decimal"':'')+' placeholder="'+esc(c.l)+'" value="'+esc(r[c.k])+'" aria-label="'+esc(c.l)+'">').join('')+'<button type="button" class="x" data-rm="'+i+'" aria-label="Remove">×</button></div>').join('');
 box.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{CUR[f.k][+el.dataset.li][el.dataset.lk]=el.value;refreshCalcs()}));
 box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{CUR[f.k].splice(+b.dataset.rm,1);renderList(f);refreshCalcs()});
 listSum(f);refreshCalcs();if(focus){const ins=box.querySelectorAll('input');if(ins.length)ins[ins.length-f.cols.length].focus()}}
function listSum(f){const el=document.querySelector('[data-lsum="'+f.k+'"]');if(!el||!f.sum)return;const t=(CUR[f.k]||[]).map(r=>num(r[f.sum])).filter(x=>x!=null);el.textContent=t.length?t.length+' · total '+r2(t.reduce((a,b)=>a+b,0))+' kg':''}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function guideSourcesHtml(){return '<details class="mini gsrc"><summary>Guide values and sources</summary><p>Guide values are starting points from published sources. Sources differ, so adjust to your own lots.</p><ul>'+GUIDE_SRC.map(([t,u])=>'<li><a href="'+u+'" target="_blank" rel="noopener">'+esc(t)+'</a></li>').join('')+'</ul></details>'}
function detailsState(r){const c={},o={};if(r)r.querySelectorAll('details').forEach(d=>{const k=(d.querySelector('summary')||{}).textContent||'';const n=c[k]=(c[k]||0)+1;o[k+'#'+n]=d.open});return o}
function restoreDetails(r,o){const c={};if(r)r.querySelectorAll('details').forEach(d=>{const k=(d.querySelector('summary')||{}).textContent||'';const n=c[k]=(c[k]||0)+1;if(o[k+'#'+n]!==undefined)d.open=o[k+'#'+n]})}
function safeBackdrop(el,fn){let down=false;el.addEventListener('pointerdown',e=>{down=e.target===el});el.addEventListener('click',e=>{if(down&&e.target===el)fn();down=false})}
function renderSteps(focusLast){const box=$('#steps');const steps=CUR.steps||[];const _ds=detailsState(box);box.innerHTML=steps.length?steps.map((s,i)=>stepHtml(s,i)).join('')+(steps.some(x=>measuresFor(x).length)?guideSourcesHtml():''):'<div class="empty">No steps yet. Add them as you go: each step keeps its own times, weights and readings.</div>';
 restoreDetails(box,_ds); box.querySelectorAll('[data-si]').forEach(el=>el.addEventListener('input',()=>{const s=CUR.steps[+el.dataset.si];s[el.dataset.sk]=el.value;if(el.dataset.sk==='type'){renderSteps();return}updateStepCalc(+el.dataset.si);refreshCalcs()}));
 box.querySelectorAll('[data-ri]').forEach(el=>el.addEventListener('input',()=>{CUR.steps[+el.dataset.si].readings[+el.dataset.ri][el.dataset.rk]=el.value;refreshCalcs()}));
 box.querySelectorAll('[data-radd]').forEach(b=>b.onclick=()=>{const s=CUR.steps[+b.dataset.radd];s.readings=[...(s.readings||[]),{at:nowLocal()}];renderSteps()});
 box.querySelectorAll('[data-rrm]').forEach(b=>b.onclick=()=>{const [si,ri]=b.dataset.rrm.split(':').map(Number);CUR.steps[si].readings.splice(ri,1);renderSteps();refreshCalcs()});
 box.querySelectorAll('[data-srm]').forEach(b=>b.onclick=()=>{if(!confirm('Remove this step?'))return;CUR.steps.splice(+b.dataset.srm,1);renderSteps();refreshCalcs()});
 box.querySelectorAll('[data-sup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sup;if(i<1)return;[CUR.steps[i-1],CUR.steps[i]]=[CUR.steps[i],CUR.steps[i-1]];renderSteps()});
 box.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{const [si,k]=b.dataset.mt.split(':');const st=CUR.steps[+si];const ms=[...measuresFor(st)];const at=ms.indexOf(k);if(at>=0)ms.splice(at,1);else ms.push(k);st.measures=measureOpts(st).filter(x=>ms.includes(x));renderSteps()});
 box.querySelectorAll('[data-snow]').forEach(b=>b.onclick=()=>{const [si,k]=b.dataset.snow.split(':');CUR.steps[+si][k]=nowLocal();renderSteps();refreshCalcs()});
 box.querySelectorAll('[data-rk]').forEach(el=>{if(el.dataset.rk==='at')return;el.addEventListener('input',()=>{const st=CUR.steps[+el.dataset.si];const lab=el.closest('.rv');if(lab)lab.className='mini rv '+flagOf(st,el.dataset.rk,el.value)});el.addEventListener('change',()=>{const si=+el.dataset.si,st=CUR.steps[si];const c=box.querySelector('[data-charts="'+si+'"]');if(c)c.innerHTML=measuresFor(st).map(k=>chartHtml(st,k)).join('')})});
 refreshCalcs();if(focusLast)[...box.querySelectorAll('.step')].pop()?.scrollIntoView({behavior:'smooth',block:'center'})}
function stepCalc(s){const p=[];const h=hours(s.start,s.end);if(h!=null)p.push(fmtDur(h));const a=num(s.inKg),b=num(s.outKg);if(a&&b)p.push('yield '+r1(b/a*100)+'%');const rd=(s.readings||[]);if(rd.length)p.push(rd.length+' readings');return p.join(' · ')}
function updateStepCalc(i){const el=document.querySelector('[data-scalc="'+i+'"]');if(el)el.textContent=stepCalc(CUR.steps[i])}
function stepHtml(s,i){const def=STEP_TYPES[s.type]||STEP_TYPES.Other;const inp=(k)=>{const lab=STEP_LABELS[k];if(k==='notes')return '<textarea data-si="'+i+'" data-sk="notes" placeholder="Notes" style="grid-column:1/-1;min-height:56px">'+esc(s.notes)+'</textarea>';if(k==='method'&&def.methods)return '<select data-si="'+i+'" data-sk="method" aria-label="Method"><option value="">Method</option>'+def.methods.map(m=>'<option'+(s.method===m?' selected':'')+'>'+m+'</option>').join('')+'</select>';const type=k==='start'||k==='end'?'datetime-local':['inKg','outKg','floatKg','layer'].includes(k)?'number':'text';return '<label class="mini'+(type==='datetime-local'?' dt':'')+'" style="display:flex;flex-direction:column;gap:3px">'+lab+'<input data-si="'+i+'" data-sk="'+k+'" type="'+type+'"'+(type==='number'?' step="any" inputmode="decimal"':'')+' value="'+esc(s[k])+'"></label>'};
 const reads=readsHtml(s,i);
 return '<div class="step"><div class="sh"><span class="mini">'+(i+1)+'</span><select data-si="'+i+'" data-sk="type" aria-label="Step type">'+Object.keys(STEP_TYPES).map(t=>'<option'+(s.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select>'+(i>0?'<button type="button" class="x" data-sup="'+i+'" aria-label="Move up">↑</button>':'')+'<button type="button" class="x" data-srm="'+i+'" aria-label="Remove step">×</button></div>'+runHtml(s,i)+'<div class="grid2">'+def.f.map(inp).join('')+'</div>'+reads+'<div class="mini" data-scalc="'+i+'">'+esc(stepCalc(s))+'</div></div>'}
function getGps(){if(!navigator.geolocation){toast('Location not available on this device');return}$('#gpsInfo').textContent='Getting location…';navigator.geolocation.getCurrentPosition(p=>{CUR.lat=r6(p.coords.latitude);CUR.lng=r6(p.coords.longitude);CUR.gpsAcc=p.coords.accuracy;$('#f_lat').value=CUR.lat;$('#f_lng').value=CUR.lng;if(p.coords.altitude!=null&&!CUR.altitude){const m=p.coords.altitude;CUR.altitude=Math.round((CUR.altUnit||'ft')==='ft'?m*3.28084:m);const a=$('#f_altitude');if(a)a.value=CUR.altitude}$('#gpsInfo').innerHTML='<a href="https://maps.google.com/?q='+CUR.lat+','+CUR.lng+'" target="_blank" rel="noopener">Open in map</a> · ±'+Math.round(p.coords.accuracy)+' m'},e=>{$('#gpsInfo').textContent='Could not get location: '+e.message},{enableHighAccuracy:true,timeout:20000})}
function r6(v){return Math.round(v*1e6)/1e6}
async function save(){const miss=F[CUR_T].filter(f=>f.req&&(CUR[f.k]==null||String(CUR[f.k]).trim()===''));if(miss.length){toast('Fill in: '+miss.map(f=>f.l).join(', '));const el=$('#'+fid(miss[0].k));el&&el.focus();return}
 if(CUR_T==='green'){const L=lineage(CUR);CUR.estate=L.estates.map(e=>e.name).join(', ');CUR.variety=L.varieties.join(', ');CUR.species=L.species.join(', ');CUR.pathway=L.p?L.p.pathway:''}
 delete CUR._auto;if($('#alsoCloud')&&$('#alsoCloud').checked)CUR.cloud=true;const saved=await ORIGIN.put(CUR);toast('Saved');const back={estate:'farm',plot:'farm',harvest:'harvest',process:'process',green:'green'}[CUR_T];CUR=saved;
 if(CUR_T==='process'||CUR_T==='green'){await loadAll();editView(CUR_T,saved.id);history.replaceState(null,'','#edit/'+CUR_T+'/'+saved.id)}else go(back)}
async function del(){const t=CUR_T,id=CUR.id;const uses={estate:()=>DB.plot.filter(p=>p.estateId===id).length,plot:()=>DB.harvest.filter(h=>(h.plotIds||[]).includes(id)).length,harvest:()=>DB.process.filter(p=>(p.harvestIds||[]).includes(id)).length,process:()=>DB.green.filter(g=>g.processId===id).length,green:()=>roastsFor({id}).length}[t]();if(!confirm(uses?'This is used by '+uses+' other record'+(uses===1?'':'s')+'. Delete anyway? They will lose this link.':'Delete this record?'))return;await ORIGIN.remove(id);toast('Deleted');go({estate:'farm',plot:'farm'}[t]||t)}

// ---------- sync status ----------
function refreshSyncBadge(s){const el=$('#syncState');if(!el)return;const st=s||refreshSyncBadge.last;if(!st)return;el.className='sync '+(st.status||'');el.querySelector('span').textContent=({local:'Saved on this device',offline:'Offline, will sync later',syncing:'Syncing…',error:'Sync failed, will retry'}[st.status])||cloudModeText('origin')}
ORIGIN.onSync(s=>{refreshSyncBadge.last=s;refreshSyncBadge(s);if(s.status==='synced'&&s.changed&&!location.hash.startsWith('#edit/'))route()});
PREFS.pull().then(route).then(()=>ORIGIN.sync().catch(()=>{}));
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
