<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoffyKraft Brew</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0}.app{max-width:620px;margin:auto;padding:25px 16px}header{display:flex;justify-content:space-between}h1{margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{grid-column:1/-1;min-height:90px}.btn{margin-top:12px;padding:12px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700}</style></head><body><main class="app"><header><h1>Brew</h1><a href="index.html">KoffyKraft</a></header><div class="grid"><input id="coffee" placeholder="Coffee / lot"><input id="method" placeholder="Method"><input id="dose" type="number" step=".1" placeholder="Coffee g"><input id="water" type="number" step=".1" placeholder="Water g"><input id="temp" type="number" step=".1" placeholder="Water °C"><input id="time" placeholder="Time"><textarea id="notes" placeholder="Result / notes"></textarea></div><button class="btn" id="save">Save brew</button><p id="msg"></p></main><script>save.onclick=()=>{const a=JSON.parse(localStorage.getItem('kk_brew_runs_v1')||'[]');a.unshift({id:'brew-'+Date.now(),brewedAt:new Date().toISOString(),coffee:coffee.value,method:method.value,coffeeWeight:dose.value,waterWeight:water.value,waterTemperature:temp.value,brewTime:time.value,notes:notes.value});localStorage.setItem('kk_brew_runs_v1',JSON.stringify(a));msg.textContent='Saved on this device'};</script></body></html>
