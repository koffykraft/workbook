<style>
:root{--bg:#f7f5f0;--ink:#171512;--muted:#77716a;--line:#ddd8d0;--coffee:#8d583b;--soft:#faf7f2;--ok:#3f6b5a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;color:var(--ink);background:var(--bg)}
.app{max-width:680px;margin:auto;padding:24px 16px 120px}
h1{font-size:32px;letter-spacing:-.04em;margin:6px 0 4px;line-height:1.2}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:#c9bfb2;display:inline-block}
.sync.synced i{background:var(--ok)}.sync.syncing i{background:#c47f1d}.sync.error i{background:#b4432f}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#ece7df;border-radius:12px;padding:4px;margin:12px 0 16px;position:sticky;top:0;z-index:5}
.tabs button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}

button{font:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;font-weight:600;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.primary{background:#171512;color:#fff;border-color:#171512}
.btn.danger{color:#b4432f}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:8px 0;cursor:pointer}
.card:active{background:var(--soft)}

.card .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:var(--soft);border:1px solid #efe8de;border-radius:999px;padding:3px 8px;color:#5c554e}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:14px;font-size:13px;line-height:1.5}

.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}

.fld.full{grid-column:1/-1}

input,select,textarea{font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);width:100%;min-width:0}

.unitwrap{display:flex;gap:6px}.unitwrap input{flex:1}.unitwrap select{width:auto;flex:0 0 auto;padding:11px 8px}
.fhead{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coffee);margin:12px 0 0;font-weight:700}
.calc{grid-column:1/-1;background:var(--soft);border:1px solid #efe8de;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}

.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);font-weight:400;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.checks input{width:auto}
.lst{display:grid;gap:6px}
.lrow{display:grid;gap:6px;align-items:center}
.lrow input,.lrow select{padding:9px 10px;font-size:14px}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:4px 8px;cursor:pointer}
.lsum{font-size:13px;color:var(--muted)}
.step{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;display:grid;gap:8px}
.step .sh{display:flex;gap:8px;align-items:center}
.step .sh select{flex:1;font-weight:600}
.step .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.step .grid2>*,.lrow>*{min-width:0}.step .dt{grid-column:1/-1}.rd{border:1px solid #efe8de;background:var(--soft);border-radius:11px;padding:8px;display:grid;gap:6px}.rd .r1{display:flex;gap:6px;align-items:center}.rd .r1 input{flex:1}.rd .r2{display:grid;gap:6px}
.step .mini{font-size:12px;color:var(--muted)}
.pickn{margin-top:6px;justify-self:start}#dialIn .mini{font-size:12.5px;color:var(--muted);line-height:1.45}.dsl{display:grid;gap:10px;margin:8px 0}.dlv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.dlv .chip{padding:6px 11px;font-size:13px}.dsl label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.dsl b{color:var(--ink)}.dsl input[type=range]{width:100%;accent-color:#3f6b5a;height:32px}.nbox .mini{font-size:12px;color:var(--muted)}
.nsheet{position:fixed;inset:0;background:rgba(23,21,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}.nsheet[hidden]{display:none}
.nbox{background:var(--bg,#f7f5f0);width:min(680px,100%);height:86vh;height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding:14px 14px calc(10px + env(safe-area-inset-bottom))}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px}.nsel{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;min-height:36px;align-items:center}
.nscroll{overflow:auto;flex:1;padding-bottom:6px}.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ntile{touch-action:manipulation;font:inherit;text-align:left;border:1px solid var(--line);border-left:8px solid var(--nc);background:#fff;background:color-mix(in srgb,var(--nc) 14%,#fff);border-radius:12px;padding:11px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:52px;color:var(--ink)}.ntile span{font-weight:700;font-size:14px}.ntile small{color:var(--muted);font-size:11.5px}.ntile.on{background:var(--nc);color:#fff;border-color:var(--nc)}.ntile.on small{color:#fff}
.nopen{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:12px;background:#fff;border:2px solid var(--nc)}
.nadd{display:flex;gap:6px;margin-top:10px}.nadd input{flex:1}.nfoot{display:flex;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line)}.nfoot .btn.primary{flex:1}
.gq{border-top:1px solid #f0ebe3;padding-top:8px;display:grid;gap:4px}.gqh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}.gqv{font-variant-numeric:tabular-nums;font-weight:700}.gqv small{font-weight:500;color:var(--muted)}
.gqc{display:flex;flex-wrap:wrap;gap:6px}.chip{touch-action:manipulation;font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;cursor:pointer;color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.pm{min-width:38px;font-weight:700}.chip.off{border-style:dashed}.chip.off.on{background:#8a3a2a;border-color:#8a3a2a}
details.mini{font-size:13px;color:var(--muted);line-height:1.45}details.mini .calc{color:var(--ink);font-size:14px}details.mini summary{cursor:pointer;color:var(--coffee);font-weight:600;padding:4px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:space-between;z-index:20}
.bar .grow{flex:1}
.lineage{display:grid;gap:0;margin-top:4px}
.lin{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.lin .dot{width:12px;height:12px;border-radius:50%;background:var(--coffee);margin:4px 5px 0;position:relative}
.lin:not(:last-child) .dot::after{content:"";position:absolute;left:5px;top:12px;width:2px;height:44px;background:#e3d9cc}
.lin .lt{font-size:14px;padding-bottom:14px;line-height:1.4}.lin .lt small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#171512;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px;min-width:0}
.tile *{min-width:0}
.thead{display:flex;align-items:flex-start;gap:8px}.thead .ti{flex:1;min-width:0}
.tname{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tmeta{font-size:13px;color:var(--muted);margin-top:2px}
.ibtn{flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}.ibtn svg{width:18px;height:18px}
.tform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;background:var(--soft);border:1px solid #efe8de;border-radius:12px;padding:10px}.tform .full{grid-column:1/-1}.tform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}.tform select,.tform input{width:100%;padding:10px}
.tap{border:0;border-radius:14px;background:var(--soft);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font:inherit;color:var(--ink);min-height:88px;text-align:left;width:100%;position:relative;overflow:hidden}
.tap .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}.tap .small{font-size:13px;color:var(--muted);line-height:1.35;text-align:right;max-width:55%}
.tap .tbar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:transparent}.tap .tbar i{display:block;height:100%;background:var(--coffee);width:0}
.tile.run .tap{background:#f3e9df}.tile.over .tap{background:#8d583b;color:#fff}.tile.over .tap .small{color:#f4e6da}.tile.over .tap .tbar i{background:#f4e6da}.tile.done .tap{background:#e3eee8}
.tfoot{display:flex;gap:8px;justify-content:flex-end}
.cups{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:8px}.cup{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;display:grid;justify-items:center;gap:2px}.cup span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.cup b{font-size:26px;font-variant-numeric:tabular-nums}
.back{background:none;border:0;color:var(--coffee);font-weight:600;padding:10px 12px 10px 0;min-height:44px;cursor:pointer;font-size:15px}
@media(max-width:380px){.f{grid-template-columns:1fr}}
.bhp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}.bht{display:flex;align-items:center;gap:10px}#bhClock{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px}.bht .mini{flex:1;line-height:1.35}.bhp details{font-size:13px;color:var(--muted);line-height:1.5}.bhp summary{cursor:pointer;color:var(--coffee);font-weight:600}.bhp p{margin:6px 0}.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--coffee);font-weight:700;margin-top:2px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.bhf{display:flex;flex-direction:column;gap:3px}.bhf.low input{border-color:#b4432f;background:#fbefec}.dq{color:#b4432f;font-weight:600}#passTabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0}#passTabs .tabs{position:static;margin:0 0 6px;grid-template-columns:repeat(3,1fr)}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};
const r1=v=>Math.round(v*10)/10, r2=v=>Math.round(v*100)/100;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1800)}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function fmtDT(d){if(!d)return '';const x=new Date(d);return isNaN(x)?d:x.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function fmtDate(d){if(!d)return '';const x=new Date(d.length===10?d+'T00:00':d);return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}

// ---------- roasts (this device + cloud) ----------
let ROASTS=[],DB={brew:[],cupping:[],tasting:[]};
async function localRoasts(){try{return await new Promise(ok=>{const q=indexedDB.open('KoffyKraftTemporaryRoastbook');q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('roasts')){db.close();ok([]);return}const t=db.transaction('roasts','readonly').objectStore('roasts').getAll();t.onsuccess=()=>{db.close();ok(t.result||[])};t.onerror=()=>{db.close();ok([])}};q.onerror=()=>ok([]);q.onupgradeneeded=e=>e.target.transaction.abort()})}catch{return[]}}
let CLOUD=null;
function cachedCloud(){if(CLOUD)return CLOUD;try{const c=JSON.parse(sessionStorage.getItem('kk_cloud_roasts_c')||'null');if(c&&c.items){CLOUD=c.items;if(Date.now()-c.at<6e5)CLOUD.fresh=1}}catch(e){}return CLOUD||[]}
let CC_BUSY=false;function refreshCloud(){if(CC_BUSY||(CLOUD&&CLOUD.fresh))return;CC_BUSY=true;const before=(CLOUD||[]).length;CLOUD=null;cloudRoasts().then(x=>{CC_BUSY=false;if(!x||!x.length){CLOUD=Object.assign([],{fresh:1});return}x.fresh=1;try{sessionStorage.setItem('kk_cloud_roasts_c',JSON.stringify({at:Date.now(),items:x}))}catch(e){}if(x.length!==before&&!location.hash.startsWith('#edit/'))route()}).catch(()=>{CC_BUSY=false})}
async function cloudRoasts(){if(CLOUD)return CLOUD;if(typeof SYNC==='undefined'||!SYNC.isAuthenticated()||!navigator.onLine)return[];try{const res=await SYNC.loadRoasts();CLOUD=(res.items||[]).map(r=>{let n={};try{n=typeof r.notes==='string'?JSON.parse(r.notes):(r.notes||{})}catch(e){n={bean:r.notes}}return{id:r.id,estate:n.estate||'',coffeeCode:n.coffeeCode||'',bean:n.bean||'',roastNo:r.roast_number,roastDate:r.roast_date,finishedAt:n.finishedAt||r.ended_at||(r.created_at?String(r.created_at).replace(' ','T')+'Z':''),greenLotId:n.greenLotId||'',targetColor:r.target_color,finalColor:r.final_color}});return CLOUD}catch(e){return[]}}
function cupExport(){const samples=DB.cupping.flatMap(c=>(c.samples||[]).map(s=>({session:c.id,date:c.at,protocol:c.protocol||'SCA',...s})));KKX.menu('Cup records',[{label:'Brews',name:'brews',rows:DB.brew},{label:'Cupping sessions',name:'cupping',rows:DB.cupping},{label:'Cupping samples, one row each',name:'cupping-samples',rows:samples},{label:'Tasting tests',name:'tasting',rows:DB.tasting}])}
async function loadAll(){const A=await ORIGIN.allTypes(['brew','cupping','tasting']);DB.brew=A.brew;DB.cupping=A.cupping;DB.tasting=A.tasting;const m=new Map((await localRoasts()).map(r=>[r.id,r]));const cr=cachedCloud();refreshCloud();for(const r of cr)if(!m.has(r.id))m.set(r.id,r);ROASTS=[...m.values()].sort((a,b)=>String(b.finishedAt||b.roastDate||'').localeCompare(String(a.finishedAt||a.roastDate||'')))}
function roastById(id){return ROASTS.find(r=>String(r.id)===String(id))}
function roastLabel(r){if(!r)return '';return [r.estate||r.coffeeCode||r.bean||'Roast',r.roastNo?'#'+r.roastNo:'',r.roastDate?fmtDate(r.roastDate):''].filter(Boolean).join(' · ')}
function roastedAt(r){if(!r)return null;const t=r.finishedAt||r.roastDate;const d=new Date(t&&t.length===10?t+'T12:00':t);return isNaN(d)?null:d}
function restDays(roastId,at){const r=roastedAt(roastById(roastId));const b=new Date(at);if(!r||isNaN(b))return null;return (b-r)/864e5}
function restText(d){if(d==null)return '';if(d<0)return 'before the roast date';if(d<1)return Math.round(d*24)+' h after roast';return r1(d)+' days rest'}

// ---------- scoring ----------
const ATTR=[['fragrance','Fragrance / aroma'],['flavor','Flavour'],['aftertaste','Aftertaste'],['acidity','Acidity'],['body','Body'],['balance','Balance'],['overall','Overall']];
const CUPS_ATTR=[['uniform','Uniform cups'],['clean','Clean cups'],['sweet','Sweet cups']];
const BH=[['aroma','Aroma','Smell'],['flavor','Flavour','Smell'],['aftertaste','Aftertaste','Smell'],['acidity','Acidity','Taste'],['sweetness','Sweetness','Taste'],['bitterness','Bitterness','Taste'],['weight','Weight','Feel'],['texture','Texture','Feel'],['afterfeel','Afterfeel','Feel'],['balance','Balance','Balance']];
const BH_INT=['acidity','sweetness','bitterness'];
const PASSES=[['h','Hot','65°C'],['w','Warm','55°C'],['c','Cool','45°C']];
const PROTO={SCA:'SCA',BH:'Barista Hustle 10',Robusta:'Robusta (CQI)',Simple:'Simple'};
const RB=[['fragrance','Fragrance / aroma'],['flavor','Flavour'],['aftertaste','Aftertaste'],['saltacid','Salt / acid'],['bittersweet','Bitter / sweet'],['mouthfeel','Mouthfeel'],['balance','Balance'],['overall','Overall']];
const RB_CUPS=[['uniform','Uniform cups'],['clean','Clean cups']];
const RB_INT=[['i_dry','Dry fragrance'],['i_wet','Wet aroma'],['i_salt','Low salt'],['i_acid','High acid'],['i_bitter','Low bitter'],['i_sweet','High sweet'],['i_weight','Weight'],['i_texture','Texture']];
function isRB(c){return c.protocol==='Robusta'}
function scoreAttrs(c){return isRB(c)?RB:ATTR}
function cupsAttrs(c){return isRB(c)?RB_CUPS:CUPS_ATTR}
// guided pathway: which step each attribute belongs to, and a plain prompt (KoffyKraft wording, after the SCA and CQI protocols)
const STEP_SCA=[[['fragrance'],'1. Smell','Dry grounds first, then the wet crust as you break it.'],[['flavor','aftertaste','acidity','body'],'2. Taste','Slurp once the cups are near 70 °C, about 8 to 10 minutes after pouring.'],[['balance'],'3. As it cools','Keep tasting as the cups cool. Does it hold together?'],[['overall'],'4. Your verdict','How much do you like it, all things together?']];
const STEP_RB=[[['fragrance'],'1. Smell','Dry grounds first, then the wet crust as you break it.'],[['flavor','aftertaste'],'2. Taste','Slurp once the cups are near 70 °C, about 8 to 10 minutes after pouring.'],[['saltacid','bittersweet','mouthfeel'],'3. As it cools','Between about 70 and 60 °C.'],[['balance'],'4. Near room temperature','Does it hold together as it cools?'],[['overall'],'5. Your verdict','How much do you like it, all things together?']];
const GUIDE={fragrance:'Pleasant and strong scores higher.',flavor:'The main taste and smell together. Clear, pleasant and layered scores higher.',aftertaste:'What stays after you spit or swallow. Long and pleasant scores higher; short or harsh, lower.',acidity:'Brightness. Lively and pleasant scores higher; sour or sharp, lower.',body:'Weight in the mouth. Rich and smooth scores higher.',saltacid:'Robusta can taste salty or harsh. Less salt and more soft, fruity acidity scores higher.',bittersweet:'Less bitter and more sweet scores higher.',mouthfeel:'Weight on the tongue and smooth, oily texture. Full and smooth scores higher.',balance:'Flavour, aftertaste, mouthfeel and sweetness working together. Nothing missing or overpowering scores higher.',overall:'Your own verdict.'};
const WORDS_SCA=[[6,'Good'],[7,'Very good'],[8,'Excellent'],[9,'Outstanding']];

const PAL={sour:['Sour','citric acid (nimbu sat)',[0.25,0.5,1,2]],sweet:['Sweet','white sugar',[5,10,20,40]],salt:['Salt','plain white salt',[0.5,1,2,4]]};
const PAL_K=['sour','sweet','salt'],ROMAN=['I','II','III','IV'];
function palSetup(t){if(!t.pal){const used=[];t.pal={};PAL_K.forEach(k=>{const codes=[0,1,2,3].map(()=>code3(used));const order=[...codes];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}t.pal[k]={codes,order}})}if(!(t.tasters||[]).length)t.tasters=[{name:''}];if(t.palMl==null)t.palMl='100'}
function palScore(t,x,k){const r=(x.rank||{})[k]||[];if(r.length<4)return null;const lv=c=>t.pal[k].codes.indexOf(c);let ok=0;for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(lv(r[i])<lv(r[j]))ok++;return ok}
function palWord(v){return v===6?'Perfect':v===5?'One pair swapped':v>=3?'Getting there':'Try again'}
function palHtml(){const t=CUR;palSetup(t);const V=Math.max(10,num(t.palMl)||100),n=(t.tasters||[]).length;
 const prep='<details class="mini"><summary>How to run it</summary><p style="margin:6px 0">1. Mix four strengths of each taste below. 2. Label each cup with its code from the preparation key, on the side or underneath. 3. Shuffle the cups so the order gives nothing away. 4. Taste each set left to right, sip plain water between cups, and spit if you like. 5. Tap the codes from weakest to strongest. 6. Reveal the answers.</p><p style="margin:6px 0">Alone: hide the key once the cups are labelled. Team: one person prepares, the others only see the codes. Repeat until everyone scores 6 of 6; it is a quick way to calibrate a cupping team.</p></details>'+
 '<details class="mini"><summary>What you need</summary><div class="calc" style="margin-top:8px"><b>To buy</b><br>'+
 '<b>Citric acid</b>: sold as nimbu sat or lemon salt in grocery and baking shops. Pick a food-grade pack; it is white crystals with no smell. Do not use lemon juice; its strength varies.<br>'+
 '<b>White sugar</b>: ordinary refined sugar. Not jaggery, brown sugar or honey; they add other flavours.<br>'+
 '<b>Salt</b>: plain white table salt. Avoid rock salt (sendha or kala namak); it carries other minerals and smells.<br>'+
 '<b>Water</b>: packaged drinking water or RO water with no taste or smell. Not chlorinated tap water.</div>'+
 '<div class="calc" style="margin-top:8px"><b>Kit</b><br>A scale that reads 0.1 g (a 0.01 g jewellery scale is better for the citric acid) · a measuring jug · a spoon to stir · 12 small cups or shot glasses per taster, or 12 shared cups with a spoon each · masking tape and a marker for the codes · a glass of plain water to sip between cups · a cup to spit into.</div></details>'+
 '<details class="mini"><summary>Make the solutions</summary><label class="mini" style="display:flex;flex-direction:column;gap:3px;margin:8px 0">Amount of each strength (ml)<input type="number" inputmode="numeric" data-tk="palMl" value="'+esc(t.palMl)+'"></label><div class="mini">About 10 to 15 ml per taster per cup. '+(n>1?n+' tasters need at least '+n*15+' ml.':'')+'</div>'+
 PAL_K.map(k=>{const [nm,what,g]=PAL[k];return '<div class="calc" style="margin-top:8px"><b>'+nm+'</b>, '+what+'<br>Easy way, one weighing: dissolve <b>'+r2(g[3]*2*V/1000)+' g</b> in water to make '+2*V+' ml. That is strength IV. Pour off '+V+' ml. Add '+V+' ml water to the rest: strength III. Pour off '+V+' ml, add '+V+' ml water: II. Repeat: I.<br><span class="mini">Or weigh each: '+g.map((x,i)=>ROMAN[i]+' '+r2(x*V/1000)+' g').join(' · ')+' in '+V+' ml.</span></div>'}).join('')+
 '<div class="mini" style="margin-top:6px">Use clean, odour-free water at room temperature. Make them the day before and keep them in the fridge if you like; warm to room temperature before tasting. Strengths from Ted Lingle, The Coffee Cupper\'s Handbook (SCAA).</div></details>'+
 '<details class="mini"><summary>Preparation key (keep hidden from tasters)</summary>'+PAL_K.map(k=>'<div style="margin-top:6px"><b>'+PAL[k][0]+'</b>: '+t.pal[k].codes.map((c,i)=>ROMAN[i]+' = '+c).join(' · ')+'</div>').join('')+'<button type="button" class="btn small" id="palNew" style="margin-top:8px">New codes</button></details>';
 const tastersH=(t.tasters||[]).map((x,i)=>'<div class="step"><div class="sh"><input data-ti="'+i+'" data-tf="name" placeholder="Taster '+(i+1)+'" value="'+esc(x.name)+'" style="flex:1"><button type="button" class="x" data-trm="'+i+'" aria-label="Remove taster">×</button></div>'+PAL_K.map(k=>{const r=(x.rank||{})[k]||[];const sc=t.revealed?palScore(t,x,k):null;
  return '<div class="grp" style="margin-top:2px">'+PAL[k][0]+'</div><div class="gqc">'+t.pal[k].order.map(c=>{const pos=r.indexOf(c);return '<button type="button" class="chip'+(pos>=0?' on':'')+'" data-pt="'+i+'" data-pk="'+k+'" data-pc="'+c+'">'+(pos>=0?'<small>'+(pos+1)+'.</small> ':'')+c+'</button>'}).join('')+(r.length?'<button type="button" class="chip pm" data-pclr="'+i+'" data-pk="'+k+'" aria-label="Clear">↺</button>':'')+'</div><div class="mini">'+(r.length<4?'Tap from weakest to strongest'+(r.length?' ('+r.length+' of 4)':''):t.revealed?'<b style="color:var(--ink)">'+sc+' of 6 pairs</b> · '+palWord(sc)+' · right order '+t.pal[k].codes.join(' → '):'Ranked')+'</div>'}).join('')+'</div>').join('');
 const done=(t.tasters||[]).every(x=>PAL_K.every(k=>((x.rank||{})[k]||[]).length===4));
 return prep+'<div class="lst" style="margin-top:8px">'+tastersH+'</div><button type="button" class="btn small" id="addTaster" style="margin-top:6px">+ Taster</button><div style="margin-top:10px"><button type="button" class="btn '+(t.revealed?'small':'primary')+'" id="palReveal">'+(t.revealed?'Hide answers':done?'Reveal answers':'Reveal answers (some not ranked yet)')+'</button></div>'+(t.revealed?'<div class="calc" style="margin-top:8px">'+palTotals(t)+'</div>':'')}
function palTotals(t){const rows=(t.tasters||[]).map((x,i)=>{const sc=PAL_K.map(k=>palScore(t,x,k));const tot=sc.reduce((a,b)=>a+(b||0),0);return '<b>'+esc(x.name||'Taster '+(i+1))+'</b>: '+tot+' of 18 ('+PAL_K.map((k,j)=>PAL[k][0].toLowerCase()+' '+(sc[j]??'–')).join(', ')+')'});return rows.join('<br>')+'<div class="mini" style="margin-top:6px">Each taste has 6 pairs to put in order. 6 of 6 is a clean ranking; one swap usually means two neighbouring strengths were close for you.</div>'}

const DESC=[['look','Appearance'],['smell','Smell (dry and wet)'],['taste','Basic tastes'],['aroma','Aroma in the mouth'],['feel','Mouthfeel'],['after','Aftertaste']];
function code3(used){let c;do{c=String(100+Math.floor(Math.random()*900))}while(used.includes(c));used.push(c);return c}
function newCodes(t){const u=[];t.codeA=code3(u);t.codeB=code3(u);const odd=Math.random()<.5?'A':'B',same=odd==='A'?'B':'A';const cups=[odd,same,same].map(x=>({s:x,code:code3(u)}));for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cups[i],cups[j]]=[cups[j],cups[i]]}t.cups=cups;t.odd=odd}
function sampleName(t,x){const r=roastById(t['roast'+x]);return r?roastLabel(r):t['roastLabel'+x]||t['label'+x]||'Sample '+x}
function binomTail(n,k,p){let s=0,c=1;for(let i=0;i<=n;i++){if(i>0)c=c*(n-i+1)/i;if(i>=k)s+=c*Math.pow(p,i)*Math.pow(1-p,n-i)}return Math.min(1,s)}
const pTxt=p=>p<0.001?'under 0.001':String(Math.round(p*1000)/1000);
function triResult(t){const ts=(t.tasters||[]).filter(x=>x.pick);const odd=(t.cups||[]).find(c=>c.s===t.odd);const k=ts.filter(x=>odd&&x.pick===odd.code).length,n=ts.length;return{k,n,p:n?binomTail(n,k,1/3):1}}
const TL=['A','B','C','D','E','F'];
function letters(t){return TL.slice(0,t.kind==='triangle'?2:Math.max(2,Math.min(6,t.n||2)))}
function ensureCodes(t){const used=TL.map(x=>t['code'+x]).filter(Boolean);letters(t).forEach(x=>{if(!t['code'+x])t['code'+x]=code3(used)})}
function gammaQ(a,x){if(x<=0)return 1;const gln=(z=>{const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=z,tmp=z+5.5;tmp-=(z+.5)*Math.log(tmp);let ser=1.000000000190015;for(const k of c)ser+=k/++y;return -tmp+Math.log(2.5066282746310005*ser/z)})(a);if(x<a+1){let sum=1/a,del=sum,ap=a;for(let n=0;n<200;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-12)break}return 1-sum*Math.exp(-x+a*Math.log(x)-gln)}let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<200;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-12)break}return Math.exp(-x+a*Math.log(x)-gln)*h}
function prefResult(t){const L=letters(t),v=t.votes||[];const counts=L.map(x=>v.filter(y=>y===x).length);const o=v.filter(y=>y==='0').length,n=counts.reduce((a,b)=>a+b,0);let p=1;if(n){if(L.length===2){p=Math.min(1,2*binomTail(n,Math.max(...counts),.5))}else{const e=n/L.length;const chi=counts.reduce((a,c)=>a+(c-e)*(c-e)/e,0);p=gammaQ((L.length-1)/2,chi/2)}}const top=Math.max(...counts);const lead=counts.filter(c=>c===top).length===1?L[counts.indexOf(top)]:null;return{L,counts,o,n,p,lead,a:counts[0],b:counts[1]}}
function testSummary(t){if(t.kind==='palate'){if(!t.pal)return '';const tot=(t.tasters||[]).map(x=>PAL_K.reduce((a,k)=>a+(palScore(t,x,k)||0),0));return tot.length?(t.tasters.length===1?tot[0]+' of 18 pairs':tot.length+' tasters, best '+Math.max(...tot)+' of 18'):''}if(t.kind==='triangle'){const r=triResult(t);return r.n?r.k+' of '+r.n+' correct'+(r.p<0.05?', different':''):''}if(t.kind==='preference'){const r=prefResult(t);return r.n?r.L.map((x,i)=>x+' '+r.counts[i]).join(' · ')+(r.o?' · none '+r.o:''):''}return t.main||''}
function testBodyHtmlTri(){const t=CUR;if(t.kind==='describe')return '<div class="lst">'+DESC.map(([k,l])=>'<div class="step"><div class="mini" style="font-weight:600;color:var(--ink)">'+l+'</div><div class="grid2"><textarea data-tk="d_A_'+k+'" placeholder="A" style="min-height:52px">'+esc(t['d_A_'+k])+'</textarea><textarea data-tk="d_B_'+k+'" placeholder="B" style="min-height:52px">'+esc(t['d_B_'+k])+'</textarea></div></div>').join('')+'<label class="mini" style="display:flex;flex-direction:column;gap:4px">Main difference<input data-tk="main" value="'+esc(t.main)+'" placeholder="B is sweeter with a heavier body"></label></div>';
 if(t.kind==='preference'){const r=prefResult(t);return '<div class="calc">Serve A in cups marked <b>'+t.codeA+'</b> and B in cups marked <b>'+t.codeB+'</b>. Tasters see only the codes. Tap the code each person prefers.</div><div class="grid2" style="margin-top:8px"><button type="button" class="btn primary" data-vote="A">Prefers '+t.codeA+'</button><button type="button" class="btn primary" data-vote="B">Prefers '+t.codeB+'</button></div><div class="row" style="margin-top:8px"><button type="button" class="btn small" data-vote="0">No preference</button><button type="button" class="btn small" id="undoVote"'+((t.votes||[]).length?'':' disabled')+'>Undo last</button></div><div class="calc" style="margin-top:8px">'+(r.n+r.o?'A <b>'+r.a+'</b> ('+Math.round(r.a/(r.n||1)*100)+'%) · B <b>'+r.b+'</b> ('+Math.round(r.b/(r.n||1)*100)+'%)'+(r.o?' · no preference '+r.o:'')+'<br>'+(r.n<6?'Keep going: six or more votes give a useful answer.':r.p<0.05?'<b>A real preference for '+(r.a>r.b?'A':'B')+'</b> (p '+pTxt(r.p)+').':'No clear preference yet (p '+pTxt(r.p)+').'):'No votes yet.')+'</div>'}
 const r=triResult(t);const codes=(t.cups||[]).map(c=>c.code);
 return '<div class="calc">Pour three cups with these codes. Two hold the same coffee, one is different. Each taster picks the odd one out.<div class="cups">'+codes.map(c=>'<div class="cup"><span>Cup</span><b>'+c+'</b></div>').join('')+'</div></div><div id="btimer" style="margin-top:8px"></div><details class="mini" style="margin-top:8px"><summary style="cursor:pointer;color:var(--coffee);font-weight:600">Setup key (keep hidden from tasters)</summary><div style="margin-top:6px">'+(t.cups||[]).map(c=>c.code+' = '+c.s+(c.s===t.odd?' (odd one)':'')).join('<br>')+'</div><button type="button" class="btn small" id="newCodes" style="margin-top:6px">New codes</button></details>'+
 '<div class="lst" style="margin-top:8px">'+(t.tasters||[]).map((x,i)=>'<div class="lrow" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto"><input data-ti="'+i+'" data-tf="name" placeholder="Taster" value="'+esc(x.name)+'"><select data-ti="'+i+'" data-tf="pick"><option value="">Picked…</option>'+codes.map(c=>'<option'+(x.pick===c?' selected':'')+'>'+c+'</option>').join('')+'</select><span style="width:20px;text-align:center">'+(x.pick?(x.pick===(t.cups.find(c=>c.s===t.odd)||{}).code?'✓':'✗'):'')+'</span><button type="button" class="x" data-trm="'+i+'" aria-label="Remove taster">×</button></div>').join('')+'</div><button type="button" class="btn small" id="addTaster" style="margin-top:6px">+ Taster</button>'+
 '<div class="calc" style="margin-top:8px">'+(r.n?'<b>'+r.k+' of '+r.n+'</b> found the odd cup. '+(r.p<0.05?'<b>The two coffees taste different</b> (p '+pTxt(r.p)+').':'Not enough to say they differ (p '+pTxt(r.p)+'). Guessing alone gets one in three right.')+(r.n<6?' Six or more tasters give a firmer answer.':''):'Add each taster and the cup they picked.')+'</div>'}
function testBodyHtml(){const t=CUR;if(t.kind==='palate')return palHtml();if(t.kind==='triangle')return testBodyHtmlTri();ensureCodes(t);const L=letters(t);
 if(t.kind==='describe'){const wide=L.length<=2;return '<div id="btimer"></div><div class="lst" style="margin-top:8px">'+DESC.map(([k,l])=>'<div class="step"><div class="mini" style="font-weight:600;color:var(--ink)">'+l+'</div><div class="'+(wide?'grid2':'lst')+'">'+L.map(x=>'<textarea data-tk="d_'+x+'_'+k+'" placeholder="'+x+': '+esc(sampleName(t,x))+'" style="min-height:52px">'+esc(t['d_'+x+'_'+k])+'</textarea>').join('')+'</div></div>').join('')+'<label class="mini" style="display:flex;flex-direction:column;gap:4px">Main difference<input data-tk="main" value="'+esc(t.main)+'" placeholder="B is sweeter with a heavier body"></label></div>'}
 const r=prefResult(t);return '<div class="calc">Serve each coffee in cups marked with its code. Tasters see only the codes. Tap the code each person prefers.<div class="cups">'+L.map(x=>'<div class="cup"><span>'+x+'</span><b>'+t['code'+x]+'</b></div>').join('')+'</div></div><div id="btimer" style="margin-top:8px"></div><div class="grid2" style="margin-top:8px">'+L.map(x=>'<button type="button" class="btn primary" data-vote="'+x+'">Prefers '+t['code'+x]+'</button>').join('')+'</div><div class="row" style="margin-top:8px"><button type="button" class="btn small" data-vote="0">No preference</button><button type="button" class="btn small" id="undoVote"'+((t.votes||[]).length?'':' disabled')+'>Undo last</button></div><div class="calc" style="margin-top:8px">'+(r.n+r.o?L.map((x,i)=>x+' <b>'+r.counts[i]+'</b> ('+Math.round(r.counts[i]/(r.n||1)*100)+'%)').join(' · ')+(r.o?' · no preference '+r.o:'')+'<br>'+(r.n<3*L.length?'Keep going: '+(3*L.length)+' or more votes give a useful answer.':r.p<0.05&&r.lead?'<b>A real preference for '+r.lead+'</b> (p '+pTxt(r.p)+').':'No clear preference yet (p '+pTxt(r.p)+').'):'No votes yet.')+'</div>'}
function tSamplesHtml(){const t=CUR;const L=letters(t);const tri=t.kind==='triangle';return '<div class="lst">'+L.map((x,i)=>'<div class="step"><div class="sh"><span class="mini" style="font-weight:700">'+x+'</span><select data-k="roast'+x+'" aria-label="Sample '+x+' roast">'+roastOptions(t['roast'+x],t['roastLabel'+x])+'</select>'+(!tri&&i===L.length-1&&L.length>2?'<button type="button" class="x" id="rmTSample" aria-label="Remove sample '+x+'">×</button>':'')+'</div>'+(t['roast'+x]?'':'<input data-k="label'+x+'" placeholder="Or name sample '+x+'" value="'+esc(t['label'+x])+'">')+'</div>').join('')+'</div>'+(L.length<6?'<button type="button" class="btn small" id="addTSample" style="margin-top:6px">+ Add sample</button>':'')+(tri?'<div class="mini" style="margin-top:6px">A triangle test compares two coffees. Adding a third switches this to a Preference test.</div>':'')}
function bindTSamples(){const a=$('#addTSample');if(a)a.onclick=()=>{if(CUR.kind==='triangle'){if((CUR.tasters||[]).some(x=>x.pick)&&!confirm('Switch to a Preference test? The triangle picks will not count.'))return;CUR.kind='preference';CUR.n=3;ensureCodes(CUR);rerenderForm();toast('Switched to Preference with 3 samples');return}CUR.n=letters(CUR).length+1;ensureCodes(CUR);rerenderForm()};const r=$('#rmTSample');if(r)r.onclick=()=>{const L=letters(CUR),x=L[L.length-1];if((CUR.votes||[]).includes(x)&&!confirm('Remove sample '+x+' and its votes?'))return;CUR.votes=(CUR.votes||[]).filter(v=>v!==x);['roast','label','roastLabel'].forEach(k=>delete CUR[k+x]);DESC.forEach(([k])=>delete CUR['d_'+x+'_'+k]);CUR.n=L.length-1;rerenderForm()}}
function renderTest(){const box=$('#testBody');if(!box)return;const _ds=detailsState(box);box.innerHTML=testBodyHtml();restoreDetails(box,_ds);renderBT();

 const nc=$('#newCodes');if(nc)nc.onclick=()=>{if((CUR.tasters||[]).some(x=>x.pick)&&!confirm('New codes clear the picks so far. Continue?'))return;newCodes(CUR);(CUR.tasters||[]).forEach(x=>x.pick='');renderTest()};
 box.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{CUR.votes=[...(CUR.votes||[]),b.dataset.vote==='0'?'0':b.dataset.vote];try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}renderTest()});
 const uv=$('#undoVote');if(uv)uv.onclick=()=>{CUR.votes=(CUR.votes||[]).slice(0,-1);renderTest()}
 box.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{const x=CUR.tasters[+b.dataset.pt],k=b.dataset.pk,c=b.dataset.pc;x.rank=x.rank||{};const r=x.rank[k]||[];x.rank[k]=r.includes(c)?r.filter(y=>y!==c):r.length<4?[...r,c]:r;try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}renderTest()});
 box.querySelectorAll('[data-pclr]').forEach(b=>b.onclick=()=>{const x=CUR.tasters[+b.dataset.pclr];if(x.rank)x.rank[b.dataset.pk]=[];renderTest()});

 case 'bhpanel':return '<div class="'+cls+'"><div class="bhp"><div class="bht"><span id="bhClock">0:00</span><span class="mini" id="bhNext"></span><button type="button" class="btn small" id="bhStart">Start</button></div>'+(isBH(CUR)?'<details><summary>How this session runs</summary><p>Use 55 g of coffee per litre of water, ground so most coffees pass 20% extraction by 8 minutes. Pour just off the boil and start the timer. Break the crust at 5:00 with four stirs and skim. At 8:00 draw a small sample from each bowl for TDS. From about 10:00 score the hot pass, then again warm and cool.</p><p>Score each attribute from 7.5 to 10 in steps of 0.1. Anything under 7.5 rules the coffee out. Intensity (0 to 15) for acidity, sweetness and bitterness is recorded but does not change the score. There is no overall score and no defect deduction.</p><p>Method from the <a href="https://www.baristahustle.com/wp-content/uploads/2020/01/Barista-Hustle-Cupping-Protocols-18_01_2020.pdf" target="_blank" rel="noopener">Barista Hustle cupping protocol</a>.</p></details>':isRB(CUR)?'<details><summary>How this session runs</summary><p>Roast samples lighter than for arabica, over 9 to 14 minutes. Robusta cracks quietly: let first crack finish and stop about 10 seconds before second crack. Air cool, rest at least overnight.</p><p>Use 8.75 g of coffee per 150 ml of water, ground a little coarser than for filter, water near 93 °C, at least 5 cups per sample. Leave the crust 3 to 5 minutes, break it with three stirs and skim.</p><p>Each attribute scores 6 to 10 in quarter points. Uniform and clean cups give 2 points per cup. Taints take off 2 per cup, faults 4. 80 and above is Fine Robusta.</p><p>Method from the <a href="https://www.coffeeinstitute.org/" target="_blank" rel="noopener">Coffee Quality Institute</a> Fine Robusta Standards and Protocols.</p></details>':'<details><summary>How this session runs</summary><p>SCA style: about 8.25 g of coffee to 150 ml of water (55 g per litre), water at about 93 °C. Smell the dry grounds, pour, then break the crust at about 4 minutes and skim. Start tasting when cups cool to about 71 °C, roughly 8 to 10 minutes after pouring, and keep scoring as they cool.</p></details>')+'</div></div>';
 case 'btimer':return '<div class="'+cls+'" id="btimer"></div>';
 case 'dialin':return '<div class="'+cls+'" id="dialIn"></div>';
 case 'tsamples':return CUR.kind==='palate'?'':'<div class="'+cls+'"><label>Samples</label>'+tSamplesHtml()+'</div>';
 case 'testbody':return '<div class="'+cls+'"><div id="testBody"></div></div>';
 case 'samples':return '<div class="'+cls+'"><div id="passTabs"></div><div id="viewTabs"></div><div class="lst" id="samples"></div><button type="button" class="btn small" id="addSample" style="margin-top:6px">+ Add sample</button></div>'}return ''}
function rerenderForm(){$('#form').innerHTML=F[CUR_T].map(fieldHtml).join('');bindForm()}
function bindForm(){const form=$('#form');renderTest();bindTSamples();renderBT();renderDial();if($('#bhStart'))bindTimer();form.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{CUR[el.dataset.k]=el.value;if(el.dataset.k==='kind'||/^roast[A-F]$/.test(el.dataset.k)){rerenderForm();return}if(el.dataset.k==='method'&&CUR_T==='brew'&&(!BT.start||BT.stop)){BT.cut=null;renderBT()}if(el.dataset.k==='protocol'){if(isBH(CUR)&&!num(CUR.bowlWater))CUR.bowlWater='180';rerenderForm();return}if(el.dataset.k==='cups'||el.dataset.k==='at'){if($('#samples'))renderSamples()}refreshCalcs();if(CUR_T==='brew'&&el.dataset.k!=='nextTime')renderDial()}));if($('#samples')){renderSamples();$('#addSample').onclick=()=>{CUR.samples=[...(CUR.samples||[]),{}];renderSamples(true)}}}
let TICK=null,PASS='h',LASTEL=-1;
const SCA_STEPS=[[240,'Break the crust, then skim'],[480,'Start tasting as cups reach about 71 °C'],[900,'Keep scoring as the cups cool']];
function cupSteps(){return isBH(CUR)?BH_STEPS:isRB(CUR)?RB_STEPS:SCA_STEPS}
const RB_STEPS=[[240,'Break the crust: three stirs, then skim'],[480,'Taste near 70 °C: flavour and aftertaste'],[720,'As it cools: salt/acid, bitter/sweet, mouthfeel'],[1200,'Near room temperature: balance, uniform and clean cups']];
const BH_STEPS=[[300,'Break the crust: four stirs, then skim'],[480,'Draw a sample from each bowl for TDS'],[600,'Hot pass: score with cups near 65°C']];
function fmtClock(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function bindTimer(){$('#bhStart').onclick=()=>{if(CUR.timerStart){if(!confirm('Reset the session timer?'))return;CUR.timerStart=null}else CUR.timerStart=Date.now();LASTEL=-1;tick(true)};LASTEL=-1;tick(true);clearInterval(TICK);TICK=setInterval(()=>tick(false),1000)}
function tick(init){const clock=$('#bhClock');if(!clock){clearInterval(TICK);TICK=null;return}const st=CUR.timerStart;const el=st?(Date.now()-st)/1000:0;const done=el>5400;clock.textContent=done?'Done':fmtClock(el);$('#bhStart').textContent=st?'Reset':'Start';
 const next=cupSteps().find(([t])=>el<t);$('#bhNext').textContent=!st?'Pour every bowl, then tap Start':done?'Session timer finished':next?'At '+fmtClock(next[0])+': '+next[1]:(isBH(CUR)?'Warm pass near 55°C, cool pass near 45°C':'Score as cups cool. Finish by about 21 °C');
 if(!init&&st&&LASTEL>=0)cupSteps().forEach(([t,l])=>{if(LASTEL<t&&el>=t){toast(l);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}if(isBH(CUR)&&t===600&&PASS!=='h'){PASS='h';renderSamples()}}});LASTEL=el}
function renderPassTabs(){const el=$('#passTabs');if(!el)return;if(!isBH(CUR)){el.innerHTML='';el.hidden=true;return}el.hidden=false;const prev=PASS==='w'?'h':PASS==='c'?'w':null;
 el.innerHTML='<div class="tabs">'+PASSES.map(([p,l,t])=>'<button type="button" class="'+(PASS===p?'on':'')+'" data-pass="'+p+'">'+l+' <span style="font-weight:400">'+t+'</span></button>').join('')+'</div>'+(prev&&(CUR.samples||[]).length?'<button type="button" class="btn small" id="copyPrev">Fill blanks from '+PASSES.find(x=>x[0]===prev)[1].toLowerCase()+' pass</button>':'');
 el.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>{PASS=b.dataset.pass;renderSamples()});
 const cp=$('#copyPrev');if(cp)cp.onclick=()=>{let n=0;const keys=[...BH.map(([k])=>k),...BH_INT.map(k=>'i_'+k)];(CUR.samples||[]).forEach(s=>keys.forEach(k=>{const a=s[PASS+'_'+k],b=s[prev+'_'+k];if((a==null||a==='')&&b!=null&&b!==''){s[PASS+'_'+k]=b;n++}}));renderSamples();toast(n?'Filled '+n+' scores':'Nothing to fill')}}
function bhSampleHtml(s,i){const f=(k,l,max,ph,step)=>{const v=s[k];const low=max===10&&num(v)!=null&&num(v)<7.5;return '<label class="mini bhf'+(low?' low':'')+'">'+l+'<input type="number" inputmode="decimal" step="'+(step||'0.1')+'" min="0" max="'+max+'" placeholder="'+ph+'" data-si="'+i+'" data-sk="'+k+'" value="'+esc(v)+'"></label>'};const p=PASS;const q=k=>f(p+'_'+k,BH.find(x=>x[0]===k)[1],10,'7.5-10');
 return '<div class="mini">'+PASSES.find(x=>x[0]===p).slice(1).join(' pass, about ')+'</div>'+
 '<div class="grp">Smell</div><div class="g3">'+q('aroma')+q('flavor')+q('aftertaste')+'</div>'+
 '<div class="grp">Taste</div><div class="g3">'+q('acidity')+q('sweetness')+q('bitterness')+'</div><div class="g3">'+BH_INT.map(k=>f(p+'_i_'+k,'Intensity',15,'0-15','0.5')).join('')+'</div>'+
 '<div class="grp">Feel</div><div class="g3">'+q('weight')+q('texture')+q('afterfeel')+'</div>'+
 '<div class="grp">Balance and strength</div><div class="g3">'+q('balance')+f('tds','TDS %',5,'1.40','0.01')+'<span></span></div>'}
function sampleCalcHtml(s,c){const sc=sampleScore(s,c);if(isRB(c))return sc==null?'':'Score <b>'+r2(sc)+'</b> · '+rbClass(sc);if(!isBH(c))return sc==null?'':'Score <b>'+r2(sc)+'</b>';
 const a=bhAttrs(s);const out=[];const passes=PASSES.filter(([p])=>bhPassDone(s,p)).map(x=>x[1].toLowerCase());
 if(sc!=null)out.push('Score <b>'+r1(sc)+'</b> of 100'+(passes.length?' · '+passes.join(', ')+' pass'+(passes.length>1?'es':''):''));
 const g=['Smell','Taste','Feel','Balance'].map(n=>{const ks=BH.filter(x=>x[2]===n);if(ks.some(([k])=>a[k]==null))return '';return n+' '+r1(ks.reduce((x,[k])=>x+a[k],0))}).filter(Boolean);if(g.length)out.push(g.join(' · '));
 const it=BH_INT.map(k=>{const v=bhInt(s,k);return v==null?'':k+' '+r1(v)}).filter(Boolean);if(it.length)out.push('Intensity: '+it.join(', '));
 const ey=cupEY(s,c);if(num(s.tds))out.push('TDS '+s.tds+'%'+(ey?' · extraction about <b>'+r1(ey)+'%</b>':''));
 const low=bhLow(s);if(low.length)out.push('<span class="dq">Under 7.5: '+esc(low.join(', '))+'. This coffee is ruled out.</span>');
 return out.join('<br>')}
function refreshCalcs(){F[CUR_T].filter(f=>f.t==='calc').forEach(f=>{const el=document.querySelector('[data-calc="'+f.k+'"]');if(!el)return;const h=f.fn(CUR);const _ds=detailsState(el);el.innerHTML=h;restoreDetails(el,_ds);el.hidden=!h})}
function cupView(){try{return localStorage.getItem('kk_cup_view')||'guided'}catch(e){return 'guided'}}
function renderViewTabs(){const el=$('#viewTabs');if(!el)return;const show=!isBH(CUR)&&(CUR.protocol||'SCA')!=='Simple';el.hidden=!show;if(!show){el.innerHTML='';return}const v=cupView();el.innerHTML='<div class="tabs" style="grid-template-columns:1fr 1fr;position:static;margin:4px 0 8px"><button type="button" data-view="guided" class="'+(v==='guided'?'on':'')+'">Guided</button><button type="button" data-view="full" class="'+(v==='full'?'on':'')+'">Full form</button></div><div class="mini" style="margin:-2px 0 8px">'+(v==='guided'?'Step by step, with words for each score. Switch any time; scores carry over.':'Every field at once, with intensity scales.')+'</div>';el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{try{localStorage.setItem('kk_cup_view',b.dataset.view)}catch(e){}renderSamples()})}
function guidedHtml(s,i,cups){const W=isRB(CUR)?WORDS_RB:WORDS_SCA,ST=isRB(CUR)?STEP_RB:STEP_SCA,L=Object.fromEntries(scoreAttrs(CUR));
 const row=k=>{const v=num(s[k]);const word=v==null?'':(W.slice().reverse().find(([x])=>v>=x)||[0,'Below good'])[1];return '<div class="gq"><div class="gqh"><b>'+L[k]+'</b><span class="gqv">'+(v==null?'–':r2(v))+(word?' <small>'+word+'</small>':'')+'</span></div><div class="mini">'+GUIDE[k]+'</div><div class="gqc">'+W.map(([x,w])=>'<button type="button" class="chip'+(v!=null&&Math.floor(v)===x?' on':'')+'" data-gs="'+i+'" data-gk="'+k+'" data-gv="'+x+'">'+w+'</button>').join('')+'<button type="button" class="chip pm" data-gs="'+i+'" data-gk="'+k+'" data-gd="-0.25" aria-label="Lower by a quarter">−</button><button type="button" class="chip pm" data-gs="'+i+'" data-gk="'+k+'" data-gd="0.25" aria-label="Raise by a quarter">+</button></div></div>'};
 const cupN=(k,l,ph)=>'<label class="mini" style="display:flex;flex-direction:column;justify-content:flex-end;gap:3px">'+l+'<input type="number" inputmode="numeric" step="1" min="0" max="'+cups+'" placeholder="'+(ph??cups)+'" data-si="'+i+'" data-sk="'+k+'" value="'+esc(s[k])+'"></label>';
 return ST.map(([ks,h,t])=>'<div class="grp">'+h+'</div><div class="mini" style="margin-top:-4px">'+t+'</div>'+ks.map(row).join('')).join('')+
 '<div class="grp">Cups</div><div class="mini" style="margin-top:-4px">Of the '+cups+' cups. Leave blank if all were fine.</div><div class="grid2">'+cupN('uniform','Tasted the same as the others')+cupN('clean','Had no off taste')+(isRB(CUR)?'':cupN('sweet','Tasted sweet'))+'</div>'+
 '<div class="grid2">'+cupN('taints','Light off note (−2 each)','0')+cupN('faults','Strong off taste (−4 each)','0')+'</div>'+(isRB(CUR)?notesHtml(s,i):'')}
function fullHtml(s,i,cups,n){const rb=isRB(CUR);return '<div class="grid2">'+scoreAttrs(CUR).map(([k,l])=>n(k,l+' (6 to 10)','0.25',6,10)).join('')+'</div>'+(rb?'<details class="mini"><summary>Intensity scales, 1 to 6 (recorded, not scored)</summary><div class="grid2" style="margin-top:6px">'+RB_INT.map(([k,l])=>n(k,l,'1',1,6)).join('')+'</div></details>':'')+'<div class="mini">Cups out of '+cups+' (blank = all)</div><div class="grid2" style="grid-template-columns:repeat('+cupsAttrs(CUR).length+',minmax(0,1fr))">'+cupsAttrs(CUR).map(([k,l])=>n(k,l,'1',0,cups)).join('')+'</div><div class="grid2">'+n('taints','Taints (cups, −2)','1',0,cups)+n('faults','Faults (cups, −4)','1',0,cups)+'</div>'+(rb?notesHtml(s,i):'')}
function notesHtml(s,i){const cur=String(s.descriptors||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);const c=(x,off)=>'<button type="button" class="chip'+(off?' off':'')+(cur.includes(x.toLowerCase())?' on':'')+'" data-ns="'+i+'" data-nv="'+esc(x)+'">'+esc(x)+'</button>';return '<details class="mini"><summary>Robusta flavour notes</summary><div class="mini" style="margin:6px 0 4px">Found in fine robusta</div><div class="gqc">'+RB_NOTES.fine.map(x=>c(x)).join('')+'</div><div class="mini" style="margin:8px 0 4px">Found in off-grade robusta</div><div class="gqc">'+RB_NOTES.off.map(x=>c(x,1)).join('')+'</div><div class="mini" style="margin-top:6px">Notes listed in the CQI Fine Robusta Standards. Tap to add to descriptors.</div></details>'}
function offHtml(s,i){const picked=String(s.off||'').split('|').filter(Boolean);const hits=[];OFF.forEach(([ph,href,list])=>list.forEach(([n,why])=>{if(picked.includes(n))hits.push([n,why,ph,href])}));
 return '<details class="mini offf"'+(picked.length?' open':'')+'><summary>Off flavour? Find the likely cause</summary>'+OFF.map(([ph,href,list])=>'<div class="mini" style="margin:8px 0 4px">'+ph+'</div><div class="gqc">'+list.map(([n])=>'<button type="button" class="chip off'+(picked.includes(n)?' on':'')+'" data-os="'+i+'" data-ov="'+esc(n)+'">'+n+'</button>').join('')+'</div>').join('')+
 (hits.length?'<div class="calc" style="margin-top:8px">'+hits.map(([n,why,ph,href])=>'<b>'+n+'</b>: '+why+'.'+(href?' <a style="color:var(--coffee)" href="'+href+'">Check '+(href==='origin.html'?'Origin':href==='roasts.html'?'Roastbook':'Water')+'</a>':'')).join('<br>')+'<div style="margin-top:6px">Light and mostly in the smell: count it as a taint. Strong in the taste: a fault.</div></div>':'')+
 '<div class="mini" style="margin-top:6px">Causes after Ted Lingle, The Coffee Cupper\'s Handbook (SCAA).</div></details>'}
function bindGuided(box){box.querySelectorAll('[data-gk]').forEach(b=>b.onclick=()=>{const s=CUR.samples[+b.dataset.gs],k=b.dataset.gk;let v=b.dataset.gv!=null?+b.dataset.gv:(num(s[k])??7)+(+b.dataset.gd);v=Math.max(6,Math.min(10,Math.round(v*4)/4));s[k]=String(v);renderSamples()});
 box.querySelectorAll('[data-nv]').forEach(b=>b.onclick=()=>{const s=CUR.samples[+b.dataset.ns],x=b.dataset.nv;let a=String(s.descriptors||'').split(',').map(y=>y.trim()).filter(Boolean);const j=a.findIndex(y=>y.toLowerCase()===x.toLowerCase());if(j>=0)a.splice(j,1);else a.push(x);s.descriptors=a.join(', ');renderSamples()});
 box.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{const s=CUR.samples[+b.dataset.os],x=b.dataset.ov;let a=String(s.off||'').split('|').filter(Boolean);a=a.includes(x)?a.filter(y=>y!==x):[...a,x];s.off=a.join('|');renderSamples()})}
function renderSamples(focus){renderPassTabs();renderViewTabs();const _ds=detailsState($('#samples'));const box=$('#samples');const ss=CUR.samples||[];const simple=(CUR.protocol||'SCA')==='Simple';const cups=num(CUR.cups)||5;
 box.innerHTML=ss.length?ss.map((s,i)=>{const sc=sampleScore(s,CUR);const rd0=restDays(s.roastId,CUR.at);const rd=rd0!=null?rd0:s.restDays;const n=(k,l,step,min,max)=>'<label class="mini" style="display:flex;flex-direction:column;gap:3px">'+l+'<input type="number" inputmode="decimal" step="'+step+'" min="'+min+'" max="'+max+'" data-si="'+i+'" data-sk="'+k+'" value="'+esc(s[k])+'"></label>';
  return '<div class="step"><div class="sh"><span class="mini">'+String.fromCharCode(65+i)+'</span><select data-si="'+i+'" data-sk="roastId" aria-label="Roast">'+roastOptions(s.roastId,s.roastLabel)+'</select><button type="button" class="x" data-rm="'+i+'" aria-label="Remove sample">×</button></div>'+(s.roastId?'':'<input data-si="'+i+'" data-sk="label" placeholder="Or name the sample" value="'+esc(s.label)+'">')+'<div class="mini">'+esc(restText(rd))+'</div>'+
  (simple?'<div class="grid2">'+n('score','Score','0.25',0,100)+'</div>':isBH(CUR)?bhSampleHtml(s,i):cupView()==='guided'?guidedHtml(s,i,cups):fullHtml(s,i,cups,n))+offHtml(s,i)+
  '<button type="button" class="btn small pickn" onclick="openNotes(this.nextElementSibling)">Pick flavour notes</button><input data-si="'+i+'" data-sk="descriptors" placeholder="Descriptors" value="'+esc(s.descriptors)+'"><textarea data-si="'+i+'" data-sk="notes" placeholder="Notes" style="min-height:52px">'+esc(s.notes)+'</textarea><div class="calc" data-scal="'+i+'"'+(sampleCalcHtml(s,CUR)?'':' hidden')+'>'+sampleCalcHtml(s,CUR)+'</div></div>'}).join(''):'<div class="empty">Add one sample per roast on the table.</div>';
 box.querySelectorAll('[data-si]').forEach(el=>el.addEventListener('input',()=>{const s=CUR.samples[+el.dataset.si];s[el.dataset.sk]=el.value;if(el.dataset.sk==='roastId'){renderSamples();return}const lb=el.closest('.bhf');if(lb&&el.max==='10'){const v=num(el.value);lb.classList.toggle('low',v!=null&&v<7.5)}const c=document.querySelector('[data-scal="'+el.dataset.si+'"]');const h=sampleCalcHtml(s,CUR);if(c){c.hidden=!h;c.innerHTML=h}}));
 box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(!confirm('Remove this sample?'))return;CUR.samples.splice(+b.dataset.rm,1);renderSamples()});restoreDetails(box,_ds);bindGuided(box);
 if(focus)box.lastElementChild?.scrollIntoView({behavior:'smooth',block:'center'})}
async function save(){const miss=F[CUR_T].filter(f=>f.req&&(CUR[f.k]==null||String(CUR[f.k]).trim()===''));if(miss.length){toast('Fill in: '+miss.map(f=>f.l).join(', '));return}
 if(CUR_T==='brew'&&!CUR.roastId&&!String(CUR.coffee||'').trim()){toast('Choose a roast or name the coffee');return}
 if(CUR_T==='brew'){const r=roastById(CUR.roastId);if(r){CUR.roastLabel=roastLabel(r);CUR.restDays=restDays(CUR.roastId,CUR.brewedAt)}else if(!CUR.roastId){CUR.roastLabel='';CUR.restDays=null}}

 if($('#alsoCloud')&&$('#alsoCloud').checked)CUR.cloud=true;await ORIGIN.put(CUR);toast('Saved');go(CUR_T)}
