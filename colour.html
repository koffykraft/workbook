<script>
const $ = s => document.querySelector(s);
const K = window.KKCOLOUR;
function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('on'), 2200);
}
const today = () => new Date().toISOString().slice(0, 10);
const fmtDay = d => {
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString(undefined, {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });
  } catch (e) {
    return d;
  }
};
const KINDS = ['My roast', 'Bought coffee', 'Sample roast', 'Other'];
const getRef = () => {
  try {
    return localStorage.getItem('kk_colour_ref') || '';
  } catch (e) {
    return '';
  }
};
const setRef = v => {
  try {
    v ? localStorage.setItem('kk_colour_ref', v) : localStorage.removeItem('kk_colour_ref');
  } catch (e) {}
};

// The Agtron Gourmet number for naming and comparing: ground first, then whole bean.
const meterOf = r => r.meter || (r.scale === 'commercial' ? 'agtron-c' : 'agtron-g');
const meterInfo = r => K.METERS[meterOf(r)] || K.METERS.other;
// Pairs from your own readings (this meter's number and the Agtron Gourmet of the same sample)
// teach KoffyKraft a meter that has no published conversion.
// the other numbers a multi-scale meter shows next to Agtron Gourmet (as on many colorimeter screens)
const EXTRA = { colortrack: 'xColortrack', colorette: 'xColorette', neotec: 'xNeotec' };
function learned(meter, exceptId) {
  const pts = ALL.filter(
    r => r.id !== exceptId && meterOf(r) === meter && num(r.mGround) != null && num(r.agKnown) != null
  ).map(r => [+r.mGround, +r.agKnown]);
  const x = EXTRA[meter];
  if (x)
    ALL.forEach(r => {
      if (r.id === exceptId || num(r[x]) == null) return;
      const g = num(r.agKnown) ?? (meterInfo(r).toG ? convG(r, num(r.mGround)) : null);
      if (g != null) pts.push([+r[x], g]);
    });
  return K.calib2(pts);
}
function convG(r, v) {
  if (v == null) return null;
  const M = meterInfo(r);
  if (M.toG) return M.toG(v);
  const C = learned(meterOf(r), r.id);
  return C.k != null ? C.c0 + C.k * v : null;
}
// Agtron Gourmet of the ground sample (or whole bean when that is all there is).
function gourmet(r) {
  if (!r.meter) {
    const v = num(r.agGround) ?? num(r.agWhole);
    return v == null ? null : r.scale === 'commercial' ? K.toGourmet(v) : v;
  }
  if (num(r.agKnown) != null) return +r.agKnown;
  return convG(r, num(r.mGround)) ?? convG(r, num(r.mWhole));
}
function gourmetPair(r) {
  if (!r.meter) {
    const f = v => (v == null ? null : r.scale === 'commercial' ? K.toGourmet(v) : v);
    return [f(num(r.agGround)), f(num(r.agWhole))];
  }
  return [num(r.agKnown) ?? convG(r, num(r.mGround)), convG(r, num(r.mWhole))];
}
// CIELAB for comparing: the meter's own if given, else the photo's.
function labOf(r, src) {
  if ((src || 'meter') === 'meter' && num(r.L) != null && num(r.a) != null && num(r.b) != null) {
    const x = K.toCielab(+r.L, +r.a, +r.b, r.space);
    return {
      ...x,
      C: Math.hypot(x.a, x.b),
      h: ((Math.atan2(x.b, x.a) * 180) / Math.PI + 360) % 360,
      src: 'meter',
    };
  }
  if ((src || 'photo') === 'photo' && r.photo) return { ...r.photo, src: 'photo' };
  return null;
}
// Ground roasted arabica follows one colour path as it darkens: a* and b* from L* (Scientific
// Reports 2025, HunterLab ColorFlex, D65 2°, L* about 20 to 60). Shows what this L* usually pairs
// with; a photo far off the path points to the light or white card, a meter off it to its own setup.
// A ballpark readout from L* alone (a phone photo, or a meter's L*a*b*), for when there is no
// Agtron meter. There is no published conversion from CIELAB to Agtron, so KoffyKraft uses its own
// starting curve, tied to two measured points and one meter reading:
//   second crack, median L* 20.0, and first crack, median L* 29.7 (UC Davis, Scientific Reports
//   2025), placed at Agtron Gourmet 45 and 80, where roast colour charts put those stages;
//   L* 32.7 at Gourmet 86 from a KoffyKraft colorimeter (D65/10°).
// Your own readings with both numbers move it: one or two shift the curve, three or more replace it.
const START = [
  [14, 22],
  [17.2, 32],
  [20.0, 45],
  [29.7, 80],
  [32.7, 86],
  [40, 96],
  [50, 104],
];
function startCurve(L) {
  if (L <= START[0][0]) return START[0][1];
  for (let i = 1; i < START.length; i++)
    if (L <= START[i][0]) {
      const [x0, y0] = START[i - 1],
        [x1, y1] = START[i];
      return y0 + ((L - x0) * (y1 - y0)) / (x1 - x0);
    }
  return START[START.length - 1][1];
}
function pairsFor(kind, exceptId) {
  return ALL.filter(r => r.id !== exceptId)
    .map(r => {
      const g = gourmet(r);
      if (g == null || g < 15 || g > 130) return null;
      if (kind === 'photo') return r.photo ? [r.photo.L, g] : null;
      return num(r.L) != null && r.space !== 'hunter' ? [+r.L, g] : null;
    })
    .filter(Boolean);
}
function ballpark(L, kind, exceptId) {
  const P = pairsFor(kind, exceptId);
  if (P.length >= 3) {
    const C = K.calib2(P);
    if (C.k != null)
      return {
        g: C.c0 + C.k * L,
        pm: Math.max(3, Math.round(C.res * 2)),
        level: 'good',
        how:
          'learned from ' +
          C.n +
          ' of your readings that have both, so it fits your ' +
          (kind === 'photo' ? 'phone and light' : 'meter'),
      };
  }
  const base = startCurve(L);
  if (P.length) {
    const off = P.reduce((a, [x, y]) => a + (y - startCurve(x)), 0) / P.length;
    return {
      g: base + off,
      pm: 8,
      level: 'fair',
      how:
        'starting curve, shifted by ' + P.length + ' of your readings with both (3 or more make it your own)',
    };
  }
  return {
    g: base,
    pm: kind === 'photo' ? 15 : 10,
    level: 'low',
    how: 'KoffyKraft starting curve only',
  };
}
// Colorette from two reference points: Gourmet 63 = Colorette 96 (Lighttells SCAA sheet) and
// Gourmet 86 = Colorette 125 (a KoffyKraft colorimeter). Rough, shown only when not learned.
const coloretteRough = g => 96 + ((g - 63) * (125 - 96)) / (86 - 63);
function readoutHtml(L, kind, c, all) {
  const B = ballpark(L, kind, c.id);
  const g = Math.max(15, Math.min(110, B.g));
  const nm = K.roastName(g);
  const pos = Math.max(0, Math.min(100, ((L - 15) / (62 - 15)) * 100));
  const conf = { low: 'Low confidence', fair: 'Fair confidence', good: 'Good confidence' }[B.level];
  const mine = kind === 'photo' ? all.filter(r => r.photo && r.photo.L != null) : [];
  let rank = '';
  if (mine.length) {
    const darker = mine.filter(r => r.photo.L < L).length;
    rank =
      '<div class="mini" style="margin-top:6px">Among your ' +
      (mine.length + 1) +
      ' photo readings this is number <b>' +
      (mine.length - darker + 1) +
      '</b> from the lightest. Nearest: ' +
      mine
        .slice()
        .sort((p, q) => Math.abs(p.photo.L - L) - Math.abs(q.photo.L - L))
        .slice(0, 2)
        .map(r => esc(r.name || fmtDay(r.at)) + ' (L* ' + r.photo.L.toFixed(1) + ')')
        .join(', ') +
      '.</div>';
  }
  const rows = [
    ['Agtron Gourmet', '~' + Math.round(g) + ' (±' + B.pm + ')'],
    ['Agtron Commercial', '~' + Math.round(K.toCommercial(g))],
    ['SCA tile, nearest', '#' + K.METERS['sca-tile'].fromG(g)],
  ];
  const t = K.METERS.tonino.fromG(g);
  if (t != null) rows.push(['Tonino', '~' + Math.round(t)]);
  const Cc = learned('colorette', c.id);
  rows.push([
    'Probat Colorette',
    '~' + Math.round(Cc.k ? (g - Cc.c0) / Cc.k : coloretteRough(g)) + (Cc.k ? '' : ' (rough)'),
  ]);
  const Ct = learned('colortrack', c.id);
  if (Ct.k) rows.push(['ColorTrack', '~' + Math.round((g - Ct.c0) / Ct.k)]);
  return (
    '<div class="cc-box"><div class="mini" style="text-transform:uppercase;letter-spacing:.08em">Ballpark from ' +
    (kind === 'photo' ? 'your photo' : 'the meter L*') +
    '</div><div style="font-size:22px;font-weight:700;margin:2px 0">' +
    esc(nm ? nm[0] : 'Outside the chart') +
    ' <span style="font-weight:400;font-size:16px">· Agtron ~' +
    Math.round(g) +
    '</span></div>' +
    '<div style="position:relative;height:14px;border-radius:7px;margin:10px 0 2px;background:linear-gradient(90deg,#24170f,#3d281b,#5c3b25,#7d5233,#a06e45,#c99a6a,#e0c39a)"><span style="position:absolute;left:calc(' +
    pos.toFixed(0) +
    '% - 7px);top:-4px;width:14px;height:22px;border-radius:4px;background:#fff;border:2px solid #111"></span></div>' +
    '<div class="mini" style="position:relative;height:16px">' +
    [
      [0, 'dark', 'left:0'],
      [((20 - 15) / 47) * 100, '2nd crack', ''],
      [((29.7 - 15) / 47) * 100, '1st crack', ''],
      [100, 'light', 'right:0'],
    ]
      .map(
        ([x, tx, edge]) =>
          '<span style="position:absolute;' +
          (edge || 'left:' + x.toFixed(0) + '%;transform:translateX(-50%)') +
          '">' +
          tx +
          '</span>'
      )
      .join('') +
    '</div>' +
    '<div class="kv" style="margin-top:10px">' +
    rows.map(x => '<span>' + esc(x[0]) + '</span><div>' + esc(x[1]) + '</div>').join('') +
    '</div>' +
    rank +
    '<div class="mini" style="margin-top:8px;font-size:11px;line-height:1.45;color:#7a7368"><b>' +
    conf +
    '.</b> ' +
    esc(B.how) +
    '. L* ' +
    L.toFixed(1) +
    '; ' +
    stage(L) +
    ' A phone sees colour while Agtron and Colorette read near-infrared, and phones, light and grind all move the number, so treat these as a ballpark, not a meter reading. Take every photo the same way (same dish, white card, spot, no flash) and they compare well with each other. Add the meter number to any reading when you can and the readout tightens. Crack points: <a href="https://www.nature.com/articles/s41598-025-06601-w" target="_blank" rel="noopener">UC Davis, Scientific Reports 2025</a>.</div></div>'
  );
}
// where an L* falls between the roast milestones the same study measured (median L* of samples
// pulled at that moment: colour change 62.4, first crack 29.7, second crack 20.0, end 17.2)
function stage(L) {
  const M = [
    [62.4, 'colour change'],
    [29.7, 'first crack'],
    [20.0, 'second crack'],
    [17.2, 'the darkest roasts in the study'],
  ];
  if (L >= 62.4) return 'Lighter than the colour change point.';
  for (let i = 1; i < M.length; i++)
    if (L >= M[i][0])
      return Math.abs(L - M[i][0]) <= 2
        ? 'About the colour at ' + M[i][1] + ' (L* ' + M[i][0] + ').'
        : 'Between ' + M[i - 1][1] + ' (L* ' + M[i - 1][0] + ') and ' + M[i][1] + ' (L* ' + M[i][0] + ').';
  return 'Darker than the darkest roasts in the study.';
}
function curveHtml(lab) {
  if (!lab || lab.L < 18 || lab.L > 62) return '';
  const L = lab.L,
    ea = -14.498 + 1.341 * L - 0.015 * L * L,
    eb = -30.221 + 2.244 * L - 0.02 * L * L,
    d = Math.hypot(lab.a - ea, lab.b - eb);
  return (
    '<div class="mini" style="margin-top:6px">Roasted arabica at L* ' +
    L.toFixed(1) +
    ' usually reads about a* ' +
    ea.toFixed(1) +
    ', b* ' +
    eb.toFixed(1) +
    ' (one colour path for all origins and profiles tested). This reading is ' +
    d.toFixed(1) +
    ' away' +
    (d <= 2
      ? ', on the path.'
      : lab.src === 'photo'
        ? ': for a photo, check the light and that the white card was tapped.'
        : ': meters differ in light and viewing angle (2° or 10°), and robusta or very old beans sit off this path.') +
    ' ' +
    stage(L) +
    ' Source: <a href="https://www.nature.com/articles/s41598-025-06601-w" target="_blank" rel="noopener">A universal color curve for roasted arabica coffee</a>, Scientific Reports 2025 (corrected October 2025).</div>'
  );
}
// the same roast on the other scales; approx for estimates from a photo or from L*
function scalesHtml(g, approx, c) {
  const rows = [
    ['Agtron Gourmet', r1(g)],
    ['Agtron Commercial', r1(K.toCommercial(g))],
    ['SCA tile, nearest', '#' + K.METERS['sca-tile'].fromG(g)],
  ];
  const t = K.METERS.tonino.fromG(g);
  if (t != null) rows.push(['Tonino, about', Math.round(t)]);
  const typed = { colortrack: c && c.xColortrack, colorette: c && c.xColorette };
  for (const k of ['colortrack', 'colorette', 'neotec', 'other']) {
    if (typed[k] != null) {
      rows.push([K.METERS[k].name + ', from your meter', typed[k]]);
      continue;
    }
    const C = learned(k, c && c.id);
    if (C.k != null && C.k) rows.push(['Your ' + K.METERS[k].name + ', about', Math.round((g - C.c0) / C.k)]);
    else if (k === 'colortrack' || k === 'colorette')
      rows.push([K.METERS[k].name, 'add 3 readings from your meter']);
  }
  return (
    '<div class="cc-box"><b>On other scales' +
    (approx ? ' (estimate)' : '') +
    '</b><div class="kv" style="margin-top:6px">' +
    rows.map(x => '<span>' + esc(x[0]) + '</span><div>' + esc(String(x[1])) + '</div>').join('') +
    '</div><div class="mini" style="margin-top:6px">Commercial from the Agtron E20CP manual; Tonino from its published table; tiles are numbered on the Gourmet scale. ColorTrack and Colorette have no published conversion, so they are learned from readings where you typed them from your meter. Meters differ by a point or two even when calibrated, and grind size moves readings: compare like with like.</div></div>'
  );
}
function namesHtml(g) {
  if (g == null) return '';
  const cur = K.scheme();
  const one = k => {
    const n = K.roastName(g, k);
    return n ? n[0] + (n[1] ? ' (' + n[1] + ')' : '') : 'outside the chart';
  };
  return (
    '<div class="res">Agtron Gourmet <b>' +
    r1(g) +
    '</b>: <b>' +
    esc(K.roastName(g, cur) ? K.roastName(g, cur)[0] : 'outside the chart') +
    '</b> on the ' +
    esc(K.SCHEMES[cur]) +
    '.</div>' +
    '<div class="mini" style="margin-top:4px">' +
    Object.keys(K.SCHEMES)
      .filter(k => k !== cur)
      .map(k => esc(K.SCHEMES[k]) + ': ' + esc(one(k)))
      .join(' · ') +
    '. Names vary between roasters; the number is what to compare.</div>'
  );
}

let ALL = [];
async function loadAll() {
  ALL = (await ORIGIN.all('colour')).sort(
    (a, b) =>
      String(b.at || '').localeCompare(String(a.at || '')) ||
      String(b.updatedAt).localeCompare(String(a.updatedAt))
  );
}

async function route() {
  await loadAll();
  const h = location.hash.slice(1);
  const m = h.match(/^edit\/(.+)$/);
  if (h === 'new') return editView(null);
  if (m) return editView(ALL.find(r => r.id === decodeURIComponent(m[1])) || null);
  listView();
}
window.addEventListener('hashchange', route);

// ---------- list ----------
let FILTER = '';
function listView() {
  const ref = getRef();
  const rows = ALL.filter(r => !FILTER || r.kind === FILTER);
  let h =
    '<h1>Colour check</h1><div class="sub">Record roast colour for any coffee: your own roasts, coffee you bought, or sample roasts. From a colour meter or a phone photo with a white card. Compare readings, name the roast level, and see how far apart two coffees are. <a href="methods.html#p-colour">How to take a reliable reading</a></div>';
  h +=
    '<div class="row"><a class="btn primary" href="#new">+ New reading</a><label class="l" style="flex:1;min-width:180px">Roast names from<select id="scheme">' +
    Object.entries(K.SCHEMES)
      .map(
        ([k, v]) =>
          '<option value="' + k + '"' + (k === K.scheme() ? ' selected' : '') + '>' + esc(v) + '</option>'
      )
      .join('') +
    '</select></label></div>';
  if (ALL.length)
    h +=
      '<div class="chips" style="margin-top:12px"><button data-f=""' +
      (!FILTER ? ' class="on"' : '') +
      '>All</button>' +
      KINDS.map(
        k =>
          '<button data-f="' + esc(k) + '"' + (FILTER === k ? ' class="on"' : '') + '>' + esc(k) + '</button>'
      ).join('') +
      '</div>';
  h += '<h2>Readings</h2>';
  h += rows.length
    ? rows
        .map(r => {
          const g = gourmet(r),
            n = g != null ? K.roastName(g) : null;
          const sw = r.photo
            ? '<span class="sw" style="background:rgb(' + r.photo.rgb.join(',') + ')"></span>'
            : '<span class="sw">' + (g != null ? '<b>' + Math.round(g) + '</b>' : '') + '</span>';
          return (
            '<a class="card" href="#edit/' +
            encodeURIComponent(r.id) +
            '">' +
            sw +
            '<span style="flex:1;min-width:0"><b>' +
            esc(r.name || 'Reading') +
            '</b>' +
            (r.id === ref ? ' <span class="mini">(reference)</span>' : '') +
            '<div class="mini">' +
            esc(
              [
                g != null ? 'Agtron ' + r1(g) + (n ? ', ' + n[0] : '') : r.photo ? 'Photo reading' : '',
                r.kind,
                r.at ? fmtDay(r.at) : '',
              ]
                .filter(Boolean)
                .join(' · ')
            ) +
            '</div></span></a>'
          );
        })
        .join('')
    : '<div class="card mini">' +
      (ALL.length
        ? 'No readings of this kind.'
        : 'No readings yet. Tap New reading: enter a meter number, or measure from a photo of ground coffee next to a white card.') +
      '</div>';
  $('#view').innerHTML = h;
  $('#scheme').onchange = e => {
    K.setScheme(e.target.value);
    listView();
  };
  document.querySelectorAll('[data-f]').forEach(
    b =>
      (b.onclick = () => {
        FILTER = b.dataset.f;
        listView();
      })
  );
}

// ---------- one reading ----------
let CUR = null,
  ROASTS = [],
  GREENS = [];
async function editView(ex) {
  CUR = ex
    ? JSON.parse(JSON.stringify(ex))
    : { type: 'colour', at: today(), kind: 'My roast', scale: 'gourmet', form: 'ground' };
  try {
    ROASTS = (await myRoasts())
      .sort((a, b) => String(b.roastDate || '').localeCompare(String(a.roastDate || '')))
      .slice(0, 200);
  } catch (e) {
    ROASTS = [];
  }
  try {
    GREENS = await ORIGIN.all('green');
  } catch (e) {
    GREENS = [];
  }
  draw(!!ex);
}
const roastLabel = r =>
  [r.roastNo ? '#' + r.roastNo : '', r.estate || r.coffeeCode || r.bean || 'Roast', r.roastDate || '']
    .filter(Boolean)
    .join(' · ');
function draw(saved) {
  const c = CUR,
    v = k => esc(c[k] ?? '');
  let h =
    '<a class="back" href="#">‹ Colour check</a><h1>' +
    (saved ? esc(c.name || 'Reading') : 'New reading') +
    '</h1>';
  if (saved) h += '<div id="cloudRow" class="cloudrow">' + cloudRowHtml(c) + '</div>';
  h +=
    '<h2>What you measured</h2><div class="card f">' +
    '<label class="l full">Coffee<input id="fName" value="' +
    v('name') +
    '" placeholder="Lot 12 roast #3, or the bag\'s name"></label>' +
    '<div class="full chips" id="fKind">' +
    KINDS.map(
      k =>
        '<button type="button" data-k="' +
        esc(k) +
        '"' +
        (c.kind === k ? ' class="on"' : '') +
        '>' +
        esc(k) +
        '</button>'
    ).join('') +
    '</div>' +
    '<label class="l">Date<input id="fAt" type="date" value="' +
    v('at') +
    '"></label>' +
    '<label class="l">Roasted on (optional)<input id="fRoasted" type="date" value="' +
    v('roastedOn') +
    '"></label>' +
    (ROASTS.length
      ? '<label class="l full">Link to a roast in your Roastbook (optional)<select id="fRoast"><option value="">None</option>' +
        ROASTS.map(
          r =>
            '<option value="' +
            esc(r.id) +
            '"' +
            (String(c.roastId) === String(r.id) ? ' selected' : '') +
            '>' +
            esc(roastLabel(r)) +
            '</option>'
        ).join('') +
        '</select></label>'
      : '') +
    (GREENS.length
      ? '<label class="l full">Green lot (optional)<select id="fGreen"><option value="">None</option>' +
        GREENS.map(
          g =>
            '<option value="' +
            esc(g.id) +
            '"' +
            (c.greenId === g.id ? ' selected' : '') +
            '>' +
            esc([g.code, g.name].filter(Boolean).join(' · ')) +
            '</option>'
        ).join('') +
        '</select></label>'
      : '') +
    '</div>';
  h +=
    '<h2>Meter reading</h2><div class="card f">' +
    '<label class="l full">Meter<select id="fMeter">' +
    Object.entries(K.METERS)
      .map(
        ([k, m]) =>
          '<option value="' +
          k +
          '"' +
          (meterOf(c) === k ? ' selected' : '') +
          '>' +
          esc(m.name) +
          '</option>'
      )
      .join('') +
    '</select></label>' +
    '<label class="l">Reading, ground<input id="fMG" type="number" inputmode="decimal" step="any" value="' +
    esc(c.mGround ?? c.agGround ?? '') +
    '"></label>' +
    '<label class="l">Reading, whole bean<input id="fMW" type="number" inputmode="decimal" step="any" value="' +
    esc(c.mWhole ?? c.agWhole ?? '') +
    '"></label>' +
    '<div class="full mini" id="fConv"></div>' +
    '<label class="l full" id="fKnownWrap">Agtron Gourmet of the same sample, if you know it<input id="fKnown" type="number" inputmode="decimal" step="any" value="' +
    v('agKnown') +
    '"></label>' +
    '<details class="full"' +
    (c.xCommercial != null || c.xColortrack != null || c.xColorette != null || c.xName ? ' open' : '') +
    '><summary class="mini">More numbers on your meter screen (Agtron Commercial, Colorette, ColorTrack, roast name)</summary><div class="f" style="margin-top:6px">' +
    '<label class="l">Agtron Commercial<input id="fXC" type="number" inputmode="decimal" step="any" value="' +
    v('xCommercial') +
    '"></label>' +
    '<label class="l">Probat Colorette<input id="fXP" type="number" inputmode="decimal" step="any" value="' +
    v('xColorette') +
    '"></label>' +
    '<label class="l">ColorTrack<input id="fXT" type="number" inputmode="decimal" step="any" value="' +
    v('xColortrack') +
    '"></label>' +
    '<label class="l">Roast name shown<input id="fXN" value="' +
    v('xName') +
    '" placeholder="Cinnamon roast"></label>' +
    '<div class="full mini">Type them as the meter shows them. Each one teaches KoffyKraft how your meter\'s scales line up, so later readings and photos show them too.</div></div></details>' +
    '<label class="l full">Meter model (optional)<input id="fDev" value="' +
    v('device') +
    '" placeholder="E20CP, CM-100 Plus, Tonino v2…"></label>' +
    '<label class="l full">Colour values (optional; D65/10° from most meters is fine)<select id="fSpace"><option value="cielab"' +
    (c.space !== 'hunter' ? ' selected' : '') +
    '>CIELAB L*a*b*</option><option value="hunter"' +
    (c.space === 'hunter' ? ' selected' : '') +
    '>Hunter Lab (HunterLab meters)</option></select></label>' +
    '<label class="l">L<input id="fL" type="number" inputmode="decimal" step="any" value="' +
    v('L') +
    '"></label>' +
    '<label class="l">a<input id="fA" type="number" inputmode="decimal" step="any" value="' +
    v('a') +
    '"></label>' +
    '<label class="l">b<input id="fB" type="number" inputmode="decimal" step="any" value="' +
    v('b') +
    '"></label>' +
    '<div class="mini" style="align-self:end">Used for the colour difference when two readings both have values.</div>' +
    '</div>';
  h +=
    '<h2>Photo reading</h2><div class="card">' +
    (c.photo
      ? '<div class="row" style="align-items:center"><span class="sw" style="background:rgb(' +
        c.photo.rgb.join(',') +
        ')"></span><span class="res">L* ' +
        c.photo.L.toFixed(1) +
        ' · a* ' +
        c.photo.a.toFixed(1) +
        ' · b* ' +
        c.photo.b.toFixed(1) +
        '</span></div>'
      : '<div class="mini">No meter? Grind a spoonful, press it flat in a small dish with a plain white card beside it, in bright shade with no flash. Take the photo, tap the card, then the coffee.</div>') +
    '<div class="row" style="margin-top:8px"><label class="btn' +
    (c.photo ? '' : ' primary') +
    '">' +
    (c.photo ? 'Photo again' : 'Measure from a photo') +
    '<input id="fFile" type="file" accept="image/*" capture="environment" hidden></label>' +
    (c.photo ? '<button type="button" class="btn" id="fPhotoDel">Remove photo reading</button>' : '') +
    '</div><div id="ccWork"></div></div>';
  h +=
    '<label class="l" style="margin-top:12px">Notes<textarea id="fNotes" rows="2" placeholder="Batch, sampling, light, anything unusual">' +
    v('notes') +
    '</textarea></label>';
  h += '<h2>Result</h2><div class="card" id="result"></div>';
  h +=
    '<div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="fSave">Save reading</button>' +
    (saved
      ? '<button type="button" class="btn" id="fRef">' +
        (getRef() === c.id ? 'This is the reference' : 'Set as reference') +
        '</button><button type="button" class="btn bad" id="fDel">Delete</button>'
      : '') +
    '</div>';
  $('#view').innerHTML = h;
  const read = () => {
    c.name = $('#fName').value.trim();
    c.at = $('#fAt').value || today();
    c.roastedOn = $('#fRoasted').value || '';
    const g = x => {
      const el = $(x);
      const t = el ? el.value.trim() : '';
      return t === '' ? null : parseFloat(t);
    };
    c.meter = $('#fMeter').value;
    c.mGround = g('#fMG');
    c.mWhole = g('#fMW');
    c.agKnown = meterInfo(c).toG ? null : g('#fKnown');
    c.space = $('#fSpace').value;
    c.L = g('#fL');
    c.a = g('#fA');
    c.b = g('#fB');
    c.device = $('#fDev').value.trim();
    c.xCommercial = g('#fXC');
    c.xColorette = g('#fXP');
    c.xColortrack = g('#fXT');
    c.xName = $('#fXN').value.trim();
    // a Commercial number with no Gourmet still gives the Gourmet (Agtron E20CP manual)
    if (c.agKnown == null && c.mGround == null && c.xCommercial != null && meterOf(c) === 'agtron-g')
      c.agKnown = Math.round(K.toGourmet(c.xCommercial) * 10) / 10;
    // keep Agtron Gourmet equivalents on the record for lists, sharing and older pages
    const [gg, gw] = gourmetPair(c);
    c.agGround = gg == null ? null : Math.round(gg * 10) / 10;
    c.agWhole = gw == null ? null : Math.round(gw * 10) / 10;
    c.scale = 'gourmet';
    c.notes = $('#fNotes').value.trim();
    const rs = $('#fRoast');
    if (rs) {
      c.roastId = rs.value || '';
      const rr = ROASTS.find(x => String(x.id) === rs.value);
      c.roastLabel = rr ? roastLabel(rr) : '';
    }
    const gs = $('#fGreen');
    if (gs) c.greenId = gs.value || '';
  };
  document.querySelectorAll('#fKind [data-k]').forEach(
    b =>
      (b.onclick = () => {
        c.kind = b.dataset.k;
        document.querySelectorAll('#fKind [data-k]').forEach(x => x.classList.toggle('on', x === b));
      })
  );
  document.querySelectorAll('#view input, #view select, #view textarea').forEach(el =>
    el.addEventListener('input', () => {
      read();
      result();
    })
  );
  const rs = $('#fRoast');
  if (rs)
    rs.addEventListener('change', () => {
      if (!$('#fName').value.trim()) {
        const rr = ROASTS.find(x => String(x.id) === rs.value);
        if (rr) $('#fName').value = roastLabel(rr);
      }
      read();
      result();
    });
  $('#fFile').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    K.measurePhoto(f, $('#ccWork'), (lab, rgb) => {
      read();
      c.photo = { L: lab.L, a: lab.a, b: lab.b, C: lab.C, h: lab.h, rgb, at: Date.now() };
      draw(saved);
      toast('Photo measured. Save to keep it.');
    });
  };
  if ($('#fPhotoDel'))
    $('#fPhotoDel').onclick = () => {
      read();
      delete c.photo;
      draw(saved);
    };
  $('#fSave').onclick = save;
  if ($('#fDel'))
    $('#fDel').onclick = async () => {
      if (!confirm('Delete this reading?')) return;
      await ORIGIN.remove(c.id);
      if (getRef() === c.id) setRef('');
      toast('Deleted');
      location.hash = '';
    };
  if ($('#fRef'))
    $('#fRef').onclick = () => {
      setRef(c.id);
      draw(saved);
      toast('Reference set');
    };
  if (saved) bindCloudRow(c);
  result();
}
function result() {
  const c = CUR,
    out = [];
  const g = gourmet(c),
    M = meterInfo(c);
  // how this meter's number became Agtron Gourmet
  const conv = $('#fConv'),
    knownWrap = $('#fKnownWrap');
  if (conv) {
    const C = M.toG ? null : learned(meterOf(c), c.id);
    conv.innerHTML = M.toG
      ? 'Converted to Agtron Gourmet: ' + esc(M.src) + '.'
      : 'No published conversion for ' +
        esc(M.name) +
        '. ' +
        (C && C.k != null
          ? 'Using a line learned from ' +
            C.n +
            ' of your readings with both numbers (±' +
            Math.max(1, Math.round(C.res * 2)) +
            ').'
          : 'Add the Agtron Gourmet of the same sample below when you know it; after 3 such readings KoffyKraft converts this meter for you (' +
            ((C && C.n) || 0) +
            ' so far).') +
        (M.anchor
          ? ' Reference point: the SCA cupping roast reads about ' +
            M.anchor[0] +
            ' on ' +
            esc(M.anchorNote || M.name) +
            ' and ' +
            M.anchor[1] +
            ' on Agtron Gourmet (Lighttells SCAA roast level sheet).'
          : '');
    knownWrap.hidden = !!M.toG;
  }
  if (g != null) {
    out.push(namesHtml(g));
    out.push(scalesHtml(g, false, c));
  }
  // no Agtron number, but L*a*b* from a meter: a ballpark readout
  if (g == null && num(c.L) != null && c.space !== 'hunter')
    out.push(
      readoutHtml(
        +c.L,
        'meter',
        c,
        ALL.filter(r => r.id !== c.id)
      )
    );
  const lab = labOf(c, 'meter') || labOf(c, 'photo');
  if (lab) {
    const sp = K.spaces(lab),
      f = x => x.toFixed(1);
    out.push(
      '<div class="cc-box"><b>Colour values</b> (' +
        (labOf(c, 'meter') ? 'meter' : 'photo') +
        ', D65)<div class="row" style="align-items:center;margin-top:6px"><span class="sw" style="background:' +
        sp.hex +
        '"></span><div class="kv" style="flex:1">' +
        '<span>CIELAB</span><div>L* ' +
        f(sp.lab.L) +
        ' · a* ' +
        f(sp.lab.a) +
        ' · b* ' +
        f(sp.lab.b) +
        '</div>' +
        '<span>LCh</span><div>L ' +
        f(sp.lch.L) +
        ' · C ' +
        f(sp.lch.C) +
        ' · h ' +
        f(sp.lch.h) +
        '°</div>' +
        '<span>Hunter Lab</span><div>L ' +
        f(sp.hunter.L) +
        ' · a ' +
        f(sp.hunter.a) +
        ' · b ' +
        f(sp.hunter.b) +
        '</div>' +
        '<span>XYZ</span><div>' +
        f(sp.xyz.X) +
        ' · ' +
        f(sp.xyz.Y) +
        ' · ' +
        f(sp.xyz.Z) +
        '</div>' +
        '<span>sRGB</span><div>' +
        sp.rgb.join(', ') +
        ' · ' +
        sp.hex +
        '</div>' +
        '</div></div><div class="mini" style="margin-top:6px">RGB and HEX are for screens and print: they show the colour, they do not measure the roast. Agtron meters read near-infrared, which a colour space cannot convert to.</div>' +
        curveHtml(lab) +
        '</div>'
    );
  }
  const [gw, ww] = gourmetPair(c);
  if (gw != null && ww != null) {
    const d = gw - ww;
    out.push(
      '<div class="cc-box">' +
        (d >= 0
          ? 'Ground reads <b>' + r1(d) + '</b> points higher than whole bean.'
          : '<span class="warn">Whole bean reads higher than ground, which is unusual. Check the sample and the reading form.</span>') +
        (d >= 0
          ? d >= 8 && d <= 15
            ? ' A usual gap.'
            : d > 15
              ? ' A wide gap: the outside roasted much darker than the inside.'
              : ' A narrow gap: the bean roasted evenly through.'
          : '') +
        '<div class="mini" style="margin-top:4px">Ground commonly reads 8 to 15 points higher (Moustache Coffee Club). Track the gap for each profile: a sudden change can point to moisture, density or development.</div></div>'
    );
  }
  const all = ALL.filter(r => r.id !== c.id);
  if (c.photo && g == null && !(num(c.L) != null && c.space !== 'hunter'))
    out.push(readoutHtml(c.photo.L, 'photo', c, all));
  const ref = getRef(),
    rr = ref && ref !== c.id ? ALL.find(r => r.id === ref) : null;
  const cmp = o => {
    for (const src of ['meter', 'photo']) {
      const A = labOf(c, src),
        B = labOf(o, src);
      if (A && B) return { src, d: K.de2000(B, A), A, B };
    }
    const ga = gourmet(c),
      gb = gourmet(o);
    return ga != null && gb != null ? { src: 'agtron', d: Math.abs(ga - gb), ga, gb } : null;
  };
  if (rr) {
    const x = cmp(rr);
    if (x)
      out.push(
        '<div class="cc-box">Against the reference, ' +
          esc(rr.name || 'reading') +
          ': ' +
          (x.src === 'agtron'
            ? '<b>' +
              r1(x.d) +
              '</b> Agtron points ' +
              (x.ga > x.gb ? 'lighter' : x.ga < x.gb ? 'darker' : 'apart') +
              '.'
            : '<b>ΔE00 ' +
              x.d.toFixed(1) +
              '</b> (' +
              x.src +
              ' readings), ' +
              K.verdict(x.d) +
              '. This one is ' +
              K.words(x.A, x.B) +
              '.') +
          '</div>'
      );
  }
  const near = all
    .map(o => ({ o, x: cmp(o) }))
    .filter(y => y.x)
    .sort((p, q) => (p.x.src === 'agtron') - (q.x.src === 'agtron') || p.x.d - q.x.d)
    .slice(0, 5);
  if (near.length)
    out.push(
      '<div class="mini" style="margin-top:8px">Nearest readings</div>' +
        near
          .map(
            y =>
              '<div class="row" style="justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid #f0ebe3"><span>' +
              esc(y.o.name || 'Reading') +
              '</span><span>' +
              (y.x.src === 'agtron' ? r1(y.x.d) + ' Agtron' : 'ΔE ' + y.x.d.toFixed(1)) +
              '</span></div>'
          )
          .join('')
    );
  $('#result').innerHTML = out.length
    ? out.join('')
    : '<div class="mini">Enter an Agtron number or measure from a photo to see the roast level and comparisons.</div>';
}
async function save() {
  const c = CUR;
  if (!c.name) {
    toast('Name the coffee you measured');
    $('#fName').focus();
    return;
  }
  if (gourmet(c) == null && !c.photo && labOf(c, 'meter') == null) {
    toast('Enter an Agtron number, L*a*b*, or measure from a photo');
    return;
  }
  const r = await ORIGIN.put(c);
  if (!getRef()) setRef(r.id);
  toast('Saved');
  if (location.hash === '#edit/' + encodeURIComponent(r.id)) route();
  else location.hash = 'edit/' + encodeURIComponent(r.id);
}
route();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
