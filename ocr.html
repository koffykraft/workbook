<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft OCR</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.app{max-width:620px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.pick,.btn{display:inline-block;border:1px solid #111;border-radius:11px;padding:11px 13px;background:#fff;color:#111;font-weight:700;text-decoration:none}.primary{background:#111;color:#fff}.pick{display:block;text-align:center;margin:18px 0}input[type=file]{display:none}img{display:none;max-width:100%;border-radius:14px;margin:12px 0}textarea{width:100%;min-height:180px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit}.status{font-size:13px;color:#666;margin:10px 0}.meta{font-size:11px;color:#888;margin-top:18px}</style></head><body><main class="app"><header><h1>OCR</h1><a href="capture.html">Capture</a></header><label class="pick" for="photo">Camera / Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview"><div id="status" class="status">Text recognition runs on this device when the browser supports it. The photo is not sent to KoffyKraft for OCR.</div><textarea id="out" placeholder="Recognised text"></textarea><p><button class="btn primary" id="recognise">Recognise text</button> <button class="btn" id="save">Save confirmed note</button></p><div class="meta">OCR can make mistakes. Check numbers, temperatures, weights, pH and lot codes before saving.</div></main><script>
let bitmap=null,file=null;photo.onchange=async()=>{file=photo.files[0];if(!file)return;preview.src=URL.createObjectURL(file);preview.style.display='block';status.textContent='Photo ready';try{bitmap=await createImageBitmap(file)}catch(e){}};
recognise.onclick=async()=>{if(!file)return alert('Choose a photo');status.textContent='Recognising…';try{if('TextDetector'in window){const d=new TextDetector();const r=await d.detect(bitmap||preview);out.value=r.map(x=>x.rawValue).join('\n');status.textContent=r.length?'Recognised · review before saving':'No text found'}else{status.textContent='On-device OCR is not available in this browser. You can still keep the photo and enter/correct text manually. No image was uploaded.'}}catch(e){status.textContent='OCR could not read this image · no image was uploaded'}};
save.onclick=()=>{if(!out.value.trim())return;const a=JSON.parse(localStorage.getItem('kk_captures_v1')||'[]');a.unshift({id:'cap-'+Date.now(),kind:'Note / OCR',at:new Date().toISOString(),text:out.value.trim(),confirmed:true,source:'on-device OCR / confirmed'});localStorage.setItem('kk_captures_v1',JSON.stringify(a));status.textContent='Confirmed note saved'};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
