<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft OCR</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.app{max-width:620px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.pick,.btn{display:inline-block;border:1px solid #111;border-radius:11px;padding:11px 13px;background:#fff;color:#111;font-weight:700;text-decoration:none}.primary{background:#111;color:#fff}.pick{display:block;text-align:center;margin:18px 0}input[type=file]{display:none}img{display:none;max-width:100%;border-radius:14px;margin:12px 0}textarea{width:100%;min-height:180px;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit}.status{font-size:13px;color:#666;margin:10px 0}.meta{font-size:11px;color:#888;margin-top:18px}</style><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="koffykraft-db.js"></script></head><body><main class="app"><header><h1>OCR</h1><a href="capture.html">Capture</a></header><label class="pick" for="photo">Camera / Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview"><div id="status" class="status">Text recognition runs on this device when the browser supports it. The photo is not sent to KoffyKraft for OCR.</div><textarea id="out" placeholder="Recognised text"></textarea><p><button class="btn primary" id="recognise">Recognise text</button> <button class="btn" id="save">Save confirmed note</button></p><div class="meta">OCR can make mistakes. Check numbers, temperatures, weights, pH and lot codes before saving.</div></main><script>
const photoInput=document.getElementById('photo'),previewEl=document.getElementById('preview'),statusEl=document.getElementById('status'),outEl=document.getElementById('out'),recogniseBtn=document.getElementById('recognise'),saveBtn=document.getElementById('save');
let bitmap=null,file=null,previewUrl='';
photoInput.onchange=async()=>{file=photoInput.files[0];if(!file)return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);previewEl.src=previewUrl;previewEl.style.display='block';statusEl.textContent='Photo ready';try{bitmap=await createImageBitmap(file)}catch(e){bitmap=null}};
recogniseBtn.onclick=async()=>{if(!file)return alert('Choose a photo');recogniseBtn.disabled=true;statusEl.textContent='Recognising…';try{if('TextDetector'in window){const d=new TextDetector();const r=await d.detect(bitmap||previewEl);outEl.value=r.map(x=>x.rawValue).join('\n');statusEl.textContent=r.length?'Recognised · review before saving':'No text found'}else if(window.Tesseract){const r=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.status==='recognizing text')statusEl.textContent='Recognising · '+Math.round((m.progress||0)*100)+'%'}});outEl.value=(r.data&&r.data.text||'').trim();statusEl.textContent=outEl.value?'Recognised · review before saving':'No text found'}else{throw new Error('OCR engine unavailable')}}catch(e){statusEl.textContent='OCR could not read this image. You can type or correct the text manually.'}finally{recogniseBtn.disabled=false}};
saveBtn.onclick=async()=>{const text=outEl.value.trim();if(!text)return alert('No text to save');const rec={id:'cap-'+Date.now(),kind:'Note / OCR',at:new Date().toISOString(),text,confirmed:true,source:'browser OCR / confirmed'};try{await KKDB.put('captures',rec);statusEl.textContent='Confirmed note saved'}catch(e){statusEl.textContent='Could not save note'}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
