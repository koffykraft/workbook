<script>
const $ = s => document.querySelector(s),
  T = KKTRACE;
function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('on'), 2400);
}
const signed = () => typeof SYNC !== 'undefined' && SYNC.isAuthenticated();
const myEmail = () => (SYNC.getUserEmail ? SYNC.getUserEmail() : '') || '';
async function api(path, opt) {
  opt = opt || {};
  const h = { 'content-type': 'application/json' };
  if (signed()) h.authorization = 'Bearer ' + SYNC.getToken();
  const r = await fetch('/api' + path, {
    method: opt.method || 'GET',
    headers: h,
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}
const pubUrl = tok => location.origin + '/trace.html#p/' + tok;
const day = d => {
  try {
    return new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
    });
  } catch (e) {
    return d;
  }
};
const when = s => {
  try {
    return new Date(s).toLocaleString(undefined, {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
    });
  } catch (e) {
    return s;
  }
};
function qrSvg(text) {
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: 'QR code' });
}

// ---------- this phone's signing key (private part never leaves the phone) ----------
function kdb() {
  return new Promise((ok, no) => {
    const q = indexedDB.open('KoffyKraftTrace', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('k');
    q.onsuccess = () => ok(q.result);
    q.onerror = () => no(q.error);
  });
}
async function kget(n) {
  const db = await kdb();
  return new Promise(ok => {
    const r = db.transaction('k').objectStore('k').get(n);
    r.onsuccess = () => ok(r.result || null);
    r.onerror = () => ok(null);
  });
}
async function kput(n, v) {
  const db = await kdb();
  return new Promise((ok, no) => {
    const t = db.transaction('k', 'readwrite');
    t.objectStore('k').put(v, n);
    t.oncomplete = () => ok();
    t.onerror = () => no(t.error);
  });
}
let KEY = null;
async function myKey() {
  if (KEY) return KEY;
  const n = 'key:' + myEmail().toLowerCase();
  let k = await kget(n);
  if (!k) {
    k = await T.newKey();
    k.reg = 0;
    await kput(n, k);
  }
  if (!k.reg) {
    await api('/trace/keys', { method: 'POST', body: { jwk: k.jwk } });
    k.reg = 1;
    await kput(n, k);
  }
  return (KEY = k);
}
async function append(lot, items, to) {
  const k = await myKey();
  let last;
  for (let i = 0; i < items.length; i += 50) {
    const part = items.slice(i, i + 50);
    for (let a = 0; a < 3; a++) {
      const L = await api('/trace/lots/' + lot);
      const ev = L.events || [];
      const evs = await T.signRun(
        lot,
        { seq: ev.length, hash: ev.length ? ev[ev.length - 1].hash : '' },
        k,
        part
      );
      try {
        last = await api('/trace/lots/' + lot + '/events', { method: 'POST', body: { events: evs, to } });
        break;
      } catch (e) {
        if (a === 2 || !/changed while/.test(e.message)) throw e;
      }
    }
  }
  return last;
}

// ---------- routes ----------
async function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^p\/([a-f0-9]{32})$/))) return publicView(m[1]);
  if (!signed()) {
    $('#view').innerHTML =
      '<h1>Lot passports</h1><div class="sub">A passport follows one coffee lot from the farm to the cup. Each step is signed on the phone that recorded it, linked to the step before, and stamped daily into the public Bitcoin record, so a buyer can check that nothing was changed later. Scan a passport QR to see one; no account is needed for that.</div><div class="card"><b>Sign in to make passports or receive lots.</b><div class="mini" style="margin:6px 0 10px">Handoffs between farms, processors and roasters go by email address.</div><a class="btn primary" href="account.html">Sign in</a></div>' +
      how();
    return;
  }
  if (h === 'seal') return sealView();
  if ((m = h.match(/^lot\/([\w-]+)$/))) return lotView(m[1]);
  return homeView();
}
window.addEventListener('hashchange', route);

function how() {
  return (
    '<h2>How it works</h2><div class="card mini" style="font-size:13.5px">' +
    '<b style="color:var(--ink)">1. Seal.</b> From a green lot in Origin, tap <i>Passport and QR</i>. You choose what is public: farm location and notes are off unless you turn them on.<br>' +
    '<b style="color:var(--ink)">2. Hand over.</b> Send the lot with its weight to the buyer\'s email. They confirm the weight they received on their own phone, and can add their roasts.<br>' +
    '<b style="color:var(--ink)">3. Check.</b> The QR page checks every signature and link in the buyer\'s own browser, adds up the weights, and shows when each day was stamped into Bitcoin through OpenTimestamps.<br><br>' +
    'What this proves: entries were made by the phones shown, in this order, and have not been changed since the day they were stamped. What it cannot prove: that what was typed in was true. Honest records, photos and buyers who visit still matter.</div>'
  );
}

// ---------- home: name, incoming lots, my passports ----------
async function homeView() {
  const v = $('#view');
  v.innerHTML =
    '<h1>Lot passports</h1><div class="sub">Signed, linked records for each lot, with a QR for the bag. <a href="contents.html">All features</a></div><div id="hv" class="mini">Loading…</div>';
  let me, inc, ls;
  try {
    [me, inc, ls] = await Promise.all([api('/trace/me'), api('/trace/incoming'), api('/trace/lots')]);
  } catch (e) {
    $('#hv').textContent = e.message;
    return;
  }
  if (!$('#hv')) return;
  let html =
    '<div class="card"><b>Name shown on your passports</b><div class="mini">Your farm, estate or roastery name. Your email is never shown.</div><div class="row" style="margin-top:6px"><input id="nm" value="' +
    esc(me.label || '') +
    '" placeholder="Thumpassery Estate" style="flex:1"><button class="btn small" id="nmS">Save</button></div></div>';
  if ((inc.items || []).length)
    html +=
      '<h2>Lots sent to you</h2>' +
      inc.items
        .map(
          x =>
            '<div class="card"><b>' +
            esc(x.title) +
            '</b><div class="mini">From ' +
            esc(x.sender) +
            ' · ' +
            esc(String(x.kg_sent)) +
            ' kg sent · ' +
            when(x.created_at) +
            ' · <a href="#p/' +
            esc(x.token) +
            '">See passport</a></div><label class="f">Weight you received, kg<input type="number" step="any" inputmode="decimal" id="kg_' +
            esc(x.id) +
            '" value="' +
            esc(String(x.kg_sent)) +
            '"></label><button class="btn primary small" data-acc="' +
            esc(x.id) +
            '">Confirm receipt</button><div class="mini" style="margin-top:4px">Weigh before confirming. This is signed with your phone and adds the lot to your green coffee in Origin.</div></div>'
        )
        .join('');
  html +=
    '<h2>Your passports</h2>' +
    ((ls.items || []).length
      ? ls.items
          .map(
            x =>
              '<a class="card" style="display:block;text-decoration:none;color:inherit" href="#lot/' +
              esc(x.id) +
              '"><b>' +
              esc(x.title) +
              '</b><div class="mini">' +
              esc(
                [
                  x.role === 'owner' ? 'Your lot' : 'Received',
                  x.entries + ' entries',
                  x.withdrawn ? 'Withdrawn' : '',
                  when(x.updated_at),
                ]
                  .filter(Boolean)
                  .join(' · ')
              ) +
              '</div></a>'
          )
          .join('')
      : '<div class="mini">None yet. Open a green lot in <a href="origin.html#green">Origin</a> and tap <i>Passport and QR</i>.</div>');
  $('#hv').outerHTML = html + how();
  $('#nmS').onclick = async () => {
    try {
      await api('/trace/me', { method: 'PUT', body: { label: $('#nm').value } });
      toast('Saved');
    } catch (e) {
      toast(e.message);
    }
  };
  document.querySelectorAll('[data-acc]').forEach(
    b =>
      (b.onclick = () =>
        accept(
          inc.items.find(x => x.id === b.dataset.acc),
          b
        ))
  );
}
async function accept(x, b) {
  const kg = +$('#kg_' + x.id).value;
  if (!(kg > 0)) {
    toast('Enter the weight you received');
    return;
  }
  b.disabled = true;
  b.textContent = 'Signing…';
  try {
    await append(x.lot_id, [{ kind: 'receive', data: { tid: x.id, kg } }]);
    const today = new Date().toISOString().slice(0, 10);
    await ORIGIN.put({
      type: 'green',
      code: 'IN-' + x.token.slice(0, 6).toUpperCase(),
      name: x.title,
      weightKg: kg,
      date: today,
      traceLot: x.lot_id,
      traceToken: x.token,
      traceRole: 'received',
      notes: 'Received from ' + x.sender + ' with a lot passport.',
    });
    toast('Received and added to Origin');
    location.hash = 'lot/' + x.lot_id;
  } catch (e) {
    toast(e.message);
    b.disabled = false;
    b.textContent = 'Confirm receipt';
  }
}

// ---------- seal: compare this lot's records with what is already sealed ----------
function opts() {
  try {
    return JSON.parse(localStorage.getItem('kk_trace_opts') || '{}');
  } catch (e) {
    return {};
  }
}
function prep(it, o) {
  const c = { ...it.card, loc: o.loc ? it.card.loc : '', notes: o.notes ? it.card.notes : '' };
  return it.kind === 'record'
    ? { rtype: it.rtype, rid: it.rid, card: c, kg: it.kg || {}, geo: o.loc && it.geo ? it.geo : null }
    : { rid: it.rid, card: c, kg: it.kg || {} };
}
const ikey = d => (d.rtype || 'roast') + ':' + d.rid;
async function sealView() {
  const v = $('#view');
  let plan;
  try {
    plan = JSON.parse(sessionStorage.getItem('kk_trace_plan') || 'null');
  } catch (e) {}
  if (!plan) {
    v.innerHTML =
      '<h1>Lot passport</h1><div class="card">Open a green lot in <a href="origin.html#green">Origin</a> and tap <i>Passport and QR</i>.</div>';
    return;
  }
  v.innerHTML =
    '<a class="back" href="origin.html#edit/green/' +
    encodeURIComponent(plan.greenId) +
    '">‹ Back</a><h1>' +
    esc(plan.title) +
    '</h1><div class="sub">Lot passport</div><div id="sv" class="mini">Checking…</div>';
  let L = null;
  if (plan.lot) {
    try {
      L = await api('/trace/lots/' + plan.lot);
    } catch (e) {
      L = null;
    }
  }
  if (!$('#sv')) return;
  if (L && L.lot.withdrawn) {
    $('#sv').innerHTML =
      '<div class="card">This passport was withdrawn. <a href="#lot/' + esc(plan.lot) + '">See it</a></div>';
    return;
  }
  const last = {};
  if (L)
    for (const e of L.events)
      if (e.body && (e.body.kind === 'record' || e.body.kind === 'roast'))
        last[ikey(e.body.data)] = T.canon(e.body.data);
  const draw = () => {
    if (!$('#sv')) return;
    const o = opts();
    const rows = plan.items.map(it => {
      const d = prep(it, o),
        k = ikey(d),
        st = !last[k] ? 'new' : last[k] === T.canon(d) ? 'same' : 'chg';
      return { it, d, st };
    });
    const todo = rows.filter(r => r.st !== 'same');
    $('#sv').outerHTML =
      '<div id="sv">' +
      (plan.role === 'buyer'
        ? '<div class="sub">You received this lot. Add your roasts of it to its passport.</div>'
        : '<div class="card"><b>What the public sees</b><label class="ck"><input type="checkbox" id="oLoc"' +
          (o.loc ? ' checked' : '') +
          '><span>Farm location and plot outline<br><span class="mini">Needed to prove where coffee was grown, for example for EU buyers under the deforestation rule. Off by default.</span></span></label><label class="ck"><input type="checkbox" id="oNotes"' +
          (o.notes ? ' checked' : '') +
          '><span>Notes written on records</span></label></div>') +
      '<div class="card"><b>' +
      (todo.length ? todo.length + ' to seal' : 'Everything is sealed') +
      '</b>' +
      rows
        .map(
          r =>
            '<div class="pick"><span><span class="kind k-' +
            (r.d.rtype || 'roast') +
            '">' +
            esc(r.d.card.kind || '') +
            '</span>' +
            esc(r.d.card.title || '') +
            '</span><span class="tag ' +
            r.st +
            '">' +
            { new: 'New', chg: 'Changed', same: 'Sealed' }[r.st] +
            '</span></div>'
        )
        .join('') +
      (plan.items.length ? '' : '<div class="mini">No records to add yet.</div>') +
      '<div class="row" style="margin-top:10px">' +
      (todo.length ? '<button class="btn primary" id="go">Sign and seal ' + todo.length + '</button>' : '') +
      (plan.lot ? '<a class="btn" href="#lot/' + esc(plan.lot) + '">QR, link and handoffs</a>' : '') +
      '</div><div class="mini" style="margin-top:6px">Changed records are added as new entries; earlier entries stay, so the history shows what changed and when.</div></div></div>';
    if ($('#oLoc'))
      $('#oLoc').onchange = $('#oNotes').onchange = () => {

async function seal(plan, todo) {

// A photo's fingerprint: SHA-256 of the file exactly as saved, plus size and shape. The photo
// itself never leaves the phone.
async function photoPrint(f) {
  const sha = await T.sha(await f.arrayBuffer());
  let w = null,
    hgt = null;
  try {
    const bm = await createImageBitmap(f);
    w = bm.width;
    hgt = bm.height;
    bm.close && bm.close();
  } catch (e) {}
  return {
    sha,
    name: String(f.name || 'photo').slice(0, 80),
    kb: Math.round(f.size / 102.4) / 10,
    w,
    h: hgt,
    taken: f.lastModified ? new Date(f.lastModified).toISOString() : null,
  };
}

// ---------- public passport: checked in the reader's own browser ----------
const ORDER = ['estate', 'plot', 'harvest', 'process', 'green'];
function geoSvg(g) {
  const la = g.map(p => p[0]),
    lo = g.map(p => p[1]);
  const a0 = Math.min(...la),
    a1 = Math.max(...la),
    o0 = Math.min(...lo),
    o1 = Math.max(...lo);
  const W = 120,
    H = 90,
    s = Math.min((W - 10) / Math.max(1e-9, o1 - o0), (H - 10) / Math.max(1e-9, a1 - a0));
  return (
    '<svg class="geo" viewBox="0 0 ' +
    W +
    ' ' +
    H +
    '"><polygon fill="#cfe0bd" stroke="#4f6b2a" stroke-width="1.5" points="' +
    g.map(p => 5 + (p[1] - o0) * s + ',' + (H - 5 - (p[0] - a0) * s)).join(' ') +
    '"/></svg>'
  );
}
function geoJson(d) {
  const ring = d.geo.map(p => [p[1], p[0]]);
  ring.push(ring[0]);
  return JSON.stringify({
    type: 'FeatureCollection',
    features: [
      {
        type: 'Feature',
        properties: { name: d.card.title || 'Plot' },
        geometry: { type: 'Polygon', coordinates: [ring] },
      },
    ],
  });
}
function sigLine(e, c, P) {
  const b = e.body,
    a = P.anchors[e.day];
  return (
    '<div class="sig">' +
    (c.ok
      ? '<span class="good">✓ Checks out</span>'
      : '<span class="badc">✗ ' +
        (!c.hashOk ? 'Changed after signing' : !c.linkOk ? 'Out of order' : 'Signature does not match') +
        '</span>') +
    ' · Signed by <b>' +
    esc(P.labels[b.key] || 'unknown') +
    '</b> (' +
    esc(e.party) +
    ') · ' +
    when(b.at) +
    ' · entry ' +
    (e.seq + 1) +
    '<br>' +
    (a && a.status === 'ok'
      ? 'Stamped into the public record on ' + day(a.at.slice(0, 10))
      : '<span class="wait">Waiting for the daily public stamp</span>') +
    '</div>'
  );
}
function recCard(e, c, P, n) {
  const d = e.body.data || {},
    k = d.card || {};
  return (
    '<div class="card"><span class="kind k-' +
    esc(d.rtype || 'roast') +

    esc(k.kind || d.rtype || '') +
    '</span><b>' +
    esc(k.title || '') +

    (k.sub ? '<div class="mini">' + esc(k.sub) + '</div>' : '') +

      : '') +
    ((k.rows || []).length

    (k.loc

        out.push(
          hit
            ? '<div class="good">✓ ' + esc(f.name) + ' matches a sealed photo.</div>'
            : '<div class="badc">✗ ' +
                esc(f.name) +
                ' does not match any sealed photo. It may be a different photo, or edited or resized.</div>'
        );
        if (hit) hit.style.outline = '2px solid #5b7a3a';
      }
      $('#phR').innerHTML = out.join('');
    };
}
function foot() {
  return '<div class="foot">Made with <a href="home.html">KoffyKraft</a> · free and open source · © T M Thomas</div>';
}
route();
