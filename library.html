<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5ef">

<title>Library</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="kk.css"><script src="app.config.js"></script><script src="tap.js" defer></script><script src="kk-base.js"></script>
<style>
.li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid var(--line);
}
.li:first-child {
  border-top: 0;
}
.li.off span {
  color: #9a948a;
  text-decoration: line-through;
}
</style>
</head>
<body data-page="library"><main class="app">
<header id="kh"></header>
<div id="view"></div>
<div id="kf"></div>
</main>
<script src="app.js"></script><script src="sync.js"></script><script src="origin-db.js"></script>
<script>
// Library: the lists every page offers as drop-downs (products, buyers, suppliers, units and the
// app's own). Add a name once and staff pick it everywhere; hide one that is no longer used. The
// app's own names can be hidden but not deleted, so a new phone always starts with them.
const $ = s => document.querySelector(s);
let LIST = '';
// details kept with each buyer, supplier or transporter, and with your own business
const PARTY = {
  buyers: 'party',
  suppliers: 'party',
  transporters: 'transport',
  products: 'item',
  inputs: 'item',
};
const FIELDS = {
  party: [
    { k: 'contact', l: 'Contact person', t: 'text' },
    { k: 'phone', l: 'Phone', t: 'text' },
    { k: 'email', l: 'Email', t: 'text' },
    { k: 'gstin', l: 'GSTIN', t: 'text', ph: '32ABCDE1234F1Z5' },
    { k: 'address', l: 'Address', t: 'area' },
    { k: 'credit', l: 'Credit, days', t: 'number', ph: 'days to pay' },
    { k: 'upi', l: 'UPI ID', t: 'text', ph: 'name@bank' },
    { k: 'bank', l: 'Bank and branch', t: 'text' },
    { k: 'accName', l: 'Account name', t: 'text' },
    { k: 'accNo', l: 'Account number', t: 'text' },
    { k: 'ifsc', l: 'IFSC', t: 'text' },
    { k: 'notes', l: 'Notes', t: 'area' },
  ],
  transport: [
    { k: 'contact', l: 'Contact person', t: 'text' },
    { k: 'phone', l: 'Phone', t: 'text' },
    { k: 'gstin', l: 'GSTIN', t: 'text' },
    { k: 'vehicles', l: 'Vehicles', t: 'text', ph: 'KL 02 AB 1234, …' },
    { k: 'rate', l: 'Usual rate', t: 'text', ph: '₹ per trip, km or kg' },
    { k: 'upi', l: 'UPI ID', t: 'text' },
    { k: 'notes', l: 'Notes', t: 'area' },
  ],
  item: [
    {
      k: 'kind',
      l: 'Kind',
      t: 'text',
      list: ['Fertiliser', 'Spray or chemical', 'Tool', 'Packing', 'Fuel', 'Product we sell', 'Other'],
    },
    { k: 'unit', l: 'Counted in', t: 'text', list: ['kg', 'l', 'nos', 'bag', 'box', 'm'] },
    { k: 'pack', l: 'Usual pack', t: 'text', ph: '50 kg bag, 1 l bottle' },
    { k: 'notes', l: 'Notes', t: 'area' },
  ],
  me: [
    { k: 'name', l: 'Business name', t: 'text' },
    { k: 'gstin', l: 'GSTIN', t: 'text' },
    { k: 'phone', l: 'Phone', t: 'text' },
    { k: 'email', l: 'Email', t: 'text' },
    { k: 'address', l: 'Address', t: 'area' },
    { k: 'upi', l: 'UPI ID for payments to you', t: 'text', ph: 'name@bank' },
    { k: 'bank', l: 'Bank and branch', t: 'text' },
    { k: 'accName', l: 'Account name', t: 'text' },
    { k: 'accNo', l: 'Account number', t: 'text' },
    { k: 'ifsc', l: 'IFSC', t: 'text' },
    { k: 'payNote', l: 'Line on payment requests', t: 'text', ph: 'Thank you. Please pay within 7 days.' },
  ],
};
// who sells this item: supplier, brand, pack, price and when, one row each
function sourcesHtml(list, name) {
  const src = LIB.sources(list, name);
  return (
    '<div class="card"><b>Who sells it</b><div class="mini">One line for each supplier and brand. Purchases recorded in the app add and update lines here.</div>' +
    (src.length
      ? '<table class="t" style="margin-top:6px"><tr><th>Supplier</th><th>Brand</th><th>Pack</th><th class="n">Price</th><th></th></tr>' +
        src
          .map(
            (x, i) =>
              '<tr><td>' +
              esc(x.supplier) +
              '</td><td>' +
              esc(x.brand || '') +
              '</td><td>' +
              esc(x.pack || '') +
              '</td><td class="n">' +
              (x.price ? esc(x.price) : '') +
              (x.last ? '<div class="mini">' + esc(fmtDate(x.last)) + '</div>' : '') +
              '</td><td><button class="btn small" data-drop="' +
              i +
              '">✕</button></td></tr>'
          )
          .join('') +
        '</table>'
      : '<div class="mini" style="margin-top:6px">No suppliers yet.</div>') +
    '<div class="form" style="margin-top:8px">' +
    '<label>Supplier' +
    LIB.pick('s_supplier', 'suppliers', '') +
    '</label><label>Brand<input data-s="brand"></label><label>Pack<input data-s="pack" placeholder="50 kg bag"></label><label>Price<input data-s="price" type="number" step="any" inputmode="decimal" placeholder="per pack"></label>' +
    '</div><div class="row" style="margin-top:6px"><button class="btn small" id="addSrc">Add this supplier and brand</button></div></div>'
  );
}
// what a supplier sells, gathered from every item's suppliers
function sellsHtml(name) {
  const rows = [];
  for (const n of ['inputs', 'products'])
    for (const item of LIB.get(n))
      for (const x of LIB.sources(n, item))
        if (String(x.supplier).toLowerCase() === String(name).toLowerCase()) rows.push([item, x]);
  return rows.length
    ? '<div class="card"><b>Sells</b>' +
        rows
          .map(
            ([item, x]) =>
              '<div class="mini" style="margin-top:4px"><b>' +
              esc(item) +
              '</b>' +
              esc(
                [x.brand, x.pack, x.price ? 'at ' + x.price : '', x.last ? fmtDate(x.last) : '']
                  .filter(Boolean)
                  .map(v => ' · ' + v)
                  .join('')
              ) +
              '</div>'
          )
          .join('') +
        '</div>'
    : '';
}
async function details(list, name) {
  await LIB.load();
  const isMe = list === '_business';
  const kind = isMe ? 'me' : PARTY[list] || 'party';
  const cur = isMe ? LIB.me() : LIB.info(list, name);
  $('#view').innerHTML =
    '<a href="#' +
    (isMe ? '' : encodeURIComponent(list)) +
    '">‹ Library</a><h2>' +
    esc(isMe ? 'My business' : name) +
    '</h2>' +
    (isMe
      ? '<div class="sub">Used on payment requests and bills: your UPI ID makes a QR the buyer can scan to pay.</div>'
      : '<div class="sub">' + esc(LIB.label(list)) + '</div>') +
    '<div class="form">' +
    fieldsHtml(FIELDS[kind], cur) +
    '</div>' +
    (kind === 'item' ? sourcesHtml(list, name) : '') +
    (list === 'suppliers' ? sellsHtml(name) : '') +
    '<div class="card mini">Kept in your account like your other records. Bank details here are only shown to you and put on payment requests you choose to send.</div>' +
    '<div class="row sticky"><button class="btn app" id="save">Save</button><a class="btn" href="#' +
    (isMe ? '' : encodeURIComponent(list)) +
    '">Cancel</a></div>';
  if ($('#addSrc'))
    $('#addSrc').onclick = async () => {
      const sup = ($('[data-k="s_supplier"]') || {}).value || '';
      if (!sup.trim()) return toast('Pick the supplier');
      const v = k => $('[data-s="' + k + '"]').value.trim();
      await LIB.addSource(list, name, {
        supplier: sup.trim(),
        brand: v('brand'),
        pack: v('pack'),
        price: v('price'),
        last: today(),
      });
      recordsSync();
      details(list, name);
    };
  document.querySelectorAll('[data-drop]').forEach(
    b =>
      (b.onclick = async () => {
        const src = LIB.sources(list, name);
        src.splice(+b.dataset.drop, 1);
        await LIB.setInfo(list, name, { ...LIB.info(list, name), sources: src });
        recordsSync();
        details(list, name);
      })
  );
  $('#save').onclick = async () => {
    const o = { ...(isMe ? {} : { sources: LIB.info(list, name).sources }) };
    if (!o.sources) delete o.sources;
    document.querySelectorAll('[data-k]').forEach(el => {
      if (el.dataset.k === 's_supplier') return;
      const v = el.value.trim();
      if (v) o[el.dataset.k] = v;
    });
    if (o.gstin) o.gstin = o.gstin.toUpperCase();
    if (o.ifsc) o.ifsc = o.ifsc.toUpperCase();
    if (o.gstin && !/^[0-9]{2}[A-Z0-9]{13}$/.test(o.gstin))
      return toast('A GSTIN has 15 letters and numbers');
    if (o.ifsc && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(o.ifsc)) return toast('An IFSC has 11 letters and numbers');
    isMe ? await LIB.setMe(o) : await LIB.setInfo(list, name, o);
    recordsSync();
    toast('Saved');
    location.hash = isMe ? '' : encodeURIComponent(list);
  };
}
async function view() {
  const hm = decodeURIComponent(location.hash.slice(1)).match(/^d\/([^/]+)\/(.+)$/);
  if (hm) return details(hm[1], hm[2]);
  if (location.hash === '#me') return details('_business', 'me');
  await LIB.load();
  const names = LIB.names();
  LIST = decodeURIComponent(location.hash.slice(1)) || LIST || names[0];
  if (!names.includes(LIST)) names.push(LIST);
  const base = new Set(LIB.base(LIST).map(x => String(x).toLowerCase()));
  const own = LIB.own().filter(o => o.list === LIST);
  const off = own.filter(o => o.off);
  const on = LIB.get(LIST);
  $('#view').innerHTML =
    '<h1>Library</h1><div class="sub">The names every page offers in its drop-downs, so everyone picks the same one instead of typing it their own way. Anything typed under "Other" is added here too.</div>' +
    '<div class="tabs row" style="margin:8px 0;flex-wrap:wrap">' +
    names
      .map(
        n =>
          '<a class="btn small' +
          (n === LIST ? ' primary' : '') +
          '" href="#' +
          encodeURIComponent(n) +
          '">' +
          esc(LIB.label(n)) +
          '</a>'
      )
      .join('') +
    '</div>' +
    '<div class="card"><a class="item" href="#me"><b>My business</b><div class="mini">' +
    esc(
      [LIB.me().name, LIB.me().gstin, LIB.me().upi].filter(Boolean).join(' · ') ||
        'Your GSTIN, UPI ID and bank, for bills and payment requests'
    ) +
    '</div></a></div>' +
    '<div class="card"><b>' +
    esc(LIB.label(LIST)) +
    '</b> <span class="mini">' +
    on.length +
    ' in use</span>' +
    '<div class="row" style="margin:8px 0"><input id="nm" placeholder="Add a name" style="flex:1"><button class="btn app" id="add">Add</button></div>' +
    (on.length
      ? on
          .map(
            x =>
              '<div class="li"><span>' +
              (PARTY[LIST]
                ? '<a href="#d/' +
                  encodeURIComponent(LIST) +
                  '/' +
                  encodeURIComponent(x) +
                  '">' +
                  esc(x) +
                  '</a>'
                : esc(x)) +
              (base.has(x.toLowerCase()) ? ' <span class="tag">app</span>' : '') +
              (PARTY[LIST]
                ? (() => {
                    const i = LIB.info(LIST, x);
                    const line = [i.gstin, i.phone, i.credit ? i.credit + ' days credit' : '']
                      .filter(Boolean)
                      .join(' · ');
                    return (
                      '<div class="mini">' +
                      esc(line || 'Tap the name to add GSTIN, address, bank and more') +
                      '</div>'
                    );
                  })()
                : '') +
              '</span><span class="row" style="gap:6px;flex:none"><button class="btn small" data-edit="' +
              esc(x) +
              '">Edit</button><button class="btn small" data-hide="' +
              esc(x) +
              '">Hide</button>' +
              (LIB.isBase(LIST, x)
                ? ''
                : '<button class="btn small danger" data-del="' + esc(x) + '">Delete</button>') +
              '</span></div>'
          )
          .join('')
      : '<div class="mini">Nothing in this list yet.</div>') +
    '</div>' +
    (off.length
      ? '<div class="card"><b>Hidden</b>' +
        off
          .map(
            o =>
              '<div class="li off"><span>' +
              esc(o.name) +
              '</span><button class="btn small" data-show="' +
              esc(o.name) +
              '">Show again</button></div>'
          )
          .join('') +
        '</div>'
      : '') +
    '<div class="card mini">Edit changes a name; Delete removes one you added (names that come with the app can only be hidden). Records already saved keep the name they were saved with. Lists follow your account to every phone you sign in on.</div>';
  const add = async () => {
    const v = $('#nm').value.trim();
    if (!v) return;
    await LIB.learn(LIST, v);
    recordsSync();
    toast('Added');
    view();
  };
  $('#add').onclick = add;
  $('#nm').onkeydown = e => {
    if (e.key === 'Enter') add();
  };
  document.querySelectorAll('[data-del]').forEach(
    b =>
      (b.onclick = async () => {
        if (
          !confirm(
            'Delete ' + b.dataset.del + ' and its details from the list? Records already saved keep the name.'
          )
        )
          return;
        await LIB.remove(LIST, b.dataset.del);
        recordsSync();
        toast('Deleted');
        view();
      })
  );
  document.querySelectorAll('[data-edit]').forEach(
    b =>
      (b.onclick = async () => {
        const old = b.dataset.edit;
        const v = (prompt('Change the name', old) || '').trim();
        if (!v || v === old) return;
        await LIB.rename(LIST, old, v);
        recordsSync();
        toast('Changed');
        view();
      })
  );
  document
    .querySelectorAll('[data-hide]')
    .forEach(
      b => (b.onclick = async () => (await LIB.hide(LIST, b.dataset.hide, true), recordsSync(), view()))
    );
  document
    .querySelectorAll('[data-show]')
    .forEach(
      b => (b.onclick = async () => (await LIB.hide(LIST, b.dataset.show, false), recordsSync(), view()))
    );
}
window.addEventListener('hashchange', view);
view();
recordsSync().then(n => n && view());
</script>
<script src="pv.js" defer></script>
<script src="kk-family.js" defer></script>
</body>
</html>
