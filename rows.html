<script>
// Rows and plants: the plant rows of a block, each a line on the map with a plant spacing, so every
// plant gets a number and a label (R3-12) and its own status and notes. A row can be drawn on the
// map, walked with the phone, taken from a recorded trail (each straight run of the walk becomes a
// row), or copied alongside an existing row at the row spacing. Positions come from phone GPS, so
// a plant's point is good to a few metres: the number along the row is what identifies it.
/* global L, qrcode */
const $ = s => document.querySelector(s);
const STATUS = (
  SET('rows').status || ['Healthy', 'Weak', 'Sick', 'Dead', 'Gap (missing)', 'Replanted']
).slice();
const COL = {
  Healthy: '#52b788',
  Weak: '#f4a261',
  Sick: '#e76f51',
  Dead: '#1b1b1b',
  'Gap (missing)': '#ffffff',
  Replanted: '#4cc9f0',
};
const TRAIL_DB =
  { Rabr: 'RABRTrails', Koko: 'KokoTrails', KoffyKraft: 'KoffyKraftTrails' }[APP.short] ||
  APP.short + 'Trails';
const plantWord = W('crop') === 'rubber' ? 'tree' : 'plant';
let PLACES = [],
  ROWS = [],
  BLOCK = '',
  map = null,
  layer = null,
  draft = null,
  watch = null;
// ---- geometry: metres on a flat patch around a point, good for a block ----
function proj(o) {
  const k = Math.cos((o[0] * Math.PI) / 180);
  return {
    to: p => [(p[1] - o[1]) * 111320 * k, (p[0] - o[0]) * 110540],
    back: q => [o[0] + q[1] / 110540, o[1] + q[0] / (111320 * k)],
  };
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function lengthM(line) {
  if (!line || line.length < 2) return 0;
  const P = proj(line[0]),
    q = line.map(P.to);
  let s = 0;
  for (let i = 1; i < q.length; i++) s += dist(q[i - 1], q[i]);
  return s;
}
// plant points along a row: the first at `start` metres, then every `spacing` metres
function plantsAlong(line, spacing, start) {
  if (!line || line.length < 2 || !(spacing > 0)) return [];
  const P = proj(line[0]),
    q = line.map(P.to),
    out = [];
  let want = Math.max(0, start || 0),
    run = 0;
  for (let i = 1; i < q.length; i++) {
    const a = q[i - 1],
      b = q[i],
      d = dist(a, b);
    while (want <= run + d + 1e-6 && out.length < 5000) {
      const t = d ? (want - run) / d : 0;
      out.push(P.back([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]));
      want += spacing;
    }
    run += d;
  }
  return out;
}
// Douglas-Peucker in metres, to take GPS wobble out of a walked line
function simplify(line, tol) {
  if (line.length < 3) return line.slice();
  const P = proj(line[0]),
    q = line.map(P.to);
  const keep = new Array(q.length).fill(false);
  keep[0] = keep[q.length - 1] = true;
  const st = [[0, q.length - 1]];
  while (st.length) {
    const [i, j] = st.pop();
    let m = -1,
      md = 0;
    for (let k = i + 1; k < j; k++) {
      const [x1, y1] = q[i],
        [x2, y2] = q[j],
        [x, y] = q[k];
      const L2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      const t = L2 ? Math.max(0, Math.min(1, ((x - x1) * (x2 - x1) + (y - y1) * (y2 - y1)) / L2)) : 0;
      const d = Math.hypot(x - (x1 + t * (x2 - x1)), y - (y1 + t * (y2 - y1)));
      if (d > md) (md = d), (m = k);
    }
    if (md > tol && m > 0) {
      keep[m] = true;
      st.push([i, m], [m, j]);
    }
  }
  return line.filter((_, i) => keep[i]);
}
// a walk up and down the rows, split wherever it turns: each long straight run is a row
function splitRuns(line) {
  const s = simplify(line, 3);
  if (s.length < 2) return [];
  const P = proj(s[0]),
    q = s.map(P.to);
  const head = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]);
  const runs = [];
  let cur = [s[0]];
  for (let i = 1; i < s.length; i++) {
    cur.push(s[i]);
    if (i < s.length - 1) {
      let turn = Math.abs(head(q[i - 1], q[i]) - head(q[i], q[i + 1]));
      if (turn > Math.PI) turn = 2 * Math.PI - turn;
      if (turn > (60 * Math.PI) / 180) {
        runs.push(cur);
        cur = [s[i]];
      }
    }
  }
  runs.push(cur);
  // the short cross-overs between rows are dropped: under 8 m, or well short of a typical run
  const lens = runs.map(lengthM),
    med = lens.slice().sort((a, b) => a - b)[Math.floor(lens.length / 2)] || 0,
    longest = Math.max(0, ...lens);
  return runs.filter((r, i) => lens[i] >= 8 && lens[i] >= 0.3 * Math.max(med, longest / 2));
}
// a straight line through a walked run (its main direction), from end to end
function straighten(line) {
  if (line.length < 2) return line;
  const P = proj(line[0]),
    q = line.map(P.to);
  const mx = q.reduce((a, p) => a + p[0], 0) / q.length,
    my = q.reduce((a, p) => a + p[1], 0) / q.length;
  let sxx = 0,
    syy = 0,
    sxy = 0;
  q.forEach(([x, y]) => {
    sxx += (x - mx) ** 2;
    syy += (y - my) ** 2;
    sxy += (x - mx) * (y - my);
  });
  const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy),
    ux = Math.cos(ang),
    uy = Math.sin(ang);
  const ts = q.map(([x, y]) => (x - mx) * ux + (y - my) * uy);
  const a = ts[0],
    b = ts[ts.length - 1];
  return [P.back([mx + a * ux, my + a * uy]), P.back([mx + b * ux, my + b * uy])];
}
// the same row moved sideways by `off` metres (positive = to the right, walking start to end)
function offsetLine(line, off) {
  const P = proj(line[0]),
    q = line.map(P.to);
  const a = q[0],
    b = q[q.length - 1],
    d = dist(a, b) || 1;
  const nx = (b[1] - a[1]) / d,
    ny = -(b[0] - a[0]) / d;
  return q.map(([x, y]) => P.back([x + nx * off, y + ny * off]));
}
// kinds of row (main crop, intercrop, short-term, boundary…) from Library › Row kinds, each with a colour
const KINDS = () => LIB.get('rowkinds');
const kindOf = r => r.kind || KINDS()[0] || 'Main crop';
const colourOf = r => rowColour(kindOf(r));
const kindSelect = (id, v) =>
  '<select id="' +
  id +
  '">' +
  KINDS()
    .map(k => '<option' + (k === v ? ' selected' : '') + '>' + esc(k) + '</option>')
    .join('') +
  '</select>';
const plantsOf = r => plantsAlong(r.line, +r.spacing, +(r.start || 0));
const labelOf = (r, i) => (r.prefix || r.name || 'R') + '-' + (i + 1);
// ---- data ----
async function load() {
  await LIB.load().catch(() => {});
  PLACES = await KKPLACES.list();
  await loadGeo();
  ROWS = (await ORIGIN.all('row')).sort(
    (a, b) =>
      (+a.n || 0) - (+b.n || 0) || String(a.name).localeCompare(String(b.name), undefined, { numeric: true })
  );
  if (!BLOCK) {
    const h = new URLSearchParams(location.search).get('block');
    BLOCK = h || (PLACES.find(p => p.kind === 'block') || {}).id || '';
  }
}
const blockRows = () => ROWS.filter(r => r.plotId === BLOCK);
const blockOf = id => PLACES.find(p => p.id === id) || {};
// the same map as the Map page: satellite or street, a scale, place search, and every farm and
// block shown for bearings, with this block's outline dashed in the Boundary colour
let BASE = 'sat',
  GEO = {};
function mapIn(el) {
  if (map) map.remove();
  const old = el.previousElementSibling;
  if (old && old.classList.contains('msearch')) old.remove();
  el.insertAdjacentHTML(
    'beforebegin',
    '<div class="msearch"><input id="mq" placeholder="Find a place or paste lat, lng" enterkeyhint="search"><button class="btn small" id="mbase">' +
      (BASE === 'sat' ? 'Street map' : 'Satellite') +
      '</button></div>'
  );
  map = L.map(el, { zoomControl: true }).setView([10.3, 76.6], 8);
  const base = {
    sat: L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxNativeZoom: 18, maxZoom: 21, attribution: 'Esri, Maxar, Earthstar Geographics' }
    ),
    street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxNativeZoom: 19,
      maxZoom: 21,
      attribution: '© OpenStreetMap contributors',
    }),
  };
  base[BASE].addTo(map);
  L.control.scale({ metric: true, imperial: false }).addTo(map);
  locateBtn();
  $('#mbase').onclick = () => {
    map.removeLayer(base[BASE]);
    BASE = BASE === 'sat' ? 'street' : 'sat';
    base[BASE].addTo(map);
    $('#mbase').textContent = BASE === 'sat' ? 'Street map' : 'Satellite';
  };
  $('#mq').addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = e.target.value.trim();
    const ll = v.match(/^\s*(-?\d+(\.\d+)?)\s*[, ]\s*(-?\d+(\.\d+)?)\s*$/);
    if (ll) return map.setView([+ll[1], +ll[3]], 18);
    const mine = PLACES.find(x => x.name.toLowerCase().includes(v.toLowerCase()));
    if (mine && (GEO[mine.id] || mine.lat != null))
      return GEO[mine.id]
        ? map.fitBounds(GEO[mine.id], { padding: [20, 20] })
        : map.setView([mine.lat, mine.lng], 18);
    try {
      const r = await fetch(
        'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q=' +
          encodeURIComponent(v)
      );
      const j = await r.json();
      if (j[0]) map.setView([+j[0].lat, +j[0].lon], 16);
      else toast('Not found');
    } catch (x) {
      toast('Search needs a connection');
    }
  });
  places();
  layer = L.layerGroup().addTo(map);
  return map;
}
// outlines (geo) of every farm and block, kept by id
async function loadGeo() {
  GEO = {};
  try {
    const M = APP.places || { farm: 'farm', block: 'block' };
    const D = await ORIGIN.allTypes([M.farm, M.block]);
    [...(D[M.farm] || []), ...(D[M.block] || [])].forEach(r => {
      if (Array.isArray(r.geo) && r.geo.length > 2) GEO[r.id] = r.geo;
    });
  } catch (e) {}
}
function places() {
  const g = L.layerGroup().addTo(map);
  PLACES.forEach(p => {
    const here = p.id === BLOCK;
    if (GEO[p.id])
      L.polygon(GEO[p.id], {
        color: here ? rowColour('Boundary') : p.kind === 'farm' ? '#ffffff' : '#ffffffaa',
        weight: here ? 3 : p.kind === 'farm' ? 2 : 1,
        dashArray: here ? '6 4' : null,
        fillOpacity: here ? 0.06 : 0,
        interactive: false,
      })
        .bindTooltip(esc(p.name), { permanent: here, direction: 'center', className: 'plabel' })
        .addTo(g);
    else if (p.lat != null && (p.kind === 'farm' || here))
      L.circleMarker([p.lat, p.lng], {
        radius: here ? 7 : 5,
        color: '#fff',
        weight: 2,
        fillColor: here ? rowColour('Boundary') : '#555',
        fillOpacity: 1,
        interactive: false,
      })
        .bindTooltip(esc(p.name), { permanent: here, direction: 'top', className: 'plabel' })
        .addTo(g);
  });
}
async function plotOutline() {
  return GEO[BLOCK] ? { geo: GEO[BLOCK] } : null;
}
function draw(rows, opts) {
  layer.clearLayers();
  const pts = [];
  rows.forEach(r => {
    if (!r.line || r.line.length < 2) return;
    const kc = colourOf(r);
    L.polyline(r.line, { color: kc, weight: 3, opacity: 0.9 })
      .bindTooltip(esc(r.name || 'Row'))
      .on('click', () => !(opts || {}).still && (location.hash = 'row/' + encodeURIComponent(r.id)))
      .addTo(layer);
    r.line.forEach(p => pts.push(p));
    const many = map.getZoom() >= 19;
    plantsOf(r).forEach((p, i) => {
      const st = ((r.plants || {})[i + 1] || {}).status || 'Healthy';
      const m = L.circleMarker(p, {
        radius: 4,
        color: '#000',
        weight: 1,
        fillColor: st === 'Healthy' ? kc : COL[st] || kc,
        fillOpacity: 1,
      }).addTo(layer);
      if (!(opts || {}).still)
        m.on('click', () => (location.hash = 'plant/' + encodeURIComponent(r.id) + '/' + (i + 1)));
      if (many && (opts || {}).labels !== false)
        m.bindTooltip(String(i + 1), {
          permanent: true,
          direction: 'top',
          className: 'plabel',
          offset: [0, -4],
        });
    });
  });
  return pts;
}
// centre a map: the rows, else the block outline, else its GPS point (or its farm's), else the
// farm's outline, else every place there is; false when there is nothing to go on
async function fitBlock(pts) {
  if (pts.length) return fit(pts);
  const b = blockOf(BLOCK);
  if (GEO[BLOCK]) return map.fitBounds(GEO[BLOCK], { padding: [20, 20] });
  if (b.lat != null) return map.setView([b.lat, b.lng], 18);
  if (GEO[b.farmId]) return map.fitBounds(GEO[b.farmId], { padding: [20, 20] });
  const all = [...Object.values(GEO).flat(), ...PLACES.filter(p => p.lat != null).map(p => [p.lat, p.lng])];
  if (all.length) {
    map.fitBounds(all, { padding: [20, 20], maxZoom: 17 });
    return false;
  }
  return false;
}
// the block outline, dashed in the Boundary colour, under everything else
async function outline() {}
// centre on where the phone is (for drawing a row while standing in the block)
function locateBtn() {
  const b = L.control({ position: 'topright' });
  b.onAdd = () => {
    const a = L.DomUtil.create('a', 'leaflet-bar');
    a.href = '#';
    a.title = 'Where am I';
    a.textContent = '📍';
    a.style.cssText =
      'display:block;width:34px;height:34px;line-height:34px;text-align:center;background:#fff;font-size:18px';
    L.DomEvent.on(a, 'click', e => {
      L.DomEvent.stop(e);
      if (!navigator.geolocation) return toast('No GPS here');
      navigator.geolocation.getCurrentPosition(
        p => map.setView([p.coords.latitude, p.coords.longitude], 19),
        () => toast('Could not read the GPS'),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
    return a;
  };
  b.addTo(map);
}
function fit(pts, fallback) {
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 20 });
  else if (fallback) map.setView(fallback, 18);
}
// the colour key: each kind of row in use, with a colour box to change it
function legendHtml(rows) {
  const used = KINDS().filter(k => rows.some(r => kindOf(r) === k));
  const show = used.length ? used : KINDS().slice(0, 4);
  return (
    '<div class="card"><b>Colours</b> <span class="mini">tap a colour to change it · <a href="library.html#rowkinds">row kinds</a></span><div class="legend">' +
    show
      .map(k => {
        const rs = rows.filter(r => kindOf(r) === k);
        return (
          '<label><input type="color" data-kc="' +
          esc(k) +
          '" value="' +
          esc(rowColour(k)) +
          '"> ' +
          esc(k) +
          (rs.length
            ? ' <span class="mini">' +
              rs.length +
              ' rows · ' +
              rs.reduce((a, r) => a + plantsOf(r).length, 0) +
              '</span>'
            : '') +
          '</label>'
        );
      })
      .join('') +
    '<span class="mini"><i style="display:inline-block;width:18px;vertical-align:middle;border-top:2px dashed ' +
    esc(rowColour('Boundary')) +
    '"></i> ' +
    esc(W('block').toLowerCase()) +
    ' outline</span></div></div>'
  );
}
// ---- views ----
async function listView() {
  await load();
  const blocks = PLACES.filter(p => p.kind === 'block');
  const rows = blockRows();
  const total = rows.reduce((a, r) => a + plantsOf(r).length, 0);
  const st = {};
  rows.forEach(r =>
    plantsOf(r).forEach((_, i) => {
      const s = ((r.plants || {})[i + 1] || {}).status || 'Healthy';
      st[s] = (st[s] || 0) + 1;
    })
  );
  $('#view').innerHTML =
    '<h1>Rows and ' +
    plantWord +
    's</h1><div class="sub">Each row of a ' +
    esc(W('block').toLowerCase()) +
    ' as a line, with ' +
    plantWord +
    's placed along it at the spacing you give, numbered and labelled. Draw a row, walk it, take rows from a trail, or copy a row alongside.</div>' +
    '<div class="form"><label class="full">' +
    esc(W('block')) +
    '<select id="blk">' +
    KKPLACES.options(
      PLACES.filter(p => p.kind === 'block' || p.kind === 'farm'),
      BLOCK,
      false
    ) +
    '</select></label></div>' +
    (blocks.length
      ? ''
      : '<div class="card">Add a ' +
        esc(W('block').toLowerCase()) +
        ' first in <a href="' +
        esc((APP.placesPage || 'places') + '.html') +
        '">' +
        esc(W('farms')) +
        '</a>.</div>') +
    '<div id="map"></div>' +
    '<div class="row" style="flex-wrap:wrap;margin:8px 0">' +
    '<a class="btn app" href="#draw">✏️ Draw a row</a><a class="btn" href="#walk">🚶 Walk a row</a><a class="btn" href="#trail">〰️ From a trail</a>' +
    (rows.length ? '<a class="btn" href="#copy">⇉ Copy a row alongside</a>' : '') +
    '</div>' +
    legendHtml(rows) +
    '<div class="card"><b>' +
    rows.length +
    ' rows · ' +
    total +
    ' ' +
    plantWord +
    's</b>' +
    (Object.keys(st).length
      ? '<div class="mini">' +
        esc(
          Object.entries(st)
            .map(([k, v]) => v + ' ' + k.toLowerCase())
            .join(' · ')
        ) +
        '</div>'
      : '') +
    (rows.length
      ? rows
          .map(
            r =>
              '<div class="cand"><i style="background:' +
              esc(colourOf(r)) +
              '"></i><a href="#row/' +
              encodeURIComponent(r.id) +
              '" style="flex:1"><b>' +
              esc(r.name || 'Row') +
              '</b> <span class="mini">' +
              esc(kindOf(r)) +

      draft = [];
      watch = navigator.geolocation.watchPosition(
        p => {
          if (p.coords.accuracy > 25)
            return ($('#gps').textContent =
              'Waiting for a better GPS fix (±' + Math.round(p.coords.accuracy) + ' m)…');
          draft.push([p.coords.latitude, p.coords.longitude]);

        () => toast('Could not read the GPS'),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }

// from a trail: each straight run of the walk is offered as a row
function trails() {
  return new Promise(ok => {
    let q;
    try {
      q = indexedDB.open(TRAIL_DB, 1);
    } catch (e) {
      return ok([]);
    }
    q.onupgradeneeded = () => {
      const d = q.result;
      if (!d.objectStoreNames.contains('trails')) d.createObjectStore('trails', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos'))
        d.createObjectStore('photos', { keyPath: 'id' }).createIndex('trail', 'trailId');
    };
    q.onerror = () => ok([]);
    q.onsuccess = () => {
      const g = q.result.transaction('trails').objectStore('trails').getAll();
      g.onsuccess = () =>
        ok(
          (g.result || [])
            .filter(t => (t.points || []).length > 1)
            .sort((a, b) => String(b.started || b.id).localeCompare(String(a.started || a.id)))
        );
      g.onerror = () => ok([]);
    };
  });
}

function withLog(old, o) {
  old = old || {};
  const log = (old.log || []).slice();
  if ((o.status || 'Healthy') !== (old.status || 'Healthy') || (o.note || '') !== (old.note || ''))
    log.push({ day: today(), status: o.status || 'Healthy', note: o.note || '' });
  return { ...old, ...o, log: log.slice(-60) };
}

  const r = ROWS.find(x => x.id === id);
  const p = r && plantsOf(r)[n - 1];
  if (!p) return ($('#view').innerHTML = '<div class="card">Not found. <a href="#">Back</a></div>');
  const d = (r.plants || {})[n] || {};
  const c = await chainOf(r);
  $('#view').innerHTML =
    '<a href="#">‹ Rows</a>' +
    crumbs(c, r, n) +
    '<h2>' +
    esc(labelOf(r, n - 1)) +
    '</h2><div class="sub">' +
    esc(r.name) +
    ', ' +
    plantWord +
    ' ' +
    n +
    ' of ' +
    plantsOf(r).length +
    ' · ' +
    p[0].toFixed(6) +
    ', ' +
    p[1].toFixed(6) +
    '</div>' +
    '<div class="form"><label>Status<select data-k="status">' +
    STATUS.map(
      s => '<option' + ((d.status || 'Healthy') === s ? ' selected' : '') + '>' + esc(s) + '</option>'
    ).join('') +
    '</select></label>' +
    '<label>Variety or clone, if different<input data-k="variety" value="' +
    esc(d.variety || '') +
    '" placeholder="' +
    esc(r.variety || '') +
    '"></label>' +
    '<label class="full">Note<textarea data-k="note">' +
    esc(d.note || '') +
    '</textarea></label></div>' +
    '<div class="row" style="flex-wrap:wrap">' +
    (n > 1
      ? '<a class="btn" href="#plant/' + encodeURIComponent(id) + '/' + (n - 1) + '">‹ ' + (n - 1) + '</a>'
      : '') +
    (n < plantsOf(r).length
      ? '<a class="btn" href="#plant/' + encodeURIComponent(id) + '/' + (n + 1) + '">' + (n + 1) + ' ›</a>'
      : '') +
    '<a class="btn app" href="#passport/' +
    encodeURIComponent(id) +
    '/' +
    n +
    '">Passport</a>' +
    ((APP.modules || []).includes('fieldlog')
      ? '<a class="btn" href="fieldlog.html#new?' +
        esc(
          new URLSearchParams({
            tab: 'health',
            place: r.plotId,
            plant: labelOf(r, n - 1),
            lat: p[0].toFixed(7),
            lng: p[1].toFixed(7),
          }).toString()
        ) +
        '">Log health for this ' +
        plantWord +
        '</a>'
      : '') +
    '</div>' +
    ((d.log || []).length
      ? '<div class="card"><b>History</b>' +
        d.log
          .slice()
          .reverse()
          .map(
            e =>
              '<div class="mini">' +
              esc(fmtDate(e.day) + ' · ' + e.status + (e.note ? ' · ' + e.note : '')) +
              '</div>'
          )
          .join('') +
        '</div>'
      : '') +
    '<div class="row sticky"><button class="btn app" id="save">Save</button><a class="btn" href="#">Back</a></div>';
  $('#save').onclick = async () => {
    const o = {};
    document.querySelectorAll('[data-k]').forEach(el => (o[el.dataset.k] = el.value.trim()));
    const plants = { ...(r.plants || {}) };
    plants[n] = withLog(plants[n], o);
    await ORIGIN.put({ ...r, plants });
    recordsSync();
    toast('Saved');
    location.hash = '';
  };
}
// ---- passport: one plant traced to its row, block and farm, and on to what its block produced ----
const TYPE_WORDS = {
  harvest: 'Harvests',
  process: 'Processing',
  green: 'Green lots',
  batch: 'Batches',
  brew: 'Brews',
  cupping: 'Cuppings',
  tasting: 'Tastings',
  colour: 'Colour checks',
};
const typeWord = t => (APP.typeNames || {})[t] || TYPE_WORDS[t] || t.charAt(0).toUpperCase() + t.slice(1);
const SKIP =
  /^(id|type|areaUnit|owner.*|created.*|updated.*|deleted|geo|lat|lng|gpsAcc|radius|name|plants|line|log|_.*|.*Ids?)$/;
const words = k => k.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());
const factsOf = o =>
  Object.entries(o || {})
    .filter(
      ([k, v]) => !SKIP.test(k) && v !== '' && v != null && (typeof v === 'string' || typeof v === 'number')
    )
    .slice(0, 14)
    .map(([k, v]) => '<tr><td>' + esc(words(k)) + '</td><td>' + esc(v) + '</td></tr>')
    .join('');
// records that point at the block (plotId, blockId, plotIds…), then the ones that point at those, and
// so on: harvest › processing › lot › roast, or tapping › sheeting › smokehouse › lot
async function downstream(blockId) {
  const types = (ORIGIN.TYPES || APP.types || []).filter(
    t => ![APP.places && APP.places.farm, APP.places && APP.places.block, 'row', 'lib'].includes(t)
  );
  let all = [];
  try {
    const D = await ORIGIN.allTypes(types);
    all = types.flatMap(t => (D[t] || []).map(x => ({ ...x, type: x.type || t })));
  } catch (e) {
    return [];
  }
  const refs = x =>
    Object.entries(x).flatMap(([k, v]) =>
      /Ids?$/.test(k) ? (Array.isArray(v) ? v : [v]).filter(y => typeof y === 'string') : []
    );
  const found = new Map(),
    want = new Set([blockId]);
  for (let hop = 0; hop < 5 && want.size; hop++) {
    const next = new Set();
    all.forEach(x => {
      if (!found.has(x.id) && refs(x).some(y => want.has(y))) {
        found.set(x.id, { ...x, hop });
        next.add(x.id);
      }
    });
    want.clear();
    next.forEach(y => want.add(y));
  }
  return [...found.values()].slice(0, 300);
}
const signedOut = () => {
  try {
    return !localStorage.getItem('kk_auth_token');
  } catch (e) {
    return true;
  }
};
async function passportView(id, n) {
  await load();
  const r = ROWS.find(x => x.id === id);
  const p = r && plantsOf(r)[n - 1];
  if (!p) return ($('#view').innerHTML = '<div class="card">Not found. <a href="#">Back</a></div>');
  const d = (r.plants || {})[n] || {};
  const c = await chainOf(r);
  const lab = labelOf(r, n - 1);
  const ll = p[0].toFixed(6) + ', ' + p[1].toFixed(6);
  const variety = d.variety || r.variety || c.rec.clone || c.rec.variety || '';
  const planted = r.planted || c.rec.planted || c.rec.year || c.rec.plantedYear || '';
  const tag = [
    (APP.short || 'KoffyKraft') + ' ' + plantWord + ' ' + lab,
    [c.f.name, c.b.kind === 'block' ? c.b.name : '', r.name].filter(Boolean).join(' › '),
    variety ? 'Variety ' + variety : '',
    planted ? 'Planted ' + planted : '',
    'GPS ' + ll,
    'https://maps.google.com/?q=' + p[0].toFixed(6) + ',' + p[1].toFixed(6),
  ]
    .filter(Boolean)
    .join('\n');
  let qr = '';
  try {
    const q = qrcode(0, 'M');
    q.addData(tag);
    q.make();
    qr = q.createSvgTag({ cellSize: 3, margin: 2, scalable: true, alt: 'Plant QR' });
  } catch (e) {}
  $('#view').innerHTML =
    '<a class="noprint" href="#plant/' +
    encodeURIComponent(id) +
    '/' +
    n +
    '">‹ ' +
    esc(lab) +
    '</a>' +
    '<h1>' +
    esc(plantWord.charAt(0).toUpperCase() + plantWord.slice(1)) +
    ' passport: ' +
    esc(lab) +
    '</h1>' +
    crumbs(c, r, n) +
    '<div class="card pp"><div class="ppqr">' +
    qr +
    '</div><table class="facts">' +
    '<tr><td>' +
    esc(W('farm')) +
    '</td><td>' +
    esc(c.f.name || '') +
    '</td></tr>' +
    (c.b.kind === 'block'
      ? '<tr><td>' +
        esc(W('block')) +
        '</td><td>' +
        esc(c.b.name) +
        (c.b.ha ? ' · ' + Math.round(c.b.ha * 100) / 100 + ' ha' : '') +
        '</td></tr>'
      : '') +
    '<tr><td>Row</td><td>' +
    esc(
      r.name + ' · ' + kindOf(r) + ' · ' + plantsOf(r).length + ' ' + plantWord + 's at ' + r.spacing + ' m'
    ) +
    '</td></tr>' +
    '<tr><td>' +
    esc(plantWord.charAt(0).toUpperCase() + plantWord.slice(1)) +
    '</td><td>' +
    esc('number ' + n + ' along the row, label ' + lab) +
    '</td></tr>' +
    '<tr><td>GPS</td><td><a href="https://maps.google.com/?q=' +
    p[0].toFixed(6) +
    ',' +
    p[1].toFixed(6) +
    '" target="_blank" rel="noopener">' +
    esc(ll) +
    '</a> <span class="mini">(phone GPS, a few metres)</span></td></tr>' +
    (variety ? '<tr><td>Variety</td><td>' + esc(variety) + '</td></tr>' : '') +
    (planted ? '<tr><td>Planted</td><td>' + esc(planted) + '</td></tr>' : '') +
    '<tr><td>Status</td><td>' +
    esc((d.status || 'Healthy') + (d.note ? ' · ' + d.note : '')) +
    '</td></tr>' +
    '</table></div>' +
    (c.rec && Object.keys(c.rec).length
      ? '<div class="card"><b>The ' +
        esc(W('block').toLowerCase()) +
        '</b><table class="facts">' +
        factsOf(c.rec) +
        '</table></div>'
      : '') +
    ((d.log || []).length
      ? '<div class="card"><b>History of this ' +
        plantWord +
        '</b>' +
        d.log
          .map(
            e =>
              '<div class="mini">' +
              esc(fmtDate(e.day) + ' · ' + e.status + (e.note ? ' · ' + e.note : '')) +
              '</div>'
          )
          .join('') +
        '</div>'
      : '') +
    '<div class="card" id="fl"><b>Field log</b><div class="mini">Loading…</div></div>' +
    '<div class="card" id="ds"><b>What its ' +
    esc(W('block').toLowerCase()) +
    ' produced</b><div class="mini">Loading…</div></div>' +
    '<div class="row noprint" style="flex-wrap:wrap"><button class="btn app" onclick="print()">Print or save as PDF</button><button class="btn" id="gj">GeoJSON</button>' +
    (navigator.share ? '<button class="btn" id="sh">Share</button>' : '') +
    '</div>' +
    '<div class="card mini">The QR holds the details above as plain text (no link to your account), so it can go on a tag on the ' +
    plantWord +
    ' and be read by any phone. Records of what the ' +
    esc(W('block').toLowerCase()) +
    ' produced come from this app; a lot mixes the produce of the whole ' +
    esc(W('block').toLowerCase()) +
    ', not this one ' +
    plantWord +
    ' alone.</div>';
  $('#gj').onclick = () => {
    const F = {
      type: 'Feature',
      properties: {
        label: lab,
        number: n,
        row: r.name,
        kind: kindOf(r),
        block: c.b.name || '',
        farm: c.f.name || '',
        variety,
        planted,
        status: d.status || 'Healthy',
        note: d.note || '',
        history: d.log || [],
      },
      geometry: { type: 'Point', coordinates: [+p[1].toFixed(7), +p[0].toFixed(7)] },
    };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(F)], { type: 'application/geo+json' }));
    a.download = 'passport-' + lab + '.geojson';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 500);
  };
  if ($('#sh')) $('#sh').onclick = () => navigator.share({ title: lab, text: tag }).catch(() => {});
  // field log: entries for this plant first, then the block's and the farm's
  (async () => {
    const box = $('#fl');
    if (!(APP.modules || []).includes('fieldlog') || typeof API === 'undefined') return box.remove();
    let items = [];
    try {
      items = ((await API.get('/api/fieldlog')) || {}).items || [];
    } catch (e) {}
    items = items.filter(x => x.place_id === r.plotId || (c.f.id && x.place_id === c.f.id));
    const mine = items.filter(x => x.plant === lab),
      rest = items.filter(x => x.plant !== lab).slice(0, 15);
    const li = x =>
      '<div class="mini">' +
      esc(
        fmtDate(x.day) +
          ' · ' +
          (x.plant ? x.plant + ' · ' : '') +
          [x.kind2, x.product, x.issue, x.what, x.qty ? x.qty + ' ' + (x.unit || '') : '', x.status]
            .filter(Boolean)
            .join(' · ')
      ) +
      '</div>';
    box.innerHTML =
      '<b>Field log</b>' +
      (mine.length ? '<div class="mini"><b>This ' + plantWord + '</b></div>' + mine.map(li).join('') : '') +
      (rest.length
        ? '<div class="mini" style="margin-top:4px"><b>The ' +
          esc(W('block').toLowerCase()) +
          '</b></div>' +
          rest.map(li).join('')
        : '') +
      (items.length
        ? ''
        : '<div class="mini">Nothing logged for this ' +
          esc(W('block').toLowerCase()) +
          ' yet' +
          (signedOut() ? ' (sign in to see the field log)' : '') +
          '.</div>');
  })();
  (async () => {
    const box = $('#ds');
    const list = r.plotId ? await downstream(r.plotId) : [];
    if (!list.length)
      return (box.innerHTML =
        '<b>What its ' +
        esc(W('block').toLowerCase()) +
        ' produced</b><div class="mini">No harvests or lots linked to this ' +
        esc(W('block').toLowerCase()) +
        ' yet.</div>');
    const by = {};
    list.forEach(x => (by[x.type] = by[x.type] || []).push(x));
    box.innerHTML =
      '<b>What its ' +
      esc(W('block').toLowerCase()) +
      ' produced</b>' +
      Object.entries(by)
        .sort((a, b) => a[1][0].hop - b[1][0].hop)
        .map(
          ([t, xs]) =>
            '<div class="mini" style="margin-top:4px"><b>' +
            esc(typeWord(t)) +
            '</b> (' +
            xs.length +
            ')</div>' +
            xs
              .slice()
              .sort((a, b) => String(b.date || b.day || '').localeCompare(String(a.date || a.day || '')))
              .slice(0, 8)
              .map(
                x =>
                  '<div class="mini">' +
                  esc(
                    [x.name || x.code || x.lot || x.lotNo || '', x.date || x.day || '']
                      .filter(Boolean)
                      .join(' · ') || x.id
                  ) +
                  '</div>'
              )
              .join('')
        )
        .join('');
  })();
}
function route() {
  if (watch != null) {
    navigator.geolocation.clearWatch(watch);
    watch = null;
  }
  $('#view').oninput = null;
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^passport\/(.+)\/(\d+)$/))) return passportView(m[1], +m[2]);
  if (typeof L === 'undefined')
    return ($('#view').innerHTML =
      '<div class="card">The map needs a signal the first time. Open this page again when online.</div>');
  if (h === 'draw') return drawView();
  if (h === 'walk') return walkView();
  if (h === 'copy') return copyView();
  if ((m = h.match(/^trail\/?(.*)$/))) return trailView(m[1]);
  if ((m = h.match(/^row\/(.+)$/))) return rowView(m[1]);
  if ((m = h.match(/^plants\/(.+)$/))) return plantsView(m[1]);
  if ((m = h.match(/^plant\/(.+)\/(\d+)$/))) return plantView(m[1], +m[2]);
  listView();
}
window.addEventListener('hashchange', route);
route();
recordsSync().then(n => n && !location.hash && route());
