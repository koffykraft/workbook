<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Roastbook</title><style>:root{--bg:#f7f5f0;--ink:#171512;--muted:#77716a;--line:#ddd8d0;--coffee:#8d583b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;color:var(--ink);background:var(--bg)}.app{max-width:680px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center}.wordmark{display:block;width:150px;max-height:48px;object-fit:contain;object-position:left center}.headbrand{display:flex;flex-direction:column;gap:12px}.brand{font-size:11px;letter-spacing:.16em;color:var(--coffee);font-weight:750}h1{font-size:42px;letter-spacing:-.045em;margin:8px 0 20px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}input,select{padding:13px;border:1px solid var(--line);border-radius:13px;width:100%;background:#fff;font:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;margin:10px 0}.card b{font-size:20px}.meta{font-size:12px;color:var(--muted);margin-top:7px}.empty{color:var(--muted);margin-top:30px;padding:22px;border:1px dashed var(--line);border-radius:18px}.back{color:var(--ink);text-decoration:none}.card{cursor:pointer}.detail{display:none;background:#171512;color:#fff;border-radius:19px;padding:18px;margin:12px 0}.detail.open{display:block}.detail .meta{color:#c9c4bd}.detail button{margin-top:14px;border:0;border-radius:10px;padding:10px 12px;font-weight:700}</style></head><body><main class="app"><header><div class="headbrand"><img class="wordmark" src="koffykraft-wordmark.png" alt="Koffy Kraft"><div class="brand">ROASTBOOKS</div></div><a class="back" href="roastbooks.html">Back</a></header><h1>Roastbook</h1><button id="exportCsv" style="border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-weight:700">Export CSV</button><section class="filters"><input id="estate" placeholder="Estate"><input id="coffee" placeholder="Bean / coffee"><input id="date" type="date"><input id="type" placeholder="Roast type"></section><section id="detail" class="detail"></section><section id="list"></section></main><script>
const exportCsvBtn=document.getElementById('exportCsv'),estateInput=document.getElementById('estate'),coffeeInput=document.getElementById('coffee'),dateInput=document.getElementById('date'),typeInput=document.getElementById('type'),listEl=document.getElementById('list'),detailEl=document.getElementById('detail');
let roastRows=[];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openDB(){return new Promise((ok,no)=>{const req=indexedDB.open('KoffyKraftTemporaryRoastbook',1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('roasts'))db.createObjectStore('roasts',{keyPath:'id'});if(!db.objectStoreNames.contains('plans'))db.createObjectStore('plans',{keyPath:'id'})};req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
async function load(){try{const db=await openDB();roastRows=await new Promise((ok,no)=>{const tx=db.transaction('roasts','readonly'),q=tx.objectStore('roasts').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)});db.close()}catch(e){roastRows=[]}roastRows.sort((a,b)=>String(b.finishedAt||b.roastDate||'').localeCompare(String(a.finishedAt||a.roastDate||'')));draw()}
function showDetail(id){const r=roastRows.find(x=>x.id===id);if(!r)return;detailEl.innerHTML='<b>'+esc(r.estate||r.coffeeCode||'Roast')+'</b><div class="meta">'+[r.coffeeCode,r.roastNo,r.roastDate,r.targetColor,r.greenWeight&&r.greenWeight+' g',r.moisture&&r.moisture+'%'].filter(Boolean).map(esc).join(' · ')+'</div><div class="meta">'+((r.events||[]).length)+' events · '+(((r.readings||{}).exhaust||[]).length+((r.readings||{}).bean||[]).length)+' readings</div><button id="closeDetail">Close</button>';detailEl.classList.add('open');document.getElementById('closeDetail').onclick=()=>detailEl.classList.remove('open')}
function draw(){const e=estateInput.value.toLowerCase(),c=coffeeInput.value.toLowerCase(),d=dateInput.value,t=typeInput.value.toLowerCase();const a=roastRows.filter(r=>(!e||String(r.estate||'').toLowerCase().includes(e))&&(!c||String(r.coffeeCode||r.bean||'').toLowerCase().includes(c))&&(!d||String(r.roastDate||'').startsWith(d))&&(!t||String(r.roastType||r.targetColor||'').toLowerCase().includes(t)));listEl.innerHTML=a.length?a.map(r=>'<article class="card" data-id="'+esc(r.id)+'"><b>'+esc(r.estate||r.coffeeCode||'Roast')+'</b><div class="meta">'+[r.coffeeCode,r.roastNo,r.roastDate,r.targetColor].filter(Boolean).map(esc).join(' · ')+'</div></article>').join(''):'<div class="empty">No matching saved roasts.</div>';listEl.querySelectorAll('.card').forEach(x=>x.onclick=()=>showDetail(x.dataset.id))}
exportCsvBtn.onclick=()=>{const rows=[['Estate','Coffee code','Roast no','Date','Target','Green weight','Moisture','Finished'],...roastRows.map(r=>[r.estate||'',r.coffeeCode||'',r.roastNo||'',r.roastDate||'',r.targetColor||'',r.greenWeight||'',r.moisture||'',r.finishedAt||''])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='koffykraft-roastbook.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
[estateInput,coffeeInput,dateInput,typeInput].forEach(x=>x.addEventListener('input',draw));load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
