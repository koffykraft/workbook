<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Roastbook</title><style>:root{--bg:#f7f5f0;--ink:#171512;--muted:#77716a;--line:#ddd8d0;--coffee:#8d583b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;color:var(--ink);background:var(--bg)}.app{max-width:680px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center}.wordmark{display:block;width:150px;max-height:48px;object-fit:contain;object-position:left center}.headbrand{display:flex;flex-direction:column;gap:12px}.brand{font-size:11px;letter-spacing:.16em;color:var(--coffee);font-weight:750}h1{font-size:42px;letter-spacing:-.045em;margin:8px 0 20px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}input,select{padding:13px;border:1px solid var(--line);border-radius:13px;width:100%;background:#fff;font:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;margin:10px 0}.card b{font-size:20px}.meta{font-size:12px;color:var(--muted);margin-top:7px}.empty{color:var(--muted);margin-top:30px;padding:22px;border:1px dashed var(--line);border-radius:18px}.back{color:var(--ink);text-decoration:none}.card{cursor:pointer}.detail{display:none;background:#171512;color:#fff;border-radius:19px;padding:18px;margin:12px 0}.detail.open{display:block}.detail .meta{color:#c9c4bd}.detail button{margin-top:14px;border:0;border-radius:10px;padding:10px 12px;font-weight:700}</style></head><body><main class="app"><header><div class="headbrand"><img class="wordmark" src="koffykraft-wordmark.png" alt="Koffy Kraft"><div class="brand">ROASTBOOKS</div></div><a class="back" href="roastbooks.html">Back</a></header><h1>Roastbook</h1><div id="auth" style="margin:14px 0;padding:12px;background:#f0e8dc;border-radius:11px;text-align:center;display:none"><small id="authMsg"></small></div><button id="exportCsv" style="border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-weight:700">Export CSV</button><section class="filters"><input id="estate" placeholder="Estate"><input id="coffee" placeholder="Bean / coffee"><input id="date" type="date"><input id="type" placeholder="Roast type"></section><section id="detail" class="detail"></section><section id="list"></section></main><script src="sync.js"></script><script>
const exportCsvBtn=document.getElementById('exportCsv'),estateInput=document.getElementById('estate'),coffeeInput=document.getElementById('coffee'),dateInput=document.getElementById('date'),typeInput=document.getElementById('type'),listEl=document.getElementById('list'),detailEl=document.getElementById('detail'),authDiv=document.getElementById('auth'),authMsg=document.getElementById('authMsg');
let roastRows=[];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openDB(){return new Promise((ok,no)=>{const req=indexedDB.open('KoffyKraftTemporaryRoastbook',1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('roasts'))db.createObjectStore('roasts',{keyPath:'id'});if(!db.objectStoreNames.contains('plans'))db.createObjectStore('plans',{keyPath:'id'})};req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
async function loadLocal(){try{const db=await openDB();const local=await new Promise((ok,no)=>{const tx=db.transaction('roasts','readonly'),q=tx.objectStore('roasts').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)});db.close();return local}catch(e){return[]}}
async function loadCloud(){if(!SYNC.isAuthenticated())return[];const result=await SYNC.loadRoasts();if(result.error||!result.items)return[];return result.items.map(r=>({id:r.id,roastDate:r.roast_date,roastNo:r.roast_no,estate:r.notes||'',coffeeCode:r.object_id||'',targetColor:r.target_color,greenWeight:r.green_weight,moisture:r.moisture,finishedAt:r.created_at}))}
async function load(){const cloud=await loadCloud();const local=await loadLocal();const merged=new Map();local.forEach(r=>merged.set(r.id,r));cloud.forEach(r=>merged.set(r.id,r));roastRows=Array.from(merged.values());roastRows.sort((a,b)=>String(b.finishedAt||b.roastDate||'').localeCompare(String(a.finishedAt||a.roastDate||'')));if(SYNC.isAuthenticated()){const email=SYNC.getUserEmail();authDiv.style.display='block';authMsg.textContent=`Synced as ${email} · ${roastRows.length} roasts`}draw()}
function showDetail(id){const r=roastRows.find(x=>x.id===id);if(!r)return;const title=r.estate||r.coffeeCode||r.bean||'(Untitled roast)';const meta=[r.roastNo?'Roast #'+r.roastNo:'',r.roastDate||'',r.targetColor||''].filter(Boolean);const specs=[r.greenWeight?'Green: '+r.greenWeight+'g':'',r.moisture?'Moisture: '+r.moisture+'%':'',r.chargeTemp?'Charge: '+r.chargeTemp+'°C':''].filter(Boolean);const readings=r.readings||{};const etCount=(readings.exhaust||[]).length;const btCount=(readings.bean||[]).length;detailEl.innerHTML='<b>'+esc(title)+'</b><div class="meta">'+esc(meta.join(' · '))+'</div><div class="meta">'+esc(specs.join(' · '))+'</div><div class="meta" style="margin-top:12px;font-size:11px;color:#888">'+(r.events||[]).length+' events · '+etCount+' ET readings · '+btCount+' BT readings<br>Saved: '+new Date(r.finishedAt||r.roastDate).toLocaleString()+'</div><button id="closeDetail" style="margin-top:14px;padding:10px 12px;border:none;border-radius:8px;background:#171512;color:white;cursor:pointer">Close</button>';detailEl.classList.add('open');document.getElementById('closeDetail').onclick=()=>detailEl.classList.remove('open')}
function draw(){const e=estateInput.value.toLowerCase(),c=coffeeInput.value.toLowerCase(),d=dateInput.value,t=typeInput.value.toLowerCase();const a=roastRows.filter(r=>(!e||String(r.estate||'').toLowerCase().includes(e))&&(!c||String(r.coffeeCode||r.bean||'').toLowerCase().includes(c))&&(!d||String(r.roastDate||'').startsWith(d))&&(!t||String(r.roastType||r.targetColor||'').toLowerCase().includes(t)));if(!a.length){listEl.innerHTML='<div class="empty">No matching saved roasts.</div>';return}listEl.innerHTML=a.map(r=>{const title=r.estate||r.coffeeCode||r.bean||'(Untitled roast)';const meta=[r.roastNo?'#'+r.roastNo:'',r.roastDate||'',r.targetColor||'',r.moisture?r.moisture+'% moisture':'',r.greenWeight?r.greenWeight+'g green':''].filter(Boolean);return '<article class="card" data-id="'+esc(r.id)+'"><b>'+esc(title)+'</b><div class="meta">'+esc(meta.join(' · '))+'</div><small style="color:#999">'+esc(new Date(r.finishedAt||r.roastDate).toLocaleString())+'</small></article>'}).join('');listEl.querySelectorAll('.card').forEach(x=>x.onclick=()=>showDetail(x.dataset.id))}
exportCsvBtn.onclick=()=>{const rows=[['Estate','Coffee code','Roast no','Date','Target','Green weight','Moisture','Finished'],...roastRows.map(r=>[r.estate||'',r.coffeeCode||'',r.roastNo||'',r.roastDate||'',r.targetColor||'',r.greenWeight||'',r.moisture||'',r.finishedAt||''])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.href=url;a.download='koffykraft-roastbook.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
[estateInput,coffeeInput,dateInput,typeInput].forEach(x=>x.addEventListener('input',draw));load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
