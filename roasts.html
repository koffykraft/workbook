<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="KoffyKraft"><meta name="apple-mobile-web-app-capable" content="yes"><title>KoffyKraft Roastbook</title><style>:root{--bg:#f7f5f0;--ink:#171512;--muted:#77716a;--line:#ddd8d0;--coffee:#8d583b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;color:var(--ink);background:var(--bg)}.app{max-width:680px;margin:auto;padding:24px 16px 60px}header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}.headbrand{display:flex;flex-direction:column;gap:8px;flex:1}.wordmark{display:block;height:40px;object-fit:contain;object-position:left center}@media(min-width:480px){.wordmark{height:44px}}.brand{font-size:10px;letter-spacing:.14em;color:var(--coffee);font-weight:750;margin-top:2px}h1{font-size:32px;letter-spacing:-.04em;margin:6px 0 16px;line-height:1.2}@media(min-width:480px){h1{font-size:42px;margin:8px 0 20px}}.back{color:var(--ink);text-decoration:none;font-size:14px;padding:8px 0}#auth{margin:12px 0;padding:11px;background:#f0e8dc;border-radius:11px;text-align:center;font-size:13px;display:none}button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:13px}button:active{background:#faf8f4}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}input{padding:12px;border:1px solid var(--line);border-radius:12px;width:100%;background:#fff;font:inherit;font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0;cursor:pointer;transition:background 0.15s;user-select:none}.card:active{background:#faf8f4}.card b{font-size:18px;display:block}.meta{font-size:12px;color:var(--muted);margin-top:6px}.empty{color:var(--muted);margin-top:24px;padding:20px;border:1px dashed var(--line);border-radius:16px;font-size:13px}.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:none;z-index:100;padding:16px}.detail-overlay.open{display:flex;align-items:flex-end}.detail{background:#fff;color:var(--ink);border-radius:18px 18px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:18px 18px 28px;box-shadow:0 -6px 24px rgba(0,0,0,.18)}@media(min-width:480px){.detail-overlay.open{align-items:center}.detail{border-radius:20px;max-width:640px;max-height:86vh;margin:0 auto}}.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detail b{display:block;font-size:22px;letter-spacing:-.02em}.detail .meta{color:var(--muted);font-size:13px;margin-top:4px}.close{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;padding:0;font-size:14px;flex-shrink:0}.detail h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--coffee);margin:20px 0 8px}.curve{width:100%;height:auto;display:block}.curve .gl{stroke:#eee7de;stroke-width:1}.curve .ax{fill:#8a837b;font-size:11px}.curve .evl{stroke:#c9bfb2;stroke-dasharray:3 3}.curve path{fill:none;stroke-width:2.2;stroke-linejoin:round}.curve .bt{stroke:#8d583b}.curve .et{stroke:#9aa4ad}.legend{font-size:12px;color:var(--muted);margin-top:6px}.legend .k{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin:0 5px 0 8px}.legend .k.bt{background:#8d583b;margin-left:0}.legend .k.et{background:#9aa4ad}table.ev{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}table.ev th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}table.ev td{padding:8px 4px;border-bottom:1px solid #f0ebe4}.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}.facts dt{color:var(--muted)}.facts dd{margin:0;font-variant-numeric:tabular-nums}.nodata{font-size:13px;color:var(--muted);padding:10px 0}.saved{margin-top:18px;font-size:12px;color:var(--muted)}.exports{display:flex;gap:8px;flex-wrap:wrap}.dactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}</style></head><body><main class="app"><header style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd;margin-bottom:20px;gap:12px"><span style="font-size:18px;font-weight:300;letter-spacing:1px;color:#111">Koffy Kraft</span><nav style="display:flex;gap:12px;font-size:13px;flex:1;justify-content:center"><a href="roast-timer-v14.html" style="text-decoration:none;color:#111">Timer</a><a href="roast-graph.html" style="text-decoration:none;color:#111">Graph</a><a href="roasts.html" style="text-decoration:none;color:#111">Roastbook</a><a href="account.html" style="text-decoration:none;color:#111">Account</a></nav><a href="account.html" style="width:40px;height:40px;border:1px solid #ddd;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:18px;flex-shrink:0">👤</a></header><h1>Roastbook</h1><div id="auth"><small id="authMsg"></small></div><div class="exports"><button id="exportCsv">Export CSV</button><button id="exportJson">Full backup (JSON)</button></div><section class="filters"><input id="estate" placeholder="Estate"><input id="coffee" placeholder="Bean / coffee"><input id="date" type="date"><input id="type" placeholder="Roast type"></section><section id="list"></section><div id="detailOverlay" class="detail-overlay"><div id="detail" class="detail"></div></div></main><script src="sync.js"></script><script>
const exportCsvBtn=document.getElementById('exportCsv'),estateInput=document.getElementById('estate'),coffeeInput=document.getElementById('coffee'),dateInput=document.getElementById('date'),typeInput=document.getElementById('type'),listEl=document.getElementById('list'),detailEl=document.getElementById('detail'),detailOverlay=document.getElementById('detailOverlay'),authDiv=document.getElementById('auth'),authMsg=document.getElementById('authMsg');
let roastRows=[];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openDB(){return new Promise((ok,no)=>{const req=indexedDB.open('KoffyKraftTemporaryRoastbook',2);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('roasts'))db.createObjectStore('roasts',{keyPath:'id'});if(!db.objectStoreNames.contains('plans'))db.createObjectStore('plans',{keyPath:'id'})};req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
async function loadLocal(){try{const db=await openDB();const local=await new Promise((ok,no)=>{const tx=db.transaction('roasts','readonly'),q=tx.objectStore('roasts').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)});db.close();return local}catch(e){return[]}}
async function loadCloud(){if(!SYNC.isAuthenticated())return[];const result=await SYNC.loadRoasts();if(result.error||!result.items)return[];const pj=(v,d)=>{if(v==null||v==='')return d;if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return d}};return result.items.map(r=>{let n=pj(r.notes,null);if(!n||typeof n!=='object')n={bean:r.notes||'',coffeeCode:r.notes||''};return {id:r.id,roastDate:r.roast_date,roastNo:r.roast_number,estate:n.estate||'',coffeeCode:n.coffeeCode||'',bean:n.bean||'',notes:n.notes||'',roasteryName:n.roasteryName||'',machineName:n.machineName||'',unit:n.unit||'C',elapsed:n.elapsed,targetColor:r.target_color,finalColor:r.final_color,greenWeight:r.green_weight,roastedWeight:r.roasted_weight,moisture:r.moisture,chargeTemp:r.charge_temperature,finishedAt:n.finishedAt||r.ended_at||(r.created_at?String(r.created_at).replace(' ','T')+'Z':''),events:pj(r.events_json,[]),readings:pj(r.readings_json,{exhaust:[],bean:[]}),cloud:true}})}
async function load(){console.log('[KoffyKraft] Loading roasts...');const cloud=await loadCloud();const local=await loadLocal();console.log('[KoffyKraft] Cloud roasts:',cloud.length,'Local roasts:',local.length);const merged=new Map();local.forEach(r=>merged.set(r.id,r));cloud.forEach(r=>merged.set(r.id,r));roastRows=Array.from(merged.values());console.log('[KoffyKraft] Total merged roasts:',roastRows.length);console.log('[KoffyKraft] Roast IDs:',roastRows.map(r=>({id:r.id,type:typeof r.id})));roastRows.sort((a,b)=>String(b.finishedAt||b.roastDate||'').localeCompare(String(a.finishedAt||a.roastDate||'')));if(SYNC.isAuthenticated()){const email=SYNC.getUserEmail();authDiv.style.display='block';authMsg.textContent=`Synced as ${email} · ${roastRows.length} roasts`}draw()}
function mmss(t){t=Math.round(Number(t)||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:null}
function curveSvg(rd,ev){const bt=(rd.bean||[]).filter(p=>num(p.temp)!=null),et=(rd.exhaust||[]).filter(p=>num(p.temp)!=null);const all=bt.concat(et);if(!all.length)return '<div class="nodata">No temperature readings recorded.</div>';const W=600,H=220,L=36,R=10,T=10,B=24;const tmax=Math.max(60,...all.map(p=>num(p.time)||0),...(ev||[]).map(e=>num(e.time)||0));const vs=all.map(p=>num(p.temp));let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<20){hi+=10;lo-=10}lo=Math.floor(lo/10)*10;hi=Math.ceil(hi/10)*10;const x=t=>L+(W-L-R)*(num(t)||0)/tmax,y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));const path=a=>a.length?'M'+a.map(p=>x(p.time).toFixed(1)+','+y(num(p.temp)).toFixed(1)).join('L'):'';let g='';for(let v=lo;v<=hi;v+=Math.max(10,Math.round((hi-lo)/40)*10)){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="gl"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" class="ax" text-anchor="end">'+v+'</text>'}for(let t=0;t<=tmax;t+=60){g+='<text x="'+x(t)+'" y="'+(H-6)+'" class="ax" text-anchor="middle">'+Math.round(t/60)+'</text>'}const marks=(ev||[]).map(e=>'<line x1="'+x(e.time)+'" x2="'+x(e.time)+'" y1="'+T+'" y2="'+(H-B)+'" class="evl"/>').join('');return '<svg viewBox="0 0 '+W+' '+H+'" class="curve" role="img" aria-label="Roast curve">'+g+marks+'<path d="'+path(et)+'" class="et"/><path d="'+path(bt)+'" class="bt"/></svg><div class="legend"><span class="k bt"></span>Bean '+bt.length+' readings <span class="k et"></span>Exhaust '+et.length+' readings · minutes</div>'}
function showDetail(id){const r=roastRows.find(x=>String(x.id)===String(id));if(!r)return;const u='°'+(r.unit||'C');const title=r.estate||r.coffeeCode||r.bean||'(Untitled roast)';const events=(Array.isArray(r.events)?r.events:Object.values(r.events||{})).slice().sort((a,b)=>(num(a.time)||0)-(num(b.time)||0));const rd=r.readings||{};const gw=num(r.greenWeight),rw=num(r.roastedWeight);const loss=gw&&rw?((gw-rw)/gw*100).toFixed(1)+'%':null;const dur=num(r.elapsed)||(events.length?num(events[events.length-1].time):null);const facts=[['Estate',r.estate],['Coffee',r.coffeeCode],['Notes',r.notes||(r.bean!==r.coffeeCode?r.bean:'')],['Roast no',r.roastNo],['Date',r.roastDate],['Roastery',r.roasteryName],['Machine',r.machineName],['Green weight',gw!=null?gw+' g':''],['Roasted weight',rw!=null?rw+' g':''],['Weight loss',loss],['Moisture',num(r.moisture)!=null?r.moisture+'%':''],['Charge temp',num(r.chargeTemp)!=null?r.chargeTemp+u:''],['Target colour',r.targetColor],['Final colour',r.finalColor],['Duration',dur?mmss(dur):'']].filter(f=>f[1]!=null&&String(f[1]).trim()!=='');const evRows=events.length?'<table class="ev"><thead><tr><th>Event</th><th>Time</th><th>Bean</th><th>Exhaust</th></tr></thead><tbody>'+events.map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+mmss(e.time)+'</td><td>'+(num(e.bean)!=null?esc(e.bean)+u:'–')+'</td><td>'+(num(e.exhaust)!=null?esc(e.exhaust)+u:'–')+'</td></tr>').join('')+'</tbody></table>':'<div class="nodata">No events marked.</div>';detailEl.innerHTML='<div class="dhead"><div><b>'+esc(title)+'</b><div class="meta">'+esc([r.roastNo?'Roast #'+r.roastNo:'',r.roastDate||''].filter(Boolean).join(' · '))+'</div></div><button class="close" aria-label="Close">✕</button></div><h3>Curve</h3>'+curveSvg(rd,events)+'<h3>Events</h3>'+evRows+'<h3>Details</h3><dl class="facts">'+facts.map(f=>'<dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd>').join('')+'</dl><div class="dactions"><button class="dl-csv">Download this roast (CSV)</button></div><div class="saved">Saved '+esc(new Date(r.finishedAt||r.roastDate).toLocaleString())+(r.cloud?' · cloud':' · this device')+'</div>';detailEl.querySelector('.close').onclick=closeDetail;detailEl.querySelector('.dl-csv').onclick=()=>exportRoastCsv(r);detailOverlay.classList.add('open')}
function closeDetail(){detailOverlay.classList.remove('open')}
function attachCardHandlers(){console.log('[KoffyKraft] Attaching card handlers...');const cards=listEl.querySelectorAll('.card');console.log('[KoffyKraft] Found',cards.length,'cards');cards.forEach((card,idx)=>{const cardId=card.getAttribute('data-id');console.log('[KoffyKraft] Card',idx,'has data-id:',cardId);card.addEventListener('click',(e)=>{console.log('[KoffyKraft] Card click detected on card with ID:',cardId);e.preventDefault();e.stopPropagation();showDetail(cardId);return false},{passive:false})})}
function draw(){const e=estateInput.value.toLowerCase(),c=coffeeInput.value.toLowerCase(),d=dateInput.value,t=typeInput.value.toLowerCase();const a=roastRows.filter(r=>(!e||String(r.estate||'').toLowerCase().includes(e))&&(!c||String(r.coffeeCode||r.bean||'').toLowerCase().includes(c))&&(!d||String(r.roastDate||'').startsWith(d))&&(!t||String(r.roastType||r.targetColor||'').toLowerCase().includes(t)));if(!a.length){listEl.innerHTML='<div class="empty">No matching saved roasts.</div>';return}listEl.innerHTML=a.map(r=>{const title=r.estate||r.coffeeCode||r.bean||'(Untitled roast)';const dt=new Date(r.finishedAt||r.roastDate);const dateStr=dt.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})+', '+dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});const meta=[r.roastNo?'#'+r.roastNo:'',r.targetColor||'',r.moisture?r.moisture+'%':'',r.greenWeight?r.greenWeight+'g':''].filter(Boolean).join(' · ');return '<article class="card" data-id="'+esc(r.id)+'"><b>'+esc(title)+'</b><div class="meta">'+esc(meta)+'<br><small>'+esc(dateStr)+'</small></div></article>'}).join('');attachCardHandlers()}
function csvOf(rows){return rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([type==='text/csv'?'\ufeff'+text:text],{type:type+';charset=utf-8'}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function evList(r){return(Array.isArray(r.events)?r.events:Object.values(r.events||{})).slice().sort((a,b)=>(num(a.time)||0)-(num(b.time)||0))}
function evAt(r,re){const e=evList(r).find(x=>re.test(String(x.name||'')));return e?mmss(e.time):''}
function summary(r){const gw=num(r.greenWeight),rw=num(r.roastedWeight),ev=evList(r),rd=r.readings||{};const dur=num(r.elapsed)||(ev.length?num(ev[ev.length-1].time):null);return{gw,rw,loss:gw&&rw?((gw-rw)/gw*100).toFixed(1):'',dur:dur?mmss(dur):'',bt:(rd.bean||[]).length,et:(rd.exhaust||[]).length,ev}}
function slug(s){return String(s||'roast').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'roast'}
exportCsvBtn.onclick=()=>{const head=['Roast ID','Date','Roast no','Estate','Coffee code','Notes','Roastery','Machine','Green weight g','Roasted weight g','Weight loss %','Moisture %','Charge temp','Unit','Target colour','Final colour','Duration','Turning point','Yellowing','First crack','Second crack','Drop','Events','Bean readings','Exhaust readings','Saved','Where'];const rows=roastRows.map(r=>{const s=summary(r);return[r.id,r.roastDate,r.roastNo,r.estate,r.coffeeCode,r.notes||r.bean,r.roasteryName,r.machineName,s.gw??'',s.rw??'',s.loss,r.moisture,r.chargeTemp,r.unit||'C',r.targetColor,r.finalColor,s.dur,evAt(r,/turn/i),evAt(r,/yellow|dry/i),evAt(r,/first|1st|\bfc\b/i),evAt(r,/second|2nd|\bsc\b/i),evAt(r,/drop|end/i),s.ev.length,s.bt,s.et,r.finishedAt,r.cloud?'cloud':'this device']});download('koffykraft-roastbook-'+new Date().toISOString().slice(0,10)+'.csv',csvOf([head,...rows]),'text/csv')};
document.getElementById('exportJson').onclick=()=>{const data={app:'KoffyKraft Roastbook',format:1,exportedAt:new Date().toISOString(),roasts:roastRows.map(r=>{const{cloud,...rest}=r;return rest})};download('koffykraft-roastbook-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json')};
function exportRoastCsv(r){const u=r.unit||'C',rd=r.readings||{},ev=evList(r);const times=new Map();const put=(t,k,v)=>{t=Math.round(num(t)||0);if(!times.has(t))times.set(t,{t});const o=times.get(t);o[k]=o[k]!=null&&k==='ev'?o[k]+' / '+v:v};(rd.bean||[]).forEach(p=>put(p.time,'bt',p.temp));(rd.exhaust||[]).forEach(p=>put(p.time,'et',p.temp));ev.forEach(e=>put(e.time,'ev',e.name));const rows=[['Time','Seconds','Bean °'+u,'Exhaust °'+u,'Event'],...[...times.values()].sort((a,b)=>a.t-b.t).map(x=>[mmss(x.t),x.t,x.bt??'',x.et??'',x.ev??''])];const meta=[['Estate',r.estate],['Coffee',r.coffeeCode],['Notes',r.notes||r.bean],['Date',r.roastDate],['Roast no',r.roastNo],['Machine',r.machineName],['Green weight g',r.greenWeight],['Roasted weight g',r.roastedWeight],['Moisture %',r.moisture],['Charge temp',r.chargeTemp],['Target colour',r.targetColor],['Final colour',r.finalColor],[]];download(slug((r.estate||r.coffeeCode||'roast')+'-'+(r.roastDate||'')+'-'+(r.roastNo||''))+'.csv',csvOf([...meta,...rows]),'text/csv')}
detailOverlay.onclick=e=>{if(e.target===detailOverlay)closeDetail()};
[estateInput,coffeeInput,dateInput,typeInput].forEach(x=>x.addEventListener('input',draw));console.log('[KoffyKraft] Starting app...');load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
