function draw(){const e=estateInput.value.toLowerCase(),c=coffeeInput.value.toLowerCase(),d=dateInput.value,t=typeInput.value.toLowerCase();const a=roastRows.filter(r=>(!e||String(r.estate||'').toLowerCase().includes(e))&&(!c||String(r.coffeeCode||r.bean||'').toLowerCase().includes(c))&&(!d||String(r.roastDate||'').startsWith(d))&&(!t||String(r.roastType||r.targetColor||'').toLowerCase().includes(t)));if(!a.length){listEl.innerHTML='<div class="empty">No matching saved roasts.</div>';return}listEl.innerHTML=a.map(r=>{const title=r.estate||r.coffeeCode||r.bean||'(Untitled roast)';const dt=new Date(r.finishedAt||r.roastDate);const dateStr=dt.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})+', '+dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});const meta=[r.roastNo?'#'+r.roastNo:'',r.targetColor||'',r.moisture?r.moisture+'%':'',r.greenWeight?r.greenWeight+'g':''].filter(Boolean).join(' · ');return '<article class="card" data-id="'+esc(r.id)+'"><b>'+esc(title)+'</b><span class="loc'+(r.cloud?' in':'')+'">'+(r.cloud?'In cloud':'This phone')+'</span><div class="meta">'+esc(meta)+'<br><small>'+esc(dateStr)+'</small></div></article>'}).join('');attachCardHandlers()}
function csvOf(rows){return rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([type==='text/csv'?'\ufeff'+text:text],{type:type+';charset=utf-8'}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function evList(r){return(Array.isArray(r.events)?r.events:Object.values(r.events||{})).slice().sort((a,b)=>(num(a.time)||0)-(num(b.time)||0))}

function exportRoastCsv(r){const u=r.unit||'C',rd=r.readings||{},ev=evList(r);const times=new Map();const put=(t,k,v)=>{t=Math.round(num(t)||0);if(!times.has(t))times.set(t,{t});const o=times.get(t);o[k]=o[k]!=null&&k==='ev'?o[k]+' / '+v:v};(rd.bean||[]).forEach(p=>put(p.time,'bt',p.temp));(rd.exhaust||[]).forEach(p=>put(p.time,'et',p.temp));ev.forEach(e=>put(e.time,'ev',e.name));const rows=[['Time','Seconds','Bean °'+u,'Exhaust °'+u,'Event'],...[...times.values()].sort((a,b)=>a.t-b.t).map(x=>[mmss(x.t),x.t,x.bt??'',x.et??'',x.ev??''])];const meta=[['Estate',r.estate],['Coffee',r.coffeeCode],['Notes',r.notes||r.bean],['Date',r.roastDate],['Roast no',r.roastNo],['Machine',r.machineName],['Green weight g',r.greenWeight],['Roasted weight g',r.roastedWeight],['Moisture %',r.moisture],['Charge temp',r.chargeTemp],['Target colour',r.targetColor],['Final colour',r.finalColor],[]];download(slug((r.estate||r.coffeeCode||'roast')+'-'+(r.roastDate||'')+'-'+(r.roastNo||''))+'.csv',csvOf([...meta,...rows]),'text/csv')}
function pyLit(v){if(v===null||v===undefined)return 'None';if(v===true)return 'True';if(v===false)return 'False';if(typeof v==='number')return Number.isFinite(v)?String(v):'-1';if(typeof v==='string')return "'"+v.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n').replace(/\t/g,'\\t')+"'";if(Array.isArray(v))return '['+v.map(pyLit).join(', ')+']';if(v.__float!==undefined){const n=v.__float;return Number.isInteger(n)?n.toFixed(1):String(n)}return '{'+Object.keys(v).filter(k=>v[k]!==undefined).map(k=>pyLit(k)+': '+pyLit(v[k])).join(', ')+'}'}

function artisanProfile(r){const rd=r.readings||{},ev=r.events||[];const okT=p=>num(p.temp)!=null;const beanN=(rd.bean||[]).filter(okT).length,etN=(rd.exhaust||[]).filter(okT).length;const exAsBean=beanN<3&&etN>=3;

 const list=[...rows.values()].sort((a,b)=>a.t-b.t);if(exAsBean)list.forEach(x=>{if(x.bt===-1)x.bt=x.et});const idx=t=>list.findIndex(x=>x.t===key(t));
 const ti=[0,0,0,0,0,0,0,0];const slot=[[/yellow|dry/i,1],[/first|1st|\bfc\b/i,2],[/second|2nd|\bsc\b/i,4],[/drop/i,6]];const se=[],seStr=[];
 ev.forEach(e=>{const name=String(e.name||'');if(/turn/i.test(name))return;const s=slot.find(([re])=>re.test(name));if(s&&!ti[s[1]]){ti[s[1]]=idx(e.time);return}se.push(idx(e.time));seStr.push(name)});ti[0]=idx(0);
 const fin=r.finishedAt?new Date(r.finishedAt):null;const start=fin&&r.elapsed?new Date(fin.getTime()-r.elapsed*1000):fin;const d=start&&!isNaN(start)?start:null;const pad=n=>String(n).padStart(2,'0');const iso=r.roastDate||(d?d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()):'');
 const notes=[r.notes||(r.bean!==r.coffeeCode?r.bean:''),r.targetColor?'Target colour: '+r.targetColor:'',r.finalColor?'Final colour: '+r.finalColor:'',r.estate?'Estate: '+r.estate:'',exAsBean?'Exhaust-only roast: the exhaust readings are also written as the bean (BT) curve so phases and DTR can be calculated.':'','Exported from KoffyKraft Roastbook'].filter(Boolean).join('\n');
 const gw=num(r.greenWeight)||0,rw=num(r.roastedWeight)||0;const A=analyze(r);

 if(A.fc&&A.rorAt(A.fc.time)!=null)c.fcs_ror=F(A.rorAt(A.fc.time));if(A.loss!=null)c.weight_loss=F(A.loss);if(gw)c.weightin=F(gw);if(rw)c.weightout=F(rw);if(num(r.moisture)!=null)c.moisture_greens=F(num(r.moisture));
 const p={recording_version:'KoffyKraft Roastbook',mode:(r.unit||'C')==='F'?'F':'C',title:[r.estate,r.coffeeCode].filter(Boolean).join(' ')||'KoffyKraft roast',beans:[r.estate,r.coffeeCode,r.notes||''].filter(Boolean).join(', '),weight:[F(gw),F(rw),'g'],roastertype:r.machineName||'',organization:r.roasteryName||'',roastingnotes:notes,cuppingnotes:'',roastisodate:iso,roasttime:d?pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()):'00:00:00',roastepoch:d?Math.floor(d.getTime()/1000):0,roastbatchnr:parseInt(r.roastNo,10)||0,timeindex:ti,timex:list.map(x=>F(x.t)),temp1:list.map(x=>F(x.et)),temp2:list.map(x=>F(x.bt)),specialevents:se,specialeventstype:se.map(()=>4),specialeventsvalue:se.map(()=>F(0)),specialeventsStrings:seStr,etypes:['Air','Drum','Damper','Burner','--'],moisture_greens:num(r.moisture)!=null?F(num(r.moisture)):undefined,computed:c};
 return{p,exAsBean}}
