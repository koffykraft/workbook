<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Roastbook</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}.app{max-width:620px;margin:auto;padding:24px 16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}input,select{padding:11px;border:1px solid #ddd;border-radius:10px;width:100%}.card{border:1px solid #ddd;border-radius:14px;padding:14px;margin:8px 0}.meta{font-size:12px;color:#777}.empty{color:#777;margin-top:30px}</style></head><body><main class="app"><header><h1>Roastbook</h1><a href="index.html">KoffyKraft</a></header><section class="filters"><input id="estate" placeholder="Estate"><input id="coffee" placeholder="Bean / coffee"><input id="date" type="date"><input id="type" placeholder="Roast type"></section><section id="list"></section></main><script>async function load(){let rows=[];try{const req=indexedDB.open('KoffyKraftTemporaryRoastbook',1);const db=await new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)});rows=await new Promise((ok,no)=>{const tx=db.transaction('roasts','readonly'),q=tx.objectStore('roasts').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}catch(e){}window.rows=rows;draw()}function draw(){const e=estate.value.toLowerCase(),c=coffee.value.toLowerCase(),d=date.value,t=type.value.toLowerCase();const a=(window.rows||[]).filter(r=>(!e||String(r.estate||'').toLowerCase().includes(e))&&(!c||String(r.coffeeCode||r.bean||'').toLowerCase().includes(c))&&(!d||String(r.roastDate||'').startsWith(d))&&(!t||String(r.roastType||r.targetColor||'').toLowerCase().includes(t)));list.innerHTML=a.length?a.map(r=>'<article class="card"><b>'+(r.estate||r.coffeeCode||'Roast')+'</b><div class="meta">'+[r.coffeeCode,r.roastNo,r.roastDate,r.targetColor].filter(Boolean).join(' · ')+'</div></article>').join(''):'<div class="empty">No matching saved roasts.</div>'}document.querySelectorAll('input').forEach(x=>x.oninput=draw);load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
