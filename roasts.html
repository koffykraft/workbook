<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><link rel="manifest" href="manifest.webmanifest"><title>KoffyKraft Roastbook</title><style>:root{--bg:#f7f5f0;--ink:#171512;--muted:#77716a;--line:#ddd8d0;--coffee:#8d583b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;color:var(--ink);background:var(--bg)}.app{max-width:680px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center}.wordmark{display:block;width:150px;max-height:48px;object-fit:contain;object-position:left center}.headbrand{display:flex;flex-direction:column;gap:12px}.brand{font-size:11px;letter-spacing:.16em;color:var(--coffee);font-weight:750}h1{font-size:42px;letter-spacing:-.045em;margin:8px 0 20px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}input,select{padding:13px;border:1px solid var(--line);border-radius:13px;width:100%;background:#fff;font:inherit}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;margin:10px 0}.card b{font-size:20px}.meta{font-size:12px;color:var(--muted);margin-top:7px}.empty{color:var(--muted);margin-top:30px;padding:22px;border:1px dashed var(--line);border-radius:18px}.back{color:var(--ink);text-decoration:none}</style></head><body><main class="app"><header><div class="headbrand"><img class="wordmark" src="koffykraft-wordmark.png" alt="Koffy Kraft"><div class="brand">ROASTBOOKS</div></div><a class="back" href="roastbooks.html">Back</a></header><h1>Roastbook</h1><section class="filters"><input id="estate" placeholder="Estate"><input id="coffee" placeholder="Bean / coffee"><input id="date" type="date"><input id="type" placeholder="Roast type"></section><section id="list"></section></main><script>async function load(){let rows=[];try{const req=indexedDB.open('KoffyKraftTemporaryRoastbook',1);const db=await new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)});rows=await new Promise((ok,no)=>{const tx=db.transaction('roasts','readonly'),q=tx.objectStore('roasts').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}catch(e){}window.rows=rows;draw()}function draw(){const e=estate.value.toLowerCase(),c=coffee.value.toLowerCase(),d=date.value,t=type.value.toLowerCase();const a=(window.rows||[]).filter(r=>(!e||String(r.estate||'').toLowerCase().includes(e))&&(!c||String(r.coffeeCode||r.bean||'').toLowerCase().includes(c))&&(!d||String(r.roastDate||'').startsWith(d))&&(!t||String(r.roastType||r.targetColor||'').toLowerCase().includes(t)));list.innerHTML=a.length?a.map(r=>'<article class="card"><b>'+(r.estate||r.coffeeCode||'Roast')+'</b><div class="meta">'+[r.coffeeCode,r.roastNo,r.roastDate,r.targetColor].filter(Boolean).join(' · ')+'</div></article>').join(''):'<div class="empty">No matching saved roasts.</div>'}document.querySelectorAll('input').forEach(x=>x.oninput=draw);load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
