name: Production smoke check
# Checks the live app after each push (workers.dev address; the custom domain blocks GitHub runners as bots). Fails (and emails) only if a page or the API is down.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy
        run: sleep 60
      - name: Check live app
        shell: bash
        run: |
          BASE="https://roast.tagroos.workers.dev"
          fail=0
          for p in "" roastbooks.html origin.html roast-timer-v14.html roast-graph.html roasts.html cup.html water.html account.html license.html sw.js; do
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 "$BASE/$p")
            echo "/$p $code"
            [ "$code" = "200" ] || fail=1
          done
          status=$(curl -sS --retry 3 --retry-delay 5 "$BASE/api/status")
          echo "api/status $status"
          echo "$status" | grep -q '"ok":true' || fail=1
          echo "$status" | grep -q '"database":true' || fail=1
          exit $fail
