<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KoffyKraft Roastbook</title><style>:root{--bg:#f4f0e8;--card:#fffaf3;--ink:#211c17;--muted:#746c63;--line:#d8cec2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding:20px 14px 70px}h1{margin:.15em 0}.sub,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;gap:22px;align-items:center}.stat{font-size:1.7rem;font-weight:700}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;background:#211c17;color:white}.ghost{background:#ece4da;color:var(--ink)}.item{padding:10px 0;border-top:1px solid var(--line)}a{color:#8b4b2e;font-weight:700}</style></head><body><main class="app"><div class="muted">KOFFYKRAFT</div><h1>Temporary Roastbook</h1><p class="sub">Local browser database for roast history. Clearing browser/site data can erase it, so keep backups.</p><section class="card"><div id="status">Opening database…</div></section><section class="card"><div class="row"><div><div class="stat" id="roastCount">0</div><div class="muted">Roasts</div></div><div><div class="stat" id="planCount">0</div><div class="muted">Plans</div></div></div></section><section class="card"><button class="btn" id="backup">Backup database</button> <button class="btn ghost" id="refreshBtn">Refresh</button><div style="margin-top:14px"><input type="file" id="restoreFile" accept="application/json"><br><button class="btn ghost" id="restore" style="margin-top:8px">Restore backup</button></div></section><section class="card"><strong>Recent roasts</strong><div id="list" class="muted" style="margin-top:8px">None yet.</div></section><p><a href="roast-timer-v14.html">Open V14 Roast Timer</a> · <a href="./">Working timer</a></p><footer class="muted">KoffyKraft Roastbook · Freeware · © 2026 KoffyKraft</footer></main><script>
const DB='KoffyKraftTemporaryRoastbook',VER=1;let db;const $=x=>document.getElementById(x);
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('roasts'))d.createObjectStore('roasts',{keyPath:'id'});if(!d.objectStoreNames.contains('plans'))d.createObjectStore('plans',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function all(s){return new Promise((ok,no)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function refresh(){const [rs,ps]=await Promise.all([all('roasts'),all('plans')]);$('roastCount').textContent=rs.length;$('planCount').textContent=ps.length;$('status').innerHTML='<strong>Database ready</strong><div class="muted">'+DB+' · this browser/device</div>';const a=rs.slice().reverse().slice(0,20);$('list').innerHTML=a.length?a.map(x=>'<div class="item"><strong>'+esc(x.identity?.estate||x.estate||x.coffee||'Roast')+'</strong><div class="muted">'+esc(x.identity?.coffeeCode||x.coffeeCode||'')+' '+esc(x.identity?.roastNo||x.roastNo||'')+'</div></div>').join(''):'None yet.'}
$('backup').onclick=async()=>{const p={format:DB,version:1,exportedAt:new Date().toISOString(),roasts:await all('roasts'),plans:await all('plans')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download='KoffyKraft_Roastbook_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('restore').onclick=async()=>{const f=$('restoreFile').files[0];if(!f)return alert('Choose a backup first.');let p;try{p=JSON.parse(await f.text())}catch(e){return alert('Invalid backup.')}for(const s of ['roasts','plans']){const tx=db.transaction(s,'readwrite'),os=tx.objectStore(s);for(const x of(p[s]||[]))if(x&&x.id!=null)os.put(x);await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}await refresh();alert('Backup restored.')};$('refreshBtn').onclick=refresh;openDB().then(refresh).catch(e=>$('status').textContent='Database error: '+e.message);
</script></body></html>
